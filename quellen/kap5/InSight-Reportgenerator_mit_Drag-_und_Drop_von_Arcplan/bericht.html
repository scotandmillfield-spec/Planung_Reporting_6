<style>

  #bericht .o-text { padding: 4px 8px; font-weight: bold; }
  #bericht .o-text.normal { font-weight: normal; }
  #bericht .o-wert { padding: 2px 8px 4px; text-align: right; font-weight: bold; }
  #bericht .o-hinweis { padding: 2px 8px 4px; color: var(--muted); }
  #bericht table.o-tab { border-collapse: collapse; }
  #bericht .o-tab th, #bericht .o-tab td { height: 22px; padding: 0 8px; text-align: right; font-weight: normal; }
  #bericht .o-tab th { border-bottom: 1px solid var(--ac); color: var(--muted); vertical-align: bottom; }
  #bericht .o-tab th:first-child, #bericht .o-tab td:first-child { text-align: left; }
  #bericht .o-tab tr.summe td { font-weight: bold; border-top: 1px solid var(--ac); }
  #bericht .o-tab td.sel { background: var(--ac); color: #FFFFFF; }
  #bericht .o-tab .schlitz { border-left: 1px dashed var(--ac); border-right: 1px dashed var(--ac); min-width: 96px; }

  #bericht .o-tab tr.summe td.schlitz { border-bottom: 1px dashed var(--ac); }

  #bericht .db-zeile .mk-feld { width: 200px; flex: 0 0 auto; margin-right: 6px; }
  #bericht .panes { display: grid; grid-template-columns: 140px 543px; column-gap: 12px; margin-top: 12px; align-items: start; }
  #bericht .tl { height: 22px; line-height: 22px; padding: 0 8px; white-space: nowrap; }
  body:not(.print) #bericht .tl { cursor: pointer; }
  #bericht .tl.aktiv { background: var(--ac); color: #FFFFFF; font-weight: bold; }
  #bericht .felder { display: grid; grid-template-columns: repeat(4, 1fr); height: 154px; align-content: start; }
  #bericht .felder .art { grid-column: 1 / -1; height: 22px; line-height: 22px; color: var(--muted); padding-left: 4px; }
  #bericht .fl { height: 22px; line-height: 22px; padding: 0 4px; white-space: nowrap; overflow: hidden; }

  #bericht .fl.quelle { border: 1px dashed var(--ac); line-height: 20px; padding: 0 3px; color: var(--muted); }
  body:not(.print) #bericht .fl:hover, #bericht .fl:focus { background: var(--anzeige); outline: none; }
  .zieh-geist { position: fixed; z-index: 50; pointer-events: none; background: #FFFFFF; border: 1px dashed #3A3F44;
