<!-- Abb. 5.72 „Standardbericht SAP ERP CC (Selektionsmaske)“: Selektionsmaske des Berichts „Kostenstellen: Ist/Soll/Abweichung“
     (softwareneutral nachgebaut). Gehört zu Abb. 5.73: Die Vorbelegung (Kostenrechnungskreis 1000, Geschäftsjahr 2026, Perioden
     1 bis 12, Planversion 0, Kostenstelle 1000) ist der Startzustand des Detailberichts; Stammdaten gleichlautend.
     Titelzeile wie Abb. 3.7. Raster: Maske 727 px = 110 mm; Inhalt 695 px = Beschriftung 160 · Feld 96 · „bis“ 28 · Feld 96 ·
     Text 283 (Spaltenabstand 8). Felder und Reihenfolge wie im Original: Abschnitte „Auswahl Werte“ und „Auswahl Gruppen“. -->
<style>
  #selektion .mk-kopf { display: block; height: auto; background: none; color: var(--text); padding: 12px 0 10px;
    margin: 0 15px; border-bottom: 1px solid var(--linie); line-height: normal; font-size: 14px; font-weight: normal; }
  #selektion .mk-kopf .kopf-titel { display: block; font-size: 22px; line-height: 26px; font-weight: bold; }
  #selektion .mk-kopf .kopf-unter { display: block; margin-top: 3px; line-height: 18px; color: var(--muted); }
  #selektion .sel { display: grid; grid-template-columns: 160px 96px 28px 96px 283px; column-gap: 8px; row-gap: 4px; align-items: center; }
  #selektion .sel > .c1 { grid-column: 2; }
  #selektion .sel > .c13 { grid-column: 2 / span 3; }
  #selektion .sel > .c2 { grid-column: 3; text-align: center; color: var(--muted); }
  #selektion .sel > .c3 { grid-column: 4; }
  #selektion .sel > .c4 { grid-column: 5; }
  #selektion .sel > .mk-label { grid-column: 1; }
  #selektion .text-link { display: flex; align-items: center; gap: 10px; }
  #selektion .text-link .mk-anzeige { flex: 1 1 auto; min-width: 0; }
  #selektion .text-link .mk-link { flex: 0 0 auto; }
  #selektion .mk-abschnitt.zu > :not(.mk-band) { display: none; }
</style>
<form class="mk-maske" id="selektion" autocomplete="off" novalidate>
  <div class="mk-kopf" id="kopf"><span class="kopf-titel" id="kopf-titel">Kostenstellen: Ist/Soll/Abweichung</span><span class="kopf-unter" id="kopf-unter">Selektion · Standardbericht der Kostenstellenrechnung</span></div>
  <div class="mk-inhalt">

    <section class="mk-abschnitt" id="abschnitt-werte">
      <div class="mk-band" id="band-werte">Auswahl Werte</div>
      <div class="sel" id="raster-werte">
        <label class="mk-label" for="f-krk">Kostenrechnungskreis</label>
        <select class="mk-feld c1" id="f-krk"><option value="1000" selected>1000</option></select>
        <div class="mk-feld mk-anzeige c4" id="a-krk"></div>

        <label class="mk-label" for="f-jahr">Geschäftsjahr</label>
        <input class="mk-feld mk-zahl c1" id="f-jahr" value="2026" inputmode="numeric" data-hilfe="Jahr vierstellig, z. B. 2026">

        <label class="mk-label" for="f-von">Von Periode</label>
        <input class="mk-feld mk-zahl c1" id="f-von" value="1" inputmode="numeric" data-hilfe="Periode 1 bis 12">
        <div class="mk-feld mk-anzeige c4" id="a-von"></div>

        <label class="mk-label" for="f-bis">Bis Periode</label>
        <input class="mk-feld mk-zahl c1" id="f-bis" value="12" inputmode="numeric" data-hilfe="Periode 1 bis 12, nicht vor der Von-Periode">
        <div class="mk-feld mk-anzeige c4" id="a-bis"></div>

        <label class="mk-label" for="f-version">Planversion</label>
        <select class="mk-feld c1" id="f-version"></select>
        <div class="mk-feld mk-anzeige c4" id="a-version"></div>

        <span class="mk-label" id="l-istbew">Istbewertung</span>
        <label class="mk-option c1" id="o-istbew"><input type="checkbox" class="mk-check" id="f-istbew" aria-labelledby="l-istbew"></label>
      </div>
    </section>

    <section class="mk-abschnitt" id="abschnitt-gruppen">
      <div class="mk-band" id="band-gruppen">Auswahl Gruppen</div>
      <div class="sel" id="raster-gruppen">
        <label class="mk-label" for="f-kstgr">Kostenstellengruppe</label>
        <select class="mk-feld c13" id="f-kstgr"></select>

        <label class="mk-label" for="f-kst-von">oder Wert(e)</label>
        <input class="mk-feld mk-zahl c1" id="f-kst-von" value="1000" inputmode="numeric" aria-label="Kostenstelle von" data-hilfe="Kostenstelle, z. B. 1000">
        <span class="c2">bis</span>
        <input class="mk-feld mk-zahl c3" id="f-kst-bis" value="" inputmode="numeric" aria-label="Kostenstelle bis" data-hilfe="optional: obere Grenze des Intervalls">
        <div class="c4 text-link"><div class="mk-feld mk-anzeige" id="a-kst"></div><a class="mk-link" id="l-kst">Mehrfachauswahl</a></div>

        <label class="mk-label" for="f-kagr">Kostenartengruppe</label>
        <select class="mk-feld c13" id="f-kagr"></select>

        <label class="mk-label" for="f-ka-von">oder Wert(e)</label>
        <input class="mk-feld mk-zahl c1" id="f-ka-von" value="" inputmode="numeric" aria-label="Kostenart von" data-hilfe="Kostenart, z. B. 470000">
        <span class="c2">bis</span>
        <input class="mk-feld mk-zahl c3" id="f-ka-bis" value="" inputmode="numeric" aria-label="Kostenart bis" data-hilfe="optional: obere Grenze des Intervalls">
        <div class="c4 text-link"><div class="mk-feld mk-anzeige" id="a-ka"></div><a class="mk-link" id="l-ka">Mehrfachauswahl</a></div>
      </div>
      <div class="mk-knopfleiste">
        <button type="button" class="mk-knopf" id="k-ausfuehren">Ausführen</button>
        <button type="button" class="mk-knopf mk-zweit" id="k-datenquelle">Datenquelle …</button>
      </div>
    </section>

  </div>
</form>
