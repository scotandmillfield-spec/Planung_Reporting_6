<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detaillierte Umsatzplanung auf Ebene Kunde/Artikel</title>
<style>
/* maskkit.css – softwareneutrale Eingabemasken im Buchstil (6. Auflage)
   Maßstab wie bei den Dashboards: 727 px = 110 mm (Abbildungsbreite), 1024 px = 155 mm; 14 px = 6 pt im Druck.
   Rollen: Eingabefeld weiß mit Rahmen · Anzeigefeld grau ohne Rahmen · Abschnittsband · Gruppenkopf · Knopf. */
:root {
  --ac: #3A3F44;          /* Anthrazit: Kopfleiste, Knopf, Pfeile, Links */
  --text: #1A1A1A;
  --muted: #4D4D4D;
  --rahmen: #9A9A9A;      /* Kontur der Eingabefelder und der Maske */
  --linie: #D9D9D9;       /* Haarlinien */
  --anzeige: #EFEFEF;     /* Anzeigefelder (nicht editierbar) */
  --band: #F6F6F6;        /* Abschnittsband */
  --schlecht: #C62828;    /* nur Fehlermeldungen in der interaktiven Fassung */
  --gut: #00806B;
  --schrift: Arial, "Liberation Sans", Helvetica, sans-serif;
  --zh: 26px;             /* Feldhöhe */
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #ECECEC; color: var(--text); font-family: var(--schrift); }
body.print { background: #FFFFFF; }

/* ---------- Lernplattform-Leiste und Panel (nicht im Druck) ---------- */
.mk-leiste { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: #FFFFFF;
  border-bottom: 1px solid var(--linie); display: flex; align-items: center; gap: 8px; padding: 0 16px;
  font-size: 14px; z-index: 30; }
.mk-leiste .mk-leiste-titel { font-weight: bold; margin-right: auto; }
.mk-leiste button { font: inherit; font-size: 14px; color: var(--text); background: #FFFFFF;
  border: 1px solid var(--rahmen); border-radius: 3px; padding: 6px 12px; cursor: pointer; }
.mk-leiste button[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: #FFFFFF; }
body.print .mk-leiste, body.print .mk-panel, body.print .mk-meldung { display: none !important; }
.mk-buehne { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; overflow: auto; }
body.print .mk-buehne { position: static; overflow: visible; }
.mk-rahmen { margin: 16px auto; box-shadow: 0 1px 3px rgba(0,0,0,.18); background: #FFFFFF; }
body.print .mk-rahmen { margin: 0; box-shadow: none; }
.mk-seite { position: relative; transform-origin: 0 0; background: #FFFFFF; }

.mk-marke { position: absolute; z-index: 20; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px;
  background: var(--ac); color: #FFFFFF; font-size: 13px; font-weight: bold; display: flex; align-items: center;
  justify-content: center; box-shadow: 0 0 0 2px #FFFFFF; cursor: pointer; }
.mk-marke.gestaltung { background: #FFFFFF; color: var(--ac); border: 2px solid var(--ac); }
.mk-marke.aktiv { background: var(--schlecht); color: #FFFFFF; border-color: var(--schlecht); }
.mk-panel { position: fixed; top: 44px; right: 0; bottom: 0; width: 380px; background: #FFFFFF;
  border-left: 1px solid var(--linie); overflow: auto; padding: 16px 18px; font-size: 14px; line-height: 1.4;
  z-index: 25; display: none; }
.mk-panel h2 { font-size: 17px; margin: 0 0 4px; }
.mk-panel .mk-panel-intro { color: var(--muted); margin-bottom: 12px; }
.mk-panel .mk-eintrag { padding: 10px 0; border-top: 1px solid var(--linie); cursor: pointer; }
.mk-panel .mk-eintrag.aktiv { background: var(--band); margin: 0 -18px; padding: 10px 18px; }
.mk-panel .mk-eintrag-kopf { display: flex; gap: 8px; align-items: baseline; font-weight: bold; }
.mk-panel .mk-regel { font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: bold; }
.mk-meldung { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ac); color: #FFFFFF;
  padding: 10px 16px; border-radius: 3px; font-size: 14px; z-index: 40; display: none; }
.mk-markiert { outline: 2px solid var(--schlecht); outline-offset: 2px; }

/* ---------- Maske ---------- */
.mk-maske { position: relative; width: 727px; background: #FFFFFF; border: 1px solid var(--rahmen);
  font-size: 14px; line-height: 18px; color: var(--text); margin: 0; }
.mk-kopf { height: 30px; background: var(--ac); color: #FFFFFF; font-size: 16px; font-weight: bold;
  line-height: 30px; padding: 0 15px; display: flex; justify-content: space-between; }
.mk-kopf .mk-kopf-info { font-weight: normal; font-size: 14px; color: #FFFFFF; }
.mk-inhalt { padding: 14px 15px 16px; }

/* Abschnitt mit Band (in der interaktiven Fassung auf- und zuklappbar) */
.mk-abschnitt + .mk-abschnitt { margin-top: 18px; }
.mk-band { height: 26px; line-height: 26px; background: var(--band); color: var(--ac); font-size: 14px; font-weight: bold;
  text-transform: uppercase; letter-spacing: .02em; padding: 0 8px; margin-bottom: 10px; position: relative; }
.mk-band .mk-klapp { position: absolute; right: 9px; top: 10px; }
body:not(.print) .mk-band { cursor: pointer; user-select: none; }
.mk-abschnitt.zu > :not(.mk-band) { display: none; }
.mk-abschnitt.zu .mk-klapp { transform: rotate(180deg); }

/* Gruppen */
.mk-gruppenkopf { font-weight: bold; height: 24px; line-height: 18px; border-bottom: 1px solid var(--rahmen);
  margin-bottom: 6px; white-space: nowrap; overflow: hidden; }
.mk-gruppe + .mk-gruppe { margin-top: 12px; }

/* Zeilen: Beschriftung + Feld(er); Spaltenbreiten über --sp-label, --sp-feld */
.mk-zeile { display: grid; grid-template-columns: var(--sp-label, 160px) var(--sp-feld, 192px); column-gap: 8px;
  align-items: center; min-height: var(--zh); }
.mk-zeile + .mk-zeile { margin-top: 4px; }
.mk-label { white-space: nowrap; overflow: hidden; }
.mk-label.mk-neben, .mk-neben { color: var(--muted); }
.mk-feldgruppe { display: flex; align-items: center; gap: 0; }
.mk-feldgruppe > .mk-feld { flex: 1 1 0; min-width: 0; }
.mk-feldgruppe > .mk-zwischen { flex: 0 0 auto; padding: 0 6px; color: var(--muted); }
.mk-feld.mk-datum { padding: 0 4px; text-align: center; }

/* Felder: input, select, textarea und deren Druckfassung (div) sehen gleich aus */
.mk-feld { display: block; width: 100%; height: var(--zh); margin: 0; padding: 0 7px; border: 1px solid var(--rahmen);
  border-radius: 2px; background: #FFFFFF; color: var(--text); font: inherit; font-size: 14px; line-height: 24px;
  white-space: nowrap; overflow: hidden; text-overflow: clip; position: relative; text-align: left; }
input.mk-feld, select.mk-feld, textarea.mk-feld { -webkit-appearance: none; appearance: none; outline: none; }
input.mk-feld:focus, select.mk-feld:focus, textarea.mk-feld:focus { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac); }
.mk-feld.mk-zahl { text-align: right; }
.mk-feld.mk-mitte { text-align: center; }
.mk-feld.mk-anzeige { background: var(--anzeige); border-color: var(--anzeige); }
.mk-feld.mk-leer { color: var(--muted); }
.mk-feld.mk-fehler { border-color: var(--schlecht); box-shadow: 0 0 0 1px var(--schlecht); }
select.mk-feld, .mk-feld.mk-auswahl { padding-right: 24px; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><polygon points='0,0 8,0 4,5' fill='%233A3F44'/></svg>");
  background-repeat: no-repeat; background-position: right 9px center; background-size: 8px 5px; }
div.mk-feld.mk-auswahl { background-image: none; }
.mk-feld .mk-pfeil { position: absolute; right: 9px; top: 10px; }
textarea.mk-feld, .mk-feld.mk-mehrzeilig { height: auto; white-space: pre-wrap; line-height: 18px; padding: 6px 8px; resize: none; }

/* Mehrzeiliger Anzeige- bzw. Textbereich (z. B. Brief), Absätze als <p> */
.mk-textbereich { border: 1px solid var(--rahmen); border-radius: 2px; background: #FFFFFF; padding: 8px 10px;
  font-size: 14px; line-height: 18px; overflow: hidden; }
.mk-textbereich.mk-anzeige { background: var(--anzeige); border-color: var(--anzeige); }
.mk-textbereich p { margin: 0 0 8px; }
.mk-textbereich p:last-child { margin-bottom: 0; }

/* Links */
.mk-link, a.mk-link { color: var(--ac); text-decoration: underline; cursor: pointer; }

/* Knöpfe */
.mk-knopf { display: inline-block; height: 30px; padding: 0 16px; border-radius: 3px; border: 1px solid var(--ac);
  background: var(--ac); color: #FFFFFF; font: inherit; font-size: 14px; font-weight: bold; line-height: 28px; cursor: pointer;
  white-space: nowrap; margin: 0; vertical-align: top; }
.mk-knopf.mk-zweit { background: #FFFFFF; color: var(--ac); }
button.mk-knopf { -webkit-appearance: none; appearance: none; }
.mk-knopfleiste { display: flex; gap: 8px; margin-top: 16px; }

/* Kontrollkästchen und Optionsfelder (Druckfassung als SVG) */
.mk-option { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
input.mk-check { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin: 0; border: 1px solid var(--rahmen);
  border-radius: 2px; background: #FFFFFF; position: relative; cursor: pointer; flex: 0 0 auto; }
input.mk-check[type="radio"] { border-radius: 7px; }
input.mk-check:checked { background: var(--ac); border-color: var(--ac); }
input.mk-check[type="checkbox"]:checked::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px;
  border: solid #FFFFFF; border-width: 0 2px 2px 0; transform: rotate(45deg); }
input.mk-check[type="radio"]:checked { background: #FFFFFF; }
input.mk-check[type="radio"]:checked::after { content: ""; position: absolute; left: 3px; top: 3px; width: 6px; height: 6px;
  border-radius: 3px; background: var(--ac); }
.mk-check-druck { width: 14px; height: 14px; flex: 0 0 auto; display: block; }

/* Raster / Tabelle mit Eingabezellen */
table.mk-tabelle { border-collapse: separate; border-spacing: 0 4px; margin: -4px 0; }
table.mk-tabelle th { font-weight: normal; color: var(--muted); text-align: left; padding: 0 8px 0 0; height: var(--zh); white-space: nowrap; }
table.mk-tabelle td { padding: 0 8px 0 0; height: var(--zh); white-space: nowrap; }
table.mk-tabelle td:last-child, table.mk-tabelle th:last-child { padding-right: 0; }

/* Reiter */
.mk-reiter { display: flex; gap: 2px; border-bottom: 1px solid var(--ac); margin-bottom: 10px; }
.mk-reiter > * { height: 26px; line-height: 26px; padding: 0 12px; background: var(--anzeige); color: var(--text); white-space: nowrap; }
.mk-reiter > .aktiv { background: var(--ac); color: #FFFFFF; font-weight: bold; }

/* Hilfsklassen für das Raster */
.mk-spalten { display: grid; grid-template-columns: var(--sp-links, 360px) var(--sp-rechts, 315px); column-gap: 20px; align-items: start; }
.mk-nur-interaktiv { }
body.print .mk-nur-interaktiv { display: none !important; }

</style>
</head>
<body>
<!-- Abb. 3.185 „Detaillierte Umsatzplanung auf Ebene Kunde/Artikel“: Maske „Übersicht Absatz-/Umsatzplanung“
     (softwareneutral nachgebaut). Querformat 1024 px = 155 mm; Inhalt 992 px.
     Gleiche Stammdaten wie Abb. 3.184: Savings je Materialgruppe und Rabatt je Kundengruppe kommen dort aus der
     Gruppenplanung und stehen hier als Vorschlag je Artikel (manuell überschreibbar).
     Raster: Kunde 104 · Material 64 · Bezeichnung 180 · Auswahl 62 · Planabsatz 76 · Vk-Preis 76 · Saving 76 + 92 ·
     Nettopreis 80 · Rabatt 64 · Planumsatz 86 = 960 px. Zellen wie Abb. 3.179/3.183. -->
<style>
  #umsatz { width: 1024px; --sp-label: 130px; --sp-feld: 220px; }
  #umsatz .mk-kopf { display: block; height: auto; background: none; color: var(--text); padding: 12px 0 10px;
    margin: 0 15px; border-bottom: 1px solid var(--linie); line-height: normal; font-size: 14px; font-weight: normal; }
  #umsatz .mk-kopf .kopf-titel { display: block; font-size: 22px; line-height: 26px; font-weight: bold; }
  #umsatz .mk-kopf .kopf-unter { display: block; margin-top: 3px; line-height: 18px; color: var(--muted); }
  /* Auswahl: zwei Zeilen, rechts eine zweite Spalte */
  #umsatz .auswahl { display: grid; grid-template-columns: 358px 358px; column-gap: 40px; row-gap: 4px; margin-bottom: 14px; }
  #umsatz .auswahl .mk-zeile + .mk-zeile { margin-top: 0; }
  #umsatz .auswahl .kunde { display: flex; align-items: center; color: var(--muted); }
  /* Raster */
  #umsatz .mx { display: grid; grid-template-columns: 104px 64px 180px 62px 76px 76px 76px 92px 80px 64px 86px; }
  #umsatz .mx-k { height: 21px; line-height: 21px; padding: 0 4px; text-align: right; color: var(--muted);
    white-space: nowrap; overflow: hidden; }
  #umsatz .mx-k.links { text-align: left; }
  #umsatz .mx-k.mitte { text-align: center; }
  #umsatz .mx-k.gruppe { text-align: left; color: var(--text); font-weight: bold; border-bottom: 1px solid var(--rahmen); margin-left: 4px; }
  #umsatz .mx-k.k2 { border-bottom: 1px solid var(--ac); }
  #umsatz .mx-k.unten { height: 42px; padding-top: 21px; }
  #umsatz .mx-b { border-bottom: 1px solid var(--rahmen); padding: 3px 4px 0 4px; }
  #umsatz .mx-b .mk-label { display: block; height: 18px; line-height: 18px; }
  #umsatz .mx-b .mk-label:first-child { font-weight: bold; }
  #umsatz .mx-l { height: 24px; line-height: 23px; padding: 0 4px; white-space: nowrap; overflow: hidden; border-bottom: 1px solid #D4D4D4; }
  #umsatz .mx-r { height: 24px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #D4D4D4; }
  #umsatz .mx .mk-feld { height: 24px; line-height: 23px; padding: 0 4px; border: 0; border-radius: 0;
    border-left: 1px solid #D4D4D4; border-bottom: 1px solid #D4D4D4; background: #FFFFFF; }
  #umsatz .mx .mk-feld.mk-anzeige { background: var(--anzeige); border-left-color: #FFFFFF; border-bottom-color: #FFFFFF; }
  #umsatz .mx .mk-feld.mk-fehler { border-color: var(--schlecht); box-shadow: inset 0 0 0 1px var(--schlecht); }
  #umsatz .mx .summe { font-weight: bold; }
  #umsatz .mx .mx-l.summe { border-bottom: 0; border-top: 1px solid var(--ac); }
  #umsatz .mx .mk-feld.summe { border-top: 1px solid var(--ac); height: 25px; }
  #umsatz .mx .leer { border-top: 1px solid var(--ac); height: 25px; }
</style>
<form class="mk-maske" id="umsatz" autocomplete="off" novalidate>
  <div class="mk-kopf" id="kopf"><span class="kopf-titel" id="kopf-titel">Übersicht Absatz-/Umsatzplanung</span><span class="kopf-unter" id="kopf-unter">Budget 2028 · Planung je Kunde und Artikel · Mengen in Stück, Preise und Umsatz in €, Savings und Rabatt in %</span></div>
  <div class="mk-inhalt">
    <div class="auswahl" id="auswahl">
      <div class="mk-zeile">
        <label class="mk-label" for="f-kg">Kundengruppe 3</label>
        <select class="mk-feld" id="f-kg"></select>
      </div>
      <div class="kunde"><span class="mk-label mk-neben" id="kunden-info"></span></div>
      <div class="mk-zeile">
        <label class="mk-label" for="f-mg2">Materialgruppe 2</label>
        <select class="mk-feld" id="f-mg2"></select>
      </div>
      <div class="mk-zeile">
        <label class="mk-label" for="f-mg3">Materialgruppe 3</label>
        <select class="mk-feld" id="f-mg3"></select>
      </div>
    </div>

    <div class="mx" id="raster">
      <div class="mx-k links k2 unten" style="grid-row:1 / span 2;grid-column:1">Kunde</div>
      <div class="mx-k links k2 unten" style="grid-row:1 / span 2;grid-column:2">Material</div>
      <div class="mx-k links k2 unten" style="grid-row:1 / span 2;grid-column:3">Bezeichnung</div>
      <div class="mx-k mitte k2 unten" style="grid-row:1 / span 2;grid-column:4">Auswahl</div>
      <div class="mx-k" style="grid-row:1;grid-column:5">Planabsatz</div>
      <div class="mx-k k2" style="grid-row:2;grid-column:5">in Stück</div>
      <div class="mx-k" style="grid-row:1;grid-column:6">Vk-Preis</div>
      <div class="mx-k k2" id="h-vk" style="grid-row:2;grid-column:6">in €</div>
      <div class="mx-k gruppe" id="h-saving" style="grid-row:1;grid-column:7 / span 2">Saving in %</div>
      <div class="mx-k k2" style="grid-row:2;grid-column:7">beeinfl.</div>
      <div class="mx-k k2" style="grid-row:2;grid-column:8">nicht beeinfl.</div>
      <div class="mx-k" style="grid-row:1;grid-column:9">Nettopreis</div>
      <div class="mx-k k2" style="grid-row:2;grid-column:9">n. Saving</div>
      <div class="mx-k" style="grid-row:1;grid-column:10">Rabatt</div>
      <div class="mx-k k2" style="grid-row:2;grid-column:10">in %</div>
      <div class="mx-k" id="h-umsatz" style="grid-row:1;grid-column:11">Planumsatz</div>
      <div class="mx-k k2" style="grid-row:2;grid-column:11">in €</div>
      <!-- Zeilen erzeugt umsatz.js -->
    </div>

    <div class="mk-knopfleiste">
      <button type="button" class="mk-knopf" id="k-sichern">Sichern</button>
      <button type="button" class="mk-knopf mk-zweit" id="k-aktualisieren">Aktualisieren</button>
      <button type="button" class="mk-knopf mk-zweit" id="k-perioden">Periodenwerte planen</button>
      <button type="button" class="mk-knopf mk-zweit" id="k-verteilen">Jahreswerte auf Perioden verteilen</button>
    </div>
  </div>
</form>

<script>
/* maskkit.js – softwareneutrale Eingabemasken im Buchstil (6. Auflage)
   Die Maske ist HTML5 (<form class="mk-maske">) mit den Klassen aus maskkit.css.
   ?print: Druckfassung – Steuerelemente werden zu statischen Elementen gleicher Geometrie, ohne Leiste.
   MK.exportieren() liefert alle Flächen, Linien, Formen und Textzeilen in px für die PowerPoint-Ausgabe. */
const MK = (() => {
  "use strict";
  const Q = new URLSearchParams(location.search);
  const PRINT = Q.has("print");
  if (PRINT) document.body.classList.add("print");
  const NS = "http://www.w3.org/2000/svg";
  const NBSP = String.fromCharCode(0xA0), MINUS = String.fromCharCode(0x2212);

  /* ---------------- DOM/SVG ---------------- */
  function el(tag, attrs = {}, parent, text) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
    }
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function sv(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  // Pfeil nach unten (Auswahlfeld) bzw. oben (Klappband), 8 x 5 px
  function pfeil(cls, oben = false) {
    const s = sv("svg", { width: 8, height: 5, viewBox: "0 0 8 5", class: cls, "aria-hidden": "true" });
    sv("polygon", { points: oben ? "0,5 8,5 4,0" : "0,0 8,0 4,5", fill: "#3A3F44" }, s);
    return s;
  }

  /* ---------------- Zahlen und Datum (deutsches Format) ---------------- */
  const NF = {};
  const nf = nk => NF[nk] || (NF[nk] = new Intl.NumberFormat("de-DE", { minimumFractionDigits: nk, maximumFractionDigits: nk }));
  function zahl(v, nk = 1) { return v == null || isNaN(v) ? "" : (v < 0 ? MINUS : "") + nf(nk).format(Math.abs(v)); }
  function leseZahl(text) {
    const t = String(text).trim().replace(MINUS, "-").replace(/\s/g, "");
    if (!t) return null;
    if (!/^-?(\d{1,3}(\.\d{3})+|\d+)(,\d+)?$/.test(t)) return NaN;
    return parseFloat(t.replace(/\./g, "").replace(",", "."));
  }
  function leseDatum(text) {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(text).trim());
    if (!m) return null;
    const d = new Date(+m[3], +m[2] - 1, +m[1]);
    return d.getMonth() === +m[2] - 1 ? d : null;
  }
  function datum(d) { return d ? String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear() : ""; }
  // Eingabe prüfen und markieren; liefert den Wert oder null
  function pruefeFeld(feld, art = "zahl", opt = {}) {
    const t = feld.value;
    let v = null, ok = true;
    if (art === "zahl") {
      v = leseZahl(t);
      ok = v === null ? !opt.pflicht : !isNaN(v) && (opt.min == null || v >= opt.min) && (opt.max == null || v <= opt.max);
    } else if (art === "datum") {
      v = leseDatum(t);
      ok = t.trim() === "" ? !opt.pflicht : v !== null;
    }
    feld.classList.toggle("mk-fehler", !ok);
    feld.title = ok ? (feld.dataset.hilfe || "") : (opt.meldung || "Eingabe prüfen");
    return ok ? v : null;
  }

  /* ---------------- Seite, Skalierung, Leiste ---------------- */
  let seite, rahmen, buehne, panel, maske, meldungEl, leiste, B = 727, H = 0;
  function init(o = {}) {
    document.title = o.titel || document.title;
    maske = document.querySelector(o.maske || ".mk-maske");
    if (!maske) throw new Error("Keine .mk-maske gefunden");
    if (!PRINT) {
      leiste = el("div", { class: "mk-leiste" }, document.body);
      el("div", { class: "mk-leiste-titel" }, leiste, o.titel || "");
    }
    buehne = el("div", { class: "mk-buehne" }, document.body);
    rahmen = el("div", { class: "mk-rahmen" }, buehne);

  function skalieren() {

  /* ---------------- Druckfassung: Steuerelemente -> statische Elemente ---------------- */
  let fertigGemeldet = false;
  function kopieAttribute(von, nach) {

  function druckfassung() {

  // Am Ende des Masken-Skripts aufrufen: setzt die Druckfassung und skaliert

  /* ---------------- Ebenen der Lernplattform: Erläuterungen und Gestaltung ---------------- */
  function zielElement(z) { return !z ? null : document.getElementById(z) || maske.querySelector(z); }
  function ebenen(o) {
    if (PRINT) return;
    let modus = null;
    const marken = [], knoepfe = {};
    const arten = [["erlaeuterungen", "Erläuterungen", ""], ["gestaltung", "Gestaltung", "gestaltung"]].filter(([k]) => o[k]);
    arten.forEach(([k, text]) => {
      const b = el("button", { type: "button", "aria-pressed": "false" }, leiste, text);
      b.addEventListener("click", () => umschalten(k));

    });
    function markenWeg() { marken.forEach(m => m.remove()); marken.length = 0; maske.querySelectorAll(".mk-markiert").forEach(e => e.classList.remove("mk-markiert")); }
    function markeSetzen(eintrag, text, cls) {
      const z = zielElement(eintrag.ziel);
      if (!z || !z.offsetParent) return;
      const [dx, dy] = eintrag.versatz || [0, 0];

    }
    function aktiv(text, eintrag) {
      panel.querySelectorAll(".mk-eintrag").forEach(e => e.classList.toggle("aktiv", e.dataset.marke === text));
      marken.forEach(m => m.classList.toggle("aktiv", m.textContent === text));
      maske.querySelectorAll(".mk-markiert").forEach(e => e.classList.remove("mk-markiert"));
      const z = eintrag && zielElement(eintrag.ziel);
      if (z) z.classList.add("mk-markiert");

    }
    function umschalten(k) {
      modus = modus === k ? null : k;
      Object.entries(knoepfe).forEach(([a, b]) => b.setAttribute("aria-pressed", String(modus === a)));
      markenWeg(); panel.textContent = "";
      panel.style.display = modus ? "block" : "none";
      skalieren();
      if (!modus) return;
      const def = o[modus], cls = modus === "gestaltung" ? "gestaltung" : "";
      el("h2", {}, panel, def.titel || (modus === "gestaltung" ? "Gestaltung" : "Erläuterungen"));
      if (def.intro) el("div", { class: "mk-panel-intro" }, panel, def.intro);
      def.eintraege.forEach(r => {

        if (r.regel) el("div", { class: "mk-regel" }, e, r.regel);

    MK._ebenenNeu = () => { if (modus) { const m = modus; modus = null; umschalten(m); } };

  /* ---------------- Export für PowerPoint (Druckfassung) ---------------- */
  function farbe(c) {
    const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/.exec(c || "");
    if (!m) return null;
    const a = m[4] === undefined ? 1 : parseFloat(m[4]);
    const hex = [m[1], m[2], m[3]].map(v => Math.round(+v).toString(16).padStart(2, "0")).join("").toUpperCase();
    return { hex, a };
  }
  function exportieren() {
    const R = maske.getBoundingClientRect();
    const formen = [];
    const name = e => e.id || e.dataset.name || (e.className && typeof e.className === "string" ? e.className.split(" ")[0] : e.tagName);
    const sichtbar = s => s.w > 0 && s.st !== "none" && s.st !== "hidden" && s.c && s.c.a > 0;
    function kasten(e, cs) {
      const r = e.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const bg = farbe(cs.backgroundColor);
      const seiten = ["Top", "Right", "Bottom", "Left"].map(s => ({ w: parseFloat(cs["border" + s + "Width"]) || 0,
        c: farbe(cs["border" + s + "Color"]), st: cs["border" + s + "Style"] }));
      const gleich = seiten.every(s => sichtbar(s) && s.w === seiten[0].w && s.c.hex === seiten[0].c.hex && s.st === seiten[0].st);
      const x = r.left - R.left, y = r.top - R.top, rad = parseFloat(cs.borderTopLeftRadius) || 0;
      const fuell = bg && bg.a > 0.01 ? bg.hex : null;
      if (fuell || gleich) {
        const lw = gleich ? seiten[0].w : 0;
        formen.push({ t: "rect", name: name(e), x: x + lw / 2, y: y + lw / 2, w: r.width - lw, h: r.height - lw,
                      fill: fuell, line: gleich ? seiten[0].c.hex : null, lw, dash: gleich && seiten[0].st === "dashed", r: rad });
      }
      if (!gleich) seiten.forEach((s, i) => {
        if (!sichtbar(s)) return;
        const h = s.w / 2;
        const p = [[x, y + h, x + r.width, y + h], [x + r.width - h, y, x + r.width - h, y + r.height],
                   [x, y + r.height - h, x + r.width, y + r.height - h], [x + h, y, x + h, y + r.height]][i];
        formen.push({ t: "linie", name: name(e), x1: p[0], y1: p[1], x2: p[2], y2: p[3], farbe: s.c.hex, lw: s.w, dash: s.st === "dashed" });
      });
    }
    function svgFormen(svg) {
      svg.querySelectorAll("polygon, polyline, rect, circle, line").forEach(k => {
        const cs = getComputedStyle(k), M = k.getScreenCTM();
        const pt = (x, y) => { const p = new DOMPoint(x, y).matrixTransform(M); return [p.x - R.left, p.y - R.top]; };
        const f = farbe(cs.fill), s = farbe(cs.stroke), lw = parseFloat(cs.strokeWidth) || 0;
        const fill = f && f.a > 0.01 ? f.hex : null, line = s && s.a > 0.01 && lw > 0 ? s.hex : null;
        const tag = k.tagName.toLowerCase();
        if (tag === "polygon" || tag === "polyline") {
          const pts = [...k.points].map(p => pt(p.x, p.y));
          formen.push({ t: "poly", name: "Form", pts, zu: tag === "polygon", fill: tag === "polygon" ? fill : null, line, lw });
        } else if (tag === "rect") {
          const x = +k.getAttribute("x") || 0, y = +k.getAttribute("y") || 0, w = +k.getAttribute("width"), h = +k.getAttribute("height");
          const a = pt(x, y), b = pt(x + w, y + h);
          formen.push({ t: "rect", name: "Form", x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1], fill, line, lw, r: +k.getAttribute("rx") || 0 });
        } else if (tag === "circle") {
          const cx = +k.getAttribute("cx"), cy = +k.getAttribute("cy"), r = +k.getAttribute("r");
          const a = pt(cx - r, cy - r), b = pt(cx + r, cy + r);
          formen.push({ t: "oval", name: "Form", x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1], fill, line, lw });
        } else if (tag === "line") {
          const a = pt(+k.getAttribute("x1"), +k.getAttribute("y1")), b = pt(+k.getAttribute("x2"), +k.getAttribute("y2"));
          formen.push({ t: "linie", name: "Linie", x1: a[0], y1: a[1], x2: b[0], y2: b[1], farbe: line, lw });
        }
      });
    }
    function text(n) {
      const t = n.textContent;
      if (!t.trim()) return;
      const p = n.parentElement, cs = getComputedStyle(p);
      const woerter = [], re = /[^\s]+/g;
      let m;
      while ((m = re.exec(t))) {
        const rg = document.createRange();
        rg.setStart(n, m.index); rg.setEnd(n, m.index + m[0].length);
        const rs = [...rg.getClientRects()].filter(r => r.width > 0);
        if (rs.length) woerter.push({ a: m.index, b: m.index + m[0].length, r: rs[0] });
      }
      if (!woerter.length) return;
      const zeilen = [];
      woerter.forEach(w => {
        const z = zeilen[zeilen.length - 1];
        if (z && Math.abs(z.top - w.r.top) < 2) { z.b = w.b; z.right = Math.max(z.right, w.r.right); z.bottom = Math.max(z.bottom, w.r.bottom); }
        else zeilen.push({ a: w.a, b: w.b, left: w.r.left, right: w.r.right, top: w.r.top, bottom: w.r.bottom });
      });

      const unter = (cs.textDecorationLine || cs.textDecoration || "").includes("underline");
      formen.push({ t: "text", name: name(p), groesse: parseFloat(cs.fontSize), fett: parseInt(cs.fontWeight, 10) >= 600,
        kursiv: cs.fontStyle === "italic", farbe: (farbe(cs.color) || { hex: "1A1A1A" }).hex, unter,
        ausr: { right: "r", end: "r", center: "c" }[cs.textAlign] || "l",
        sperr: parseFloat(cs.letterSpacing) || 0,
        zeilen: zeilen.map(z => {
          let s = t.slice(z.a, z.b).replace(/[ \t\n\r]+/g, " ");

        }) });

      n.childNodes.forEach(gehe);
    }
    gehe(maske);

  /* ---------------- Prüfungen (Druckfassung) ---------------- */
  function kontrast(a, b) {
    const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
    const L = h => 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16));
    const [x, y] = [L(a), L(b)].sort((p, q) => q - p);
    return (x + 0.05) / (y + 0.05);
  }
  function pruefen() {
    const R = maske.getBoundingClientRect(), probleme = [];
    const kurz = s => s.trim().replace(/\s+/g, " ").slice(0, 40);
    maske.querySelectorAll("*").forEach(e => {
      const cs = getComputedStyle(e);
      if (cs.display === "none" || e.closest("svg")) return;
      const r = e.getBoundingClientRect();
      if (r.width && (r.left < R.left - 0.5 || r.right > R.right + 0.5 || r.bottom > R.bottom + 0.5))
        probleme.push(`Überlauf aus der Maske: ${e.className || e.tagName} „${kurz(e.textContent)}“`);
      if (e.textContent.trim() && (cs.overflow === "hidden" || cs.overflowX === "hidden") &&
          (e.scrollWidth > e.clientWidth + 1 || e.scrollHeight > e.clientHeight + 1))
        probleme.push(`Text abgeschnitten: „${kurz(e.textContent)}“`);
    });
    const tw = document.createTreeWalker(maske, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = tw.nextNode())) {
      if (!n.textContent.trim()) continue;
      const p = n.parentElement, cs = getComputedStyle(p);
      if (cs.display === "none") continue;
      if (parseFloat(cs.fontSize) < 13.9) probleme.push(`Schrift unter 6 pt (${cs.fontSize}): „${kurz(n.textContent)}“`);
      let a = p, bg = null;
      while (a && !bg) { const f = farbe(getComputedStyle(a).backgroundColor); if (f && f.a > 0.5) bg = f.hex; a = a.parentElement; }
      const fg = farbe(cs.color);

    }
    return [...new Set(probleme)];
  }

  return { PRINT, NBSP, MINUS, el, sv, pfeil, zahl, leseZahl, leseDatum, datum, pruefeFeld, init, fertig, skalieren,
           meldung, ebenen, exportieren, pruefen, druckfassung };
})();

<script>

  const pos = (z, s, n = 1) => `grid-row:${z};grid-column:${s}${n > 1 ? " / span " + n : ""}`;
  const FELDER = [
    ["vk", 6, 2, { min: 0, max: 99999, meldung: "Preis in € mit Dezimalkomma, z. B. 181,65" }, "Vk-Preis in €"],

    ["rab", 10, 1, { min: 0, max: 50, meldung: "Prozentwert von 0 bis 50, z. B. 2,0" }, "Rabatt in %"],
  ];
  let ZEILEN = [];   // [Artikel, Planwerte, Index]
  function aufbauen() {
    raster.querySelectorAll(".zeile").forEach(e => e.remove());
    const kg = $("f-kg").value, kunde = KUNDEN[kg][0], kd = kunde[0];
    const m2 = $("f-mg2").value, m3 = $("f-mg3").value;
    $("kunden-info").textContent = `Kunde ${kd} ${kunde[1]} ${kunde[2]}`;
    ZEILEN = ARTIKEL[kd].map((a, i) => [a, W[kd][i], i]).filter(([a]) => (m2 === "*" || a[2] === m2) && (m3 === "*" || a[3] === m3));
    const n = ZEILEN.length;
    const kb = el("div", { class: "mx-b zeile", id: "b-kunde", style: `grid-row:3 / span ${Math.max(n, 1)};grid-column:1` }, raster);
    [kd, kunde[1], kunde[2]].forEach(t => el("span", { class: "mk-label" }, kb, t));
    ZEILEN.forEach(([a, w], i) => {
      const z = 3 + i;
      el("span", { class: "mk-label mx-l zeile", id: `m-${i}`, style: pos(z, 2) }, raster, a[0]);
      el("span", { class: "mk-label mx-l zeile", id: `t-${i}`, style: pos(z, 3) }, raster, a[1]);
      const rz = el("div", { class: "mx-r zeile", id: `r-${i}`, style: pos(z, 4) }, raster);
      const lab = el("label", { class: "mk-option" }, rz);
      el("input", { type: "radio", class: "mk-check", name: "auswahl", value: String(i), "aria-label": `Material ${a[0]} auswählen` }, lab);
      el("div", { class: "mk-feld mk-anzeige mk-zahl zeile", id: `pa-${i}`, style: pos(z, 5) }, raster, zahl(a[4], 0));
      FELDER.forEach(([k, s, nk, pr, lbl]) => {
        const f = el("input", { class: "mk-feld mk-zahl zeile", id: `${k}-${i}`, style: pos(z, s), value: zahl(w[k], nk), inputmode: "decimal",
          "aria-label": `${lbl}, Material ${a[0]}`, "data-hilfe": pr.meldung }, raster);
        f.addEventListener("input", () => { const v = pruefeFeld(f, "zahl", pr); if (!f.classList.contains("mk-fehler")) w[k] = v || 0; rechnen(); });
        f.addEventListener("blur", () => { if (!f.classList.contains("mk-fehler")) f.value = zahl(w[k], nk); });
      });
      el("div", { class: "mk-feld mk-anzeige mk-zahl zeile", id: `net-${i}`, style: pos(z, 9) }, raster);
      el("div", { class: "mk-feld mk-anzeige mk-zahl zeile", id: `um-${i}`, style: pos(z, 11) }, raster);
    });
    const zs = 3 + Math.max(n, 1);
    el("div", { class: "leer zeile", style: pos(zs, 1) }, raster);
    el("span", { class: "mk-label mx-l summe zeile", id: "l-summe", style: pos(zs, 2, 2) }, raster, n ? "Summe" : "Keine Artikel in dieser Auswahl");
    el("div", { class: "leer zeile", style: pos(zs, 4) }, raster);
    el("div", { class: "mk-feld mk-anzeige mk-zahl summe zeile", id: "sum-menge", style: pos(zs, 5) }, raster);
    el("div", { class: "leer zeile", style: pos(zs, 6, 5) }, raster);
    el("div", { class: "mk-feld mk-anzeige mk-zahl summe zeile", id: "sum-umsatz", style: pos(zs, 11) }, raster);
    rechnen();
    if (MK.skalieren) MK.skalieren();
    if (MK._ebenenNeu) MK._ebenenNeu();
  }
  function rechnen() {
    let menge = 0, um = 0;
    ZEILEN.forEach(([a, w], i) => {
      const fehler = FELDER.some(([k]) => $(`${k}-${i}`).classList.contains("mk-fehler"));
      $(`net-${i}`).textContent = fehler ? "–" : zahl(netto(w), 2);
      $(`um-${i}`).textContent = fehler ? "–" : zahl(umsatz(a, w), 0);
      menge += a[4]; if (!fehler) um += umsatz(a, w);
    });
    $("sum-menge").textContent = ZEILEN.length ? zahl(menge, 0) : "";
    $("sum-umsatz").textContent = ZEILEN.length ? zahl(um, 0) : "";
    return [menge, um];
  }
  $("f-kg").addEventListener("change", aufbauen);
  $("f-mg2").addEventListener("change", () => { mg3Fuellen(); aufbauen(); });
  $("f-mg3").addEventListener("change", aufbauen);
  aufbauen();

  /* ---------- Knöpfe ---------- */
  const fehler = () => !!document.querySelector("#umsatz .mk-fehler");
  $("k-sichern").addEventListener("click", () => {
    if (fehler()) { MK.meldung("Nicht gesichert: Bitte zuerst die rot markierten Eingaben korrigieren."); return; }
    const [, um] = rechnen();
    MK.meldung(`Gesichert: ${ZEILEN.length} Artikel, Planumsatz ${zahl(um, 0)} €.`);
  });
  $("k-aktualisieren").addEventListener("click", () => {
    vorschlag(); aufbauen();
    MK.meldung("Aktualisiert: Preise aus dem ERP-System und Vorschläge der Gruppenplanung neu geladen.");
  });
  $("k-perioden").addEventListener("click", () => {
    const r = document.querySelector("#raster input[type=radio]:checked");
    if (!r) { MK.meldung("Bitte zuerst einen Artikel in der Spalte „Auswahl“ markieren."); return; }
    const [a] = ZEILEN[+r.value];
    MK.meldung(`Periodenwerte für ${a[0]} ${a[1]}: Monatsmaske in dieser Beispielmaske nicht hinterlegt.`);
  });
  $("k-verteilen").addEventListener("click", () => {
    if (fehler()) { MK.meldung("Bitte zuerst die rot markierten Eingaben korrigieren."); return; }
    const [menge, um] = rechnen();
    MK.meldung(`Gleichmäßig auf zwölf Perioden verteilt: je Monat ${zahl(menge / 12, 1)} Stück und ${zahl(um / 12, 0)} € Planumsatz.`);
  });

  /* ---------- Lernplattform: Erläuterungen und Gestaltung ---------- */
  MK.ebenen({
    erlaeuterungen: {
      titel: "Erläuterungen",
      intro: "Was die Bereiche der Maske in der detaillierten Umsatzplanung leisten. Die Nummern in der Maske zeigen, wo.",
      eintraege: [
        { nr: 1, ziel: "b-kunde", versatz: [-6, 62], titel: "Planung auf Kunden- und Artikelebene",
          text: "Geplant wird je Kunde und Artikel. Aus Planabsatz, Preis, Savings und Rabatt entsteht der Planumsatz von unten, also bottom-up – die feinste Ebene der Umsatzplanung." },
        { nr: 2, ziel: "f-kg", versatz: [-26, 2], titel: "Auswahl",
          text: "Kundengruppe sowie Materialgruppe 2 und 3 grenzen den Ausschnitt ein. Ohne Materialgruppe zeigt die Maske alle Artikel des Kunden; wählen Sie „S01 Fahrersitze“, bleiben nur die Sitze." },
        { nr: 3, ziel: "pa-0", anker: "links", versatz: [32, 1], titel: "Planabsatz aus der Absatzplanung",
          text: "Die Planabsatzmengen kommen aus der Absatzplanung (vgl. Abb. 3.183) und werden hier nur angezeigt. Die Umsatzplanung bewertet sie mit Preisen." },
        { nr: 4, ziel: "vk-0", anker: "links", versatz: [32, 1], titel: "Preisvorschlag aus dem ERP-System",
          text: "Die Verkaufspreise werden aus dem ERP-System übernommen und als Vorschlag für die Planpreise eingesetzt. Wer eine Preiserhöhung erwartet, überschreibt den Vorschlag." },
        { nr: 5, ziel: "s2-0", anker: "links", versatz: [32, 1], titel: "Manuelle Planung",
          text: "Savings und Rabatt stammen aus der Gruppenplanung (Abb. 3.184) – hier 2,0 % + 1,0 % für die Baureihe 44 und 2,0 % Rabatt für die Kundengruppe 008. Für einzelne Artikel lassen sie sich manuell überschreiben." },
        { nr: 6, ziel: "sum-umsatz", anker: "links", versatz: [32, 1], titel: "Vom Preis zum Planumsatz",
          text: "Nettopreis nach Saving = Vk-Preis × (1 − Savings); Planumsatz = Planabsatz × Nettopreis × (1 − Rabatt). Die Summe rechnet bei jeder Eingabe mit." },
        { nr: 7, ziel: "k-perioden", versatz: [14, -10], titel: "Periodische Bearbeitung",
          text: "Die Übersicht zeigt Jahreswerte. „Periodenwerte planen“ öffnet für den markierten Artikel die Monate, etwa für saisonale Mengen oder eine Preisänderung zur Jahresmitte." },
        { nr: 8, ziel: "k-verteilen", versatz: [14, -10], titel: "Jahreswerte verteilen",
          text: "Wer nicht monatlich planen will, verteilt die Jahreswerte auf die Perioden – hier gleichmäßig auf zwölf Monate, in der Praxis auch nach Saisonverlauf oder Arbeitstagen." },
      ],
    },
    gestaltung: {
      titel: "Gestaltung",
      intro: "Was gegenüber dem Original geändert wurde – softwareneutral im Buchstil und nach den Interaktionsprinzipien der DIN EN ISO 9241-110.",
      eintraege: [
        { nr: "A", ziel: "kopf", versatz: [-6, 8], regel: "BUCHSTIL – SOFTWARENEUTRAL", titel: "Kein Browserfenster",
          text: "Browserfenster mit Adresszeile (Servername mit Firmennamen), Menü- und Symbolleiste, Taskleiste, Bildlauf- und Blätterleiste („Zeile 1 bis 14 / 499“) entfallen; ebenso die Knöpfe „Beenden“ und „Zurück“." },
        { nr: "B", ziel: "kopf-unter", versatz: [-6, -2], regel: "SELBSTBESCHREIBUNGSFÄHIGKEIT", titel: "Einheiten einmal genannt",
          text: "Die Spalten „Basis-ME“ und „Währung“ und die Einheiten ST und EUR in jeder Zeile entfallen; die Einheiten stehen im Untertitel und an den Spaltenköpfen. Mengen ganzzahlig statt „138,000“." },
        { nr: "C", ziel: "net-1", anker: "links", versatz: [32, 1], regel: "SELBSTBESCHREIBUNGSFÄHIGKEIT", titel: "Eingabe und Anzeige unterscheidbar",
          text: "Planabsatz, Nettopreis und Planumsatz sind berechnet bzw. übernommen und grau; Preise, Savings und Rabatt sind weiße Eingabefelder. Im Original stand der Nettopreis ohne Kennzeichnung zwischen den Eingabefeldern." },
        { nr: "D", ziel: "f-mg2", versatz: [-26, 2], regel: "ERWARTUNGSKONFORMITÄT", titel: "Auswahlfelder",
          text: "Kunden- und Materialgruppen werden aus einer Liste gewählt, leere Felder heißen „Alle“. Das Original verlangte den Code mit Suchhilfesymbol." },
        { nr: "E", ziel: "l-summe", versatz: [-6, 1], regel: "AUFGABENANGEMESSENHEIT", titel: "Planumsatz und Summe ergänzt",
          text: "Die rechts abgeschnittenen Spalten des Originals (ab „Logistikerlös“) entfallen; dafür zeigt die Maske den Planumsatz je Artikel und die Summe über die Auswahl – das Ergebnis, um das es in der Umsatzplanung geht." },
        { nr: "F", ziel: "b-kunde", versatz: [-6, 62], regel: "BUCHSTIL – NEUTRAL UND AKTUELL", titel: "Fiktive Kunden und Artikel",
          text: "Der im Original geschwärzte Kunde und die Kundengruppe tragen fiktive Namen, die Typenbezeichnungen realer Sitze sind ersetzt, Materialtexte ausgeschrieben („POLSTER F.R_STOFF“ → „Rückenpolster Stoff“)." },
        { nr: "G", ziel: "r-0", versatz: [0, 1], regel: "ERWARTUNGSKONFORMITÄT", titel: "Auswahlspalte beschriftet",
          text: "Die Spalte mit den Optionsfeldern heißt „Auswahl“; im Original stand dort nur ein Symbol. Markiert wird der Artikel für „Periodenwerte planen“." },
        { nr: "H", ziel: "rab-0", anker: "links", versatz: [32, 1], regel: "ROBUSTHEIT GEGEN BENUTZUNGSFEHLER", titel: "Eingaben werden geprüft",
          text: "Preise ab 0 €, Savings und Rabatt von 0 bis 50 % mit Dezimalkomma. Ungültige Eingaben werden rot markiert, Nettopreis und Planumsatz der Zeile zeigen „–“, Sichern ist erst nach der Korrektur möglich." },
      ],
    },
  });
  MK.fertig();
})();

</script>
</body>
</html>
