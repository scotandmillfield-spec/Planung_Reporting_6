<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erlösplanung</title>
<style>
/* maskkit.css – softwareneutrale Eingabemasken im Buchstil (6. Auflage)
   Maßstab wie bei den Dashboards: 727 px = 110 mm (Abbildungsbreite), 1024 px = 155 mm; 14 px = 6 pt im Druck.
   Rollen: Eingabefeld weiß mit Rahmen · Anzeigefeld grau ohne Rahmen · Abschnittsband · Gruppenkopf · Knopf. */
:root {
  --ac: #3A3F44;          /* Anthrazit: Kopfleiste, Knopf, Pfeile, Links */
  --text: #1A1A1A;
  --muted: #4D4D4D;
  --rahmen: #9A9A9A;      /* Kontur der Eingabefelder und der Maske */
  --linie: #D9D9D9;       /* Haarlinien */
  --anzeige: #EFEFEF;     /* Anzeigefelder (nicht editierbar) */
  --band: #F6F6F6;        /* Abschnittsband */
  --schlecht: #C62828;    /* nur Fehlermeldungen in der interaktiven Fassung */
  --gut: #00806B;
  --schrift: Arial, "Liberation Sans", Helvetica, sans-serif;
  --zh: 26px;             /* Feldhöhe */
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #ECECEC; color: var(--text); font-family: var(--schrift); }
body.print { background: #FFFFFF; }

/* ---------- Lernplattform-Leiste und Panel (nicht im Druck) ---------- */
.mk-leiste { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: #FFFFFF;
  border-bottom: 1px solid var(--linie); display: flex; align-items: center; gap: 8px; padding: 0 16px;
  font-size: 14px; z-index: 30; }
.mk-leiste .mk-leiste-titel { font-weight: bold; margin-right: auto; }
.mk-leiste button { font: inherit; font-size: 14px; color: var(--text); background: #FFFFFF;
  border: 1px solid var(--rahmen); border-radius: 3px; padding: 6px 12px; cursor: pointer; }
.mk-leiste button[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: #FFFFFF; }
body.print .mk-leiste, body.print .mk-panel, body.print .mk-meldung { display: none !important; }
.mk-buehne { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; overflow: auto; }
body.print .mk-buehne { position: static; overflow: visible; }
.mk-rahmen { margin: 16px auto; box-shadow: 0 1px 3px rgba(0,0,0,.18); background: #FFFFFF; }
body.print .mk-rahmen { margin: 0; box-shadow: none; }
.mk-seite { position: relative; transform-origin: 0 0; background: #FFFFFF; }

.mk-marke { position: absolute; z-index: 20; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px;
  background: var(--ac); color: #FFFFFF; font-size: 13px; font-weight: bold; display: flex; align-items: center;
  justify-content: center; box-shadow: 0 0 0 2px #FFFFFF; cursor: pointer; }
.mk-marke.gestaltung { background: #FFFFFF; color: var(--ac); border: 2px solid var(--ac); }
.mk-marke.aktiv { background: var(--schlecht); color: #FFFFFF; border-color: var(--schlecht); }
.mk-panel { position: fixed; top: 44px; right: 0; bottom: 0; width: 380px; background: #FFFFFF;
  border-left: 1px solid var(--linie); overflow: auto; padding: 16px 18px; font-size: 14px; line-height: 1.4;
  z-index: 25; display: none; }
.mk-panel h2 { font-size: 17px; margin: 0 0 4px; }
.mk-panel .mk-panel-intro { color: var(--muted); margin-bottom: 12px; }
.mk-panel .mk-eintrag { padding: 10px 0; border-top: 1px solid var(--linie); cursor: pointer; }
.mk-panel .mk-eintrag.aktiv { background: var(--band); margin: 0 -18px; padding: 10px 18px; }
.mk-panel .mk-eintrag-kopf { display: flex; gap: 8px; align-items: baseline; font-weight: bold; }
.mk-panel .mk-regel { font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: bold; }
.mk-meldung { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ac); color: #FFFFFF;
  padding: 10px 16px; border-radius: 3px; font-size: 14px; z-index: 40; display: none; }
.mk-markiert { outline: 2px solid var(--schlecht); outline-offset: 2px; }

/* ---------- Maske ---------- */
.mk-maske { position: relative; width: 727px; background: #FFFFFF; border: 1px solid var(--rahmen);
  font-size: 14px; line-height: 18px; color: var(--text); margin: 0; }
.mk-kopf { height: 30px; background: var(--ac); color: #FFFFFF; font-size: 16px; font-weight: bold;
  line-height: 30px; padding: 0 15px; display: flex; justify-content: space-between; }
.mk-kopf .mk-kopf-info { font-weight: normal; font-size: 14px; color: #FFFFFF; }
.mk-inhalt { padding: 14px 15px 16px; }

/* Abschnitt mit Band (in der interaktiven Fassung auf- und zuklappbar) */
.mk-abschnitt + .mk-abschnitt { margin-top: 18px; }
.mk-band { height: 26px; line-height: 26px; background: var(--band); color: var(--ac); font-size: 14px; font-weight: bold;
  text-transform: uppercase; letter-spacing: .02em; padding: 0 8px; margin-bottom: 10px; position: relative; }
.mk-band .mk-klapp { position: absolute; right: 9px; top: 10px; }
body:not(.print) .mk-band { cursor: pointer; user-select: none; }
.mk-abschnitt.zu > :not(.mk-band) { display: none; }
.mk-abschnitt.zu .mk-klapp { transform: rotate(180deg); }

/* Gruppen */
.mk-gruppenkopf { font-weight: bold; height: 24px; line-height: 18px; border-bottom: 1px solid var(--rahmen);
  margin-bottom: 6px; white-space: nowrap; overflow: hidden; }
.mk-gruppe + .mk-gruppe { margin-top: 12px; }

/* Zeilen: Beschriftung + Feld(er); Spaltenbreiten über --sp-label, --sp-feld */
.mk-zeile { display: grid; grid-template-columns: var(--sp-label, 160px) var(--sp-feld, 192px); column-gap: 8px;
  align-items: center; min-height: var(--zh); }
.mk-zeile + .mk-zeile { margin-top: 4px; }
.mk-label { white-space: nowrap; overflow: hidden; }
.mk-label.mk-neben, .mk-neben { color: var(--muted); }
.mk-feldgruppe { display: flex; align-items: center; gap: 0; }
.mk-feldgruppe > .mk-feld { flex: 1 1 0; min-width: 0; }
.mk-feldgruppe > .mk-zwischen { flex: 0 0 auto; padding: 0 6px; color: var(--muted); }
.mk-feld.mk-datum { padding: 0 4px; text-align: center; }

/* Felder: input, select, textarea und deren Druckfassung (div) sehen gleich aus */
.mk-feld { display: block; width: 100%; height: var(--zh); margin: 0; padding: 0 7px; border: 1px solid var(--rahmen);
  border-radius: 2px; background: #FFFFFF; color: var(--text); font: inherit; font-size: 14px; line-height: 24px;
  white-space: nowrap; overflow: hidden; text-overflow: clip; position: relative; text-align: left; }
input.mk-feld, select.mk-feld, textarea.mk-feld { -webkit-appearance: none; appearance: none; outline: none; }
input.mk-feld:focus, select.mk-feld:focus, textarea.mk-feld:focus { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac); }
.mk-feld.mk-zahl { text-align: right; }
.mk-feld.mk-mitte { text-align: center; }
.mk-feld.mk-anzeige { background: var(--anzeige); border-color: var(--anzeige); }
.mk-feld.mk-leer { color: var(--muted); }
.mk-feld.mk-fehler { border-color: var(--schlecht); box-shadow: 0 0 0 1px var(--schlecht); }
select.mk-feld, .mk-feld.mk-auswahl { padding-right: 24px; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><polygon points='0,0 8,0 4,5' fill='%233A3F44'/></svg>");
  background-repeat: no-repeat; background-position: right 9px center; background-size: 8px 5px; }
div.mk-feld.mk-auswahl { background-image: none; }
.mk-feld .mk-pfeil { position: absolute; right: 9px; top: 10px; }
textarea.mk-feld, .mk-feld.mk-mehrzeilig { height: auto; white-space: pre-wrap; line-height: 18px; padding: 6px 8px; resize: none; }

/* Mehrzeiliger Anzeige- bzw. Textbereich (z. B. Brief), Absätze als <p> */
.mk-textbereich { border: 1px solid var(--rahmen); border-radius: 2px; background: #FFFFFF; padding: 8px 10px;
  font-size: 14px; line-height: 18px; overflow: hidden; }
.mk-textbereich.mk-anzeige { background: var(--anzeige); border-color: var(--anzeige); }
.mk-textbereich p { margin: 0 0 8px; }
.mk-textbereich p:last-child { margin-bottom: 0; }

/* Links */
.mk-link, a.mk-link { color: var(--ac); text-decoration: underline; cursor: pointer; }

/* Knöpfe */
.mk-knopf { display: inline-block; height: 30px; padding: 0 16px; border-radius: 3px; border: 1px solid var(--ac);
  background: var(--ac); color: #FFFFFF; font: inherit; font-size: 14px; font-weight: bold; line-height: 28px; cursor: pointer;
  white-space: nowrap; margin: 0; vertical-align: top; }
.mk-knopf.mk-zweit { background: #FFFFFF; color: var(--ac); }
button.mk-knopf { -webkit-appearance: none; appearance: none; }
.mk-knopfleiste { display: flex; gap: 8px; margin-top: 16px; }

/* Kontrollkästchen und Optionsfelder (Druckfassung als SVG) */
.mk-option { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
input.mk-check { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin: 0; border: 1px solid var(--rahmen);
  border-radius: 2px; background: #FFFFFF; position: relative; cursor: pointer; flex: 0 0 auto; }
input.mk-check[type="radio"] { border-radius: 7px; }
input.mk-check:checked { background: var(--ac); border-color: var(--ac); }
input.mk-check[type="checkbox"]:checked::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px;
  border: solid #FFFFFF; border-width: 0 2px 2px 0; transform: rotate(45deg); }
input.mk-check[type="radio"]:checked { background: #FFFFFF; }
input.mk-check[type="radio"]:checked::after { content: ""; position: absolute; left: 3px; top: 3px; width: 6px; height: 6px;
  border-radius: 3px; background: var(--ac); }
.mk-check-druck { width: 14px; height: 14px; flex: 0 0 auto; display: block; }

/* Raster / Tabelle mit Eingabezellen */
table.mk-tabelle { border-collapse: separate; border-spacing: 0 4px; margin: -4px 0; }
table.mk-tabelle th { font-weight: normal; color: var(--muted); text-align: left; padding: 0 8px 0 0; height: var(--zh); white-space: nowrap; }
table.mk-tabelle td { padding: 0 8px 0 0; height: var(--zh); white-space: nowrap; }
table.mk-tabelle td:last-child, table.mk-tabelle th:last-child { padding-right: 0; }

/* Reiter */
.mk-reiter { display: flex; gap: 2px; border-bottom: 1px solid var(--ac); margin-bottom: 10px; }
.mk-reiter > * { height: 26px; line-height: 26px; padding: 0 12px; background: var(--anzeige); color: var(--text); white-space: nowrap; }
.mk-reiter > .aktiv { background: var(--ac); color: #FFFFFF; font-weight: bold; }

/* Hilfsklassen für das Raster */
.mk-spalten { display: grid; grid-template-columns: var(--sp-links, 360px) var(--sp-rechts, 315px); column-gap: 20px; align-items: start; }
.mk-nur-interaktiv { }
body.print .mk-nur-interaktiv { display: none !important; }

</style>
</head>
<body>
<!-- Abb. 3.179 „Verschiedene Eingabe- und Planungsfunktionen am Beispiel der Erlösplanung“: Arbeitsblatt „Erlösplanung“
     (softwareneutral nachgebaut). Querformat 1024 px = 155 mm; Inhalt 992 px.
     Oben: Auswahl 288 · 20 · Planungsfunktionen 1–3 (459) · 20 · Ergebnisvorschau 5 (186).
     Tabelle: Produkt 160 · Ist 2025 / Ist 2026 / Forecast 2027 / Vorgabe 2028 / Budget 2028 je 62 · 12 Monate zu 43 = 986 px.
     Die Sprechblasen 1–5 des Originals sind als nummerierte Beschriftungen in die Maske übernommen. Zeilen erzeugt erloes.js. -->
<style>
  #erloes { width: 1024px; }
  /* Titelzeile wie Abb. 3.5/3.7 */
  #erloes .mk-kopf { display: block; height: auto; background: none; color: var(--text); padding: 12px 0 10px;
    margin: 0 15px; border-bottom: 1px solid var(--linie); line-height: normal; font-size: 14px; font-weight: normal; }
  #erloes .mk-kopf .kopf-titel { display: block; font-size: 22px; line-height: 26px; font-weight: bold; }
  #erloes .mk-kopf .kopf-unter { display: block; margin-top: 3px; line-height: 18px; color: var(--muted); }
  #erloes .mk-abschnitt.zu > :not(.mk-band) { display: none; }
  /* Kopfbereich: drei Gruppen nebeneinander */
  #erloes .oben { display: grid; grid-template-columns: 288px 459px 186px; column-gap: 20px; align-items: start; margin-bottom: 16px; }
  #erloes .mk-gruppe + .mk-gruppe { margin-top: 0; }
  #erloes .g-auswahl { --sp-label: 95px; --sp-feld: 185px; }
  #erloes .g-ergebnis { --sp-label: 108px; --sp-feld: 70px; }
  #erloes .fz { display: grid; grid-template-columns: 92px 170px 58px 104px; column-gap: 8px; align-items: center; min-height: 26px; }
  #erloes .fz + .fz { margin-top: 4px; }
  #erloes .fz .breit { grid-column: 2 / span 2; }
  #erloes .fz .mk-knopf { height: 26px; line-height: 24px; padding: 0 8px; width: 104px; text-align: center; }
  /* Tabelle */
  #erloes .mx { display: grid; grid-template-columns: 160px repeat(5, 62px) repeat(12, 43px); }
  #erloes .mx-zeile { display: contents; }
  #erloes .mx-k { height: 21px; line-height: 21px; padding: 0 3px; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; }
  #erloes .mx-k.links { text-align: left; padding-left: 0; }
  #erloes .mx-k.gruppe { grid-column: span 12; text-align: left; padding-left: 6px; color: var(--text); font-weight: bold;
    border-bottom: 1px solid var(--rahmen); margin-left: 4px; }
  #erloes .k2 > .mx-k { border-bottom: 1px solid var(--ac); }
  #erloes .mx-l { height: 24px; line-height: 23px; white-space: nowrap; overflow: hidden; border-bottom: 1px solid #D4D4D4; }
  #erloes .eltern > .mx-l { font-weight: bold; }
  #erloes .mx .mk-feld { height: 24px; line-height: 23px; padding: 0 4px; border: 0; border-radius: 0;
    border-left: 1px solid #D4D4D4; border-bottom: 1px solid #D4D4D4; background: #FFFFFF; }
  #erloes .mx .mk-feld.mk-anzeige { background: var(--anzeige); border-left-color: #FFFFFF; border-bottom-color: #FFFFFF; }
  #erloes .mx .mk-feld.trenn { border-left: 1px solid var(--rahmen); }
  #erloes .mx .mk-feld.mk-fehler { border-color: var(--schlecht); }
  #erloes .eltern > .mk-feld { font-weight: bold; }
</style>
<form class="mk-maske" id="erloes" autocomplete="off" novalidate>
  <div class="mk-kopf" id="kopf"><span class="kopf-titel" id="kopf-titel">Erlösplanung</span><span class="kopf-unter" id="kopf-unter">Budget 2028 · Stand 30.06.2027 · Werte in Tsd. €</span></div>
  <div class="mk-inhalt">
    <section class="mk-abschnitt" id="abschnitt">
      <div class="mk-band" id="band">Top-down-Planung über Produkte</div>
      <div class="oben">
        <div class="mk-gruppe g-auswahl" id="g-auswahl">
          <div class="mk-gruppenkopf">Auswahl</div>
          <div class="mk-zeile">
            <label class="mk-label" for="f-gebiet">Vertriebsgebiet</label>
            <select class="mk-feld" id="f-gebiet"><option selected>Österreich</option></select>
          </div>
          <div class="mk-zeile">
            <label class="mk-label" for="f-kunde">Kunde</label>
            <select class="mk-feld" id="f-kunde"><option selected>1001 – Sportfachhandel</option></select>
          </div>
          <div class="mk-zeile">
            <label class="mk-label" for="f-variante">Variante</label>
            <select class="mk-feld" id="f-variante"><option selected>1. Planungsdurchlauf</option></select>
          </div>
        </div>

        <div class="mk-gruppe" id="g-funktionen">
          <div class="mk-gruppenkopf">Planungsfunktionen</div>
          <div class="fz" id="z-prognose">
            <label class="mk-label" for="f-prognose">1. Prognose</label>
            <select class="mk-feld" id="f-prognose" data-hilfe="Prognoseverfahren für den Gesamterlös">
              <option value="mittel" selected>Durchschnitt 3 Jahre</option>
              <option value="fc">Forecast fortschreiben</option>
              <option value="trend">Linearer Trend</option>
            </select>
            <div class="mk-feld mk-anzeige mk-zahl" id="f-prognosewert"></div>
            <button type="button" class="mk-knopf mk-zweit" id="k-prognose">Übernehmen</button>
          </div>
          <div class="fz" id="z-vertikal">
            <label class="mk-label" for="f-vertikal">2. Vertikal</label>
            <select class="mk-feld breit" id="f-vertikal" data-hilfe="Verteilungsschlüssel von Gesamt auf die Produkte">
              <option value="fc" selected>wie Forecast 2027</option>
              <option value="ist">wie Ist 2026</option>
              <option value="gleich">gleichmäßig</option>
            </select>
            <button type="button" class="mk-knopf mk-zweit" id="k-vertikal">Verteilen</button>
          </div>
          <div class="fz" id="z-horizontal">
            <label class="mk-label" for="f-horizontal">3. Horizontal</label>
            <select class="mk-feld breit" id="f-horizontal" data-hilfe="Verteilungskurve vom Jahr auf die Monate">
              <option value="saison" selected>Saisonverlauf Ist 2026</option>
              <option value="gleich">gleichmäßig</option>
            </select>
            <button type="button" class="mk-knopf mk-zweit" id="k-horizontal">Verteilen</button>
          </div>
        </div>

        <div class="mk-gruppe g-ergebnis" id="g-ergebnis">
          <div class="mk-gruppenkopf">5. Ergebnisvorschau</div>
          <div class="mk-zeile">
            <span class="mk-label">Umsatzziel 2028</span>
            <div class="mk-feld mk-anzeige mk-zahl" id="f-ziel"></div>
          </div>
          <div class="mk-zeile">
            <span class="mk-label">Aktuelle Planung</span>
            <div class="mk-feld mk-anzeige mk-zahl" id="f-planung"></div>
          </div>
          <div class="mk-zeile">
            <span class="mk-label" id="l-erreichung">Zielerreichung</span>
            <div class="mk-feld mk-anzeige mk-zahl" id="f-erreichung"></div>
          </div>
        </div>
      </div>

      <div class="mx" id="mx" role="grid" aria-label="Erlösplanung 2028 nach Produkten in Tsd. €">
        <div class="mx-zeile k1">
          <div class="mx-k links">Produkt</div>
          <div class="mx-k">Ist</div><div class="mx-k">Ist</div><div class="mx-k">Forecast</div>
          <div class="mx-k" id="k-vorgabe">Vorgabe</div><div class="mx-k" id="k-budget">Budget</div>
          <div class="mx-k gruppe" id="k-monate">4. Monatswerte 2028 – manuell korrigierbar</div>
        </div>
        <div class="mx-zeile k2" id="kopf2"><!-- Jahre und Monate erzeugt erloes.js --></div>
      </div>
    </section>
  </div>
</form>

<script>
/* maskkit.js – softwareneutrale Eingabemasken im Buchstil (6. Auflage)
   Die Maske ist HTML5 (<form class="mk-maske">) mit den Klassen aus maskkit.css.
   ?print: Druckfassung – Steuerelemente werden zu statischen Elementen gleicher Geometrie, ohne Leiste.
   MK.exportieren() liefert alle Flächen, Linien, Formen und Textzeilen in px für die PowerPoint-Ausgabe. */
const MK = (() => {
  "use strict";
  const Q = new URLSearchParams(location.search);
  const PRINT = Q.has("print");
  if (PRINT) document.body.classList.add("print");
  const NS = "http://www.w3.org/2000/svg";
  const NBSP = String.fromCharCode(0xA0), MINUS = String.fromCharCode(0x2212);

  /* ---------------- DOM/SVG ---------------- */
  function el(tag, attrs = {}, parent, text) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
    }
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function sv(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  // Pfeil nach unten (Auswahlfeld) bzw. oben (Klappband), 8 x 5 px
  function pfeil(cls, oben = false) {
    const s = sv("svg", { width: 8, height: 5, viewBox: "0 0 8 5", class: cls, "aria-hidden": "true" });
    sv("polygon", { points: oben ? "0,5 8,5 4,0" : "0,0 8,0 4,5", fill: "#3A3F44" }, s);
    return s;
  }

  /* ---------------- Zahlen und Datum (deutsches Format) ---------------- */
  const NF = {};
  const nf = nk => NF[nk] || (NF[nk] = new Intl.NumberFormat("de-DE", { minimumFractionDigits: nk, maximumFractionDigits: nk }));
  function zahl(v, nk = 1) { return v == null || isNaN(v) ? "" : (v < 0 ? MINUS : "") + nf(nk).format(Math.abs(v)); }
  function leseZahl(text) {
    const t = String(text).trim().replace(MINUS, "-").replace(/\s/g, "");
    if (!t) return null;
    if (!/^-?(\d{1,3}(\.\d{3})+|\d+)(,\d+)?$/.test(t)) return NaN;
    return parseFloat(t.replace(/\./g, "").replace(",", "."));
  }
  function leseDatum(text) {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(text).trim());
    if (!m) return null;
    const d = new Date(+m[3], +m[2] - 1, +m[1]);
    return d.getMonth() === +m[2] - 1 ? d : null;
  }
  function datum(d) { return d ? String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear() : ""; }
  // Eingabe prüfen und markieren; liefert den Wert oder null
  function pruefeFeld(feld, art = "zahl", opt = {}) {
    const t = feld.value;
    let v = null, ok = true;
    if (art === "zahl") {
      v = leseZahl(t);

  /* ---------------- Seite, Skalierung, Leiste ---------------- */

  /* ---------------- Druckfassung: Steuerelemente -> statische Elemente ---------------- */
  let fertigGemeldet = false;

  // Am Ende des Masken-Skripts aufrufen: setzt die Druckfassung und skaliert

  /* ---------------- Ebenen der Lernplattform: Erläuterungen und Gestaltung ---------------- */
  function zielElement(z) { return !z ? null : document.getElementById(z) || maske.querySelector(z); }
  function ebenen(o) {
    if (PRINT) return;
    let modus = null;

      b.addEventListener("click", () => umschalten(k));

    });
    function markenWeg() { marken.forEach(m => m.remove()); marken.length = 0; maske.querySelectorAll(".mk-markiert").forEach(e => e.classList.remove("mk-markiert")); }
    function markeSetzen(eintrag, text, cls) {
      const z = zielElement(eintrag.ziel);
      if (!z || !z.offsetParent) return;
      const [dx, dy] = eintrag.versatz || [0, 0];

      marken.forEach(m => m.classList.toggle("aktiv", m.textContent === text));
      maske.querySelectorAll(".mk-markiert").forEach(e => e.classList.remove("mk-markiert"));
      const z = eintrag && zielElement(eintrag.ziel);
      if (z) z.classList.add("mk-markiert");

    function umschalten(k) {

      markenWeg(); panel.textContent = "";

      const def = o[modus], cls = modus === "gestaltung" ? "gestaltung" : "";
      el("h2", {}, panel, def.titel || (modus === "gestaltung" ? "Gestaltung" : "Erläuterungen"));
      if (def.intro) el("div", { class: "mk-panel-intro" }, panel, def.intro);
      def.eintraege.forEach(r => {
        const nr = String(r.nr);

  /* ---------------- Export für PowerPoint (Druckfassung) ---------------- */
  function farbe(c) {
    const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/.exec(c || "");
    if (!m) return null;
    const a = m[4] === undefined ? 1 : parseFloat(m[4]);
    const hex = [m[1], m[2], m[3]].map(v => Math.round(+v).toString(16).padStart(2, "0")).join("").toUpperCase();
    return { hex, a };
  }
  function exportieren() {
    const R = maske.getBoundingClientRect();
    const formen = [];
    const name = e => e.id || e.dataset.name || (e.className && typeof e.className === "string" ? e.className.split(" ")[0] : e.tagName);
    const sichtbar = s => s.w > 0 && s.st !== "none" && s.st !== "hidden" && s.c && s.c.a > 0;
    function kasten(e, cs) {
      const r = e.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const bg = farbe(cs.backgroundColor);
      const seiten = ["Top", "Right", "Bottom", "Left"].map(s => ({ w: parseFloat(cs["border" + s + "Width"]) || 0,
        c: farbe(cs["border" + s + "Color"]), st: cs["border" + s + "Style"] }));
      const gleich = seiten.every(s => sichtbar(s) && s.w === seiten[0].w && s.c.hex === seiten[0].c.hex && s.st === seiten[0].st);
      const x = r.left - R.left, y = r.top - R.top, rad = parseFloat(cs.borderTopLeftRadius) || 0;
      const fuell = bg && bg.a > 0.01 ? bg.hex : null;

        formen.push({ t: "rect", name: name(e), x: x + lw / 2, y: y + lw / 2, w: r.width - lw, h: r.height - lw,

      }
      if (!gleich) seiten.forEach((s, i) => {
        if (!sichtbar(s)) return;
        const h = s.w / 2;
        const p = [[x, y + h, x + r.width, y + h], [x + r.width - h, y, x + r.width - h, y + r.height],
                   [x, y + r.height - h, x + r.width, y + r.height - h], [x + h, y, x + h, y + r.height]][i];
        formen.push({ t: "linie", name: name(e), x1: p[0], y1: p[1], x2: p[2], y2: p[3], farbe: s.c.hex, lw: s.w, dash: s.st === "dashed" });
      });

      svg.querySelectorAll("polygon, polyline, rect, circle, line").forEach(k => {
        const cs = getComputedStyle(k), M = k.getScreenCTM();
        const pt = (x, y) => { const p = new DOMPoint(x, y).matrixTransform(M); return [p.x - R.left, p.y - R.top]; };
        const f = farbe(cs.fill), s = farbe(cs.stroke), lw = parseFloat(cs.strokeWidth) || 0;
        const fill = f && f.a > 0.01 ? f.hex : null, line = s && s.a > 0.01 && lw > 0 ? s.hex : null;
        const tag = k.tagName.toLowerCase();
        if (tag === "polygon" || tag === "polyline") {
          const pts = [...k.points].map(p => pt(p.x, p.y));
          formen.push({ t: "poly", name: "Form", pts, zu: tag === "polygon", fill: tag === "polygon" ? fill : null, line, lw });
        } else if (tag === "rect") {
          const x = +k.getAttribute("x") || 0, y = +k.getAttribute("y") || 0, w = +k.getAttribute("width"), h = +k.getAttribute("height");
          const a = pt(x, y), b = pt(x + w, y + h);
          formen.push({ t: "rect", name: "Form", x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1], fill, line, lw, r: +k.getAttribute("rx") || 0 });
        } else if (tag === "circle") {
          const cx = +k.getAttribute("cx"), cy = +k.getAttribute("cy"), r = +k.getAttribute("r");
          const a = pt(cx - r, cy - r), b = pt(cx + r, cy + r);
          formen.push({ t: "oval", name: "Form", x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1], fill, line, lw });
        } else if (tag === "line") {
          const a = pt(+k.getAttribute("x1"), +k.getAttribute("y1")), b = pt(+k.getAttribute("x2"), +k.getAttribute("y2"));
          formen.push({ t: "linie", name: "Linie", x1: a[0], y1: a[1], x2: b[0], y2: b[1], farbe: line, lw });
        }
      });
    }
    function text(n) {
      const t = n.textContent;
      if (!t.trim()) return;
      const p = n.parentElement, cs = getComputedStyle(p);
      const woerter = [], re = /[^\s]+/g;
      let m;
      while ((m = re.exec(t))) {
        const rg = document.createRange();
        rg.setStart(n, m.index); rg.setEnd(n, m.index + m[0].length);
        const rs = [...rg.getClientRects()].filter(r => r.width > 0);
        if (rs.length) woerter.push({ a: m.index, b: m.index + m[0].length, r: rs[0] });
      }
      if (!woerter.length) return;
      const zeilen = [];
      woerter.forEach(w => {
        const z = zeilen[zeilen.length - 1];
        if (z && Math.abs(z.top - w.r.top) < 2) { z.b = w.b; z.right = Math.max(z.right, w.r.right); z.bottom = Math.max(z.bottom, w.r.bottom); }
        else zeilen.push({ a: w.a, b: w.b, left: w.r.left, right: w.r.right, top: w.r.top, bottom: w.r.bottom });
      });
      const gross = cs.textTransform === "uppercase";
      const unter = (cs.textDecorationLine || cs.textDecoration || "").includes("underline");
      formen.push({ t: "text", name: name(p), groesse: parseFloat(cs.fontSize), fett: parseInt(cs.fontWeight, 10) >= 600,
        kursiv: cs.fontStyle === "italic", farbe: (farbe(cs.color) || { hex: "1A1A1A" }).hex, unter,
        ausr: { right: "r", end: "r", center: "c" }[cs.textAlign] || "l",
        sperr: parseFloat(cs.letterSpacing) || 0,
        zeilen: zeilen.map(z => {
          let s = t.slice(z.a, z.b).replace(/[ \t\n\r]+/g, " ");

          return { x: z.left - R.left, y: z.top - R.top, w: z.right - z.left, h: z.bottom - z.top, text: s };
        }) });
    }
    function gehe(n) {
      if (n.nodeType === 3) { text(n); return; }
      if (n.nodeType !== 1) return;

      n.childNodes.forEach(gehe);

  /* ---------------- Prüfungen (Druckfassung) ---------------- */
  function kontrast(a, b) {
    const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
    const L = h => 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16));

  }
  function pruefen() {
    const R = maske.getBoundingClientRect(), probleme = [];
    const kurz = s => s.trim().replace(/\s+/g, " ").slice(0, 40);
    maske.querySelectorAll("*").forEach(e => {
      const cs = getComputedStyle(e);
      if (cs.display === "none" || e.closest("svg")) return;
      const r = e.getBoundingClientRect();
      if (r.width && (r.left < R.left - 0.5 || r.right > R.right + 0.5 || r.bottom > R.bottom + 0.5))
        probleme.push(`Überlauf aus der Maske: ${e.className || e.tagName} „${kurz(e.textContent)}“`);
      if (e.textContent.trim() && (cs.overflow === "hidden" || cs.overflowX === "hidden") &&
          (e.scrollWidth > e.clientWidth + 1 || e.scrollHeight > e.clientHeight + 1))
        probleme.push(`Text abgeschnitten: „${kurz(e.textContent)}“`);
    });
    const tw = document.createTreeWalker(maske, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = tw.nextNode())) {
      if (!n.textContent.trim()) continue;
      const p = n.parentElement, cs = getComputedStyle(p);
      if (cs.display === "none") continue;
      if (parseFloat(cs.fontSize) < 13.9) probleme.push(`Schrift unter 6 pt (${cs.fontSize}): „${kurz(n.textContent)}“`);
      let a = p, bg = null;
      while (a && !bg) { const f = farbe(getComputedStyle(a).backgroundColor); if (f && f.a > 0.5) bg = f.hex; a = a.parentElement; }
      const fg = farbe(cs.color);

  }

  return { PRINT, NBSP, MINUS, el, sv, pfeil, zahl, leseZahl, leseDatum, datum, pruefeFeld, init, fertig, skalieren,
           meldung, ebenen, exportieren, pruefen, druckfassung };
})();

<script>

  const MONATE = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

    ["Carving 100X", 3, [0]], ["Speed 200X", 3, [1]], ["Snowboard", 2, [2, 3]],

  const summe = a => a.reduce((s, v) => s + v, 0);
  const text = v => (v == null ? "" : zahl(v / 10, 1));

    const teil = exakt.map(Math.floor);
    exakt.map((x, i) => [x - teil[i], g[i], i]).sort((a, b) => b[0] - a[0] || b[1] - a[1])
      .slice(0, ziel - summe(teil)).forEach(([, , i]) => { teil[i] += 1; });
    return teil;
  }

  /* ---------- Tabelle aufbauen ---------- */
  const mx = $("mx"), k2 = $("kopf2");
  el("div", { class: "mx-k links" }, k2, "Umsatz in Tsd. €");
  ["2025", "2026", "2027", "2028", "2028"].forEach(j => el("div", { class: "mx-k" }, k2, j));
  MONATE.forEach(m => el("div", { class: "mx-k" }, k2, m));
  const HILFE_V = "Vorgabe in Tsd. € – bei Summenzeilen mit Enter auf die Produkte verteilt";
  const HILFE_M = "Monatswert in Tsd. € – manuell korrigierbar";
  ZEILEN.forEach((r, z) => {
    const zeile = el("div", { class: "mx-zeile" + (r.blatt ? "" : " eltern"), id: "z" + z, role: "row" }, mx);
    el("div", { class: "mx-l", id: "l" + z, style: `padding-left:${r.ebene * 12}px` }, zeile, r.name);
    r.hist = [0, 1, 2].map(k => el("div", { class: "mk-feld mk-anzeige mk-zahl" }, zeile));
    r.vorgabe = el("input", { class: "mk-feld mk-zahl trenn", id: `v${z}`, inputmode: "decimal", "aria-label": `${r.name}, Vorgabe 2028`,
      "data-hilfe": r.blatt ? "Vorgabe in Tsd. € – Summen und Ergebnisvorschau folgen sofort" : HILFE_V }, zeile);
    r.budget = el("div", { class: "mk-feld mk-anzeige mk-zahl", id: `b${z}` }, zeile);
    r.monate = MONATE.map((m, k) => r.blatt
      ? el("input", { class: "mk-feld mk-zahl" + (k === 0 ? " trenn" : ""), id: `m${z}-${k}`, inputmode: "decimal",
          "aria-label": `${r.name}, ${m} 2028`, "data-hilfe": HILFE_M }, zeile)
      : el("div", { class: "mk-feld mk-anzeige mk-zahl" + (k === 0 ? " trenn" : ""), id: `m${z}-${k}` }, zeile));
  });

  /* ---------- Rechnen und Anzeigen ---------- */
  const vorgabe = r => summe(r.blaetter.map(i => VORG[i]));
  const geplant = r => r.blaetter.filter(i => MON[i]);
  const monat = (r, k) => (geplant(r).length ? summe(geplant(r).map(i => MON[i][k])) : null);
  const budget = r => (geplant(r).length ? summe(geplant(r).map(i => summe(MON[i]))) : null);
  function prognose() {
    const g = [0, 1, 2].map(k => summe(HIST.map(h => h[k])));
    const v = $("f-prognose").value;
    return v === "fc" ? g[2] : v === "trend" ? Math.max(0, Math.round(g[2] + (g[2] - g[0]) / 2)) : Math.round(summe(g) / 3);
  }
  function anzeigen() {
    const aktiv = document.activeElement;
    const setze = (f, v) => { if (f !== aktiv) { if (f.tagName === "INPUT") f.value = text(v); else f.textContent = text(v); } };
    ZEILEN.forEach(r => {
      r.hist.forEach((f, k) => { f.textContent = text(summe(r.blaetter.map(i => HIST[i][k]))); });
      setze(r.vorgabe, vorgabe(r));
      r.budget.textContent = text(budget(r));
      r.monate.forEach((f, k) => setze(f, monat(r, k)));
    });
    $("f-prognosewert").textContent = text(prognose());
    const ziel = vorgabe(ZEILEN[0]), plan = budget(ZEILEN[0]) || 0;
    $("f-ziel").textContent = text(ziel);
    $("f-planung").textContent = text(plan);
    $("f-erreichung").textContent = ziel > 0 ? zahl(plan / ziel * 100, 1) + MK.NBSP + "%" : "–";
  }
  function gewichteVertikal(blaetter) {
    const s = $("f-vertikal").value;
    return blaetter.map(i => (s === "fc" ? HIST[i][2] : s === "ist" ? HIST[i][1] : 1));
  }
  function vertikal(r, ziel) {
    const w = verteile(ziel, gewichteVertikal(r.blaetter));
    r.blaetter.forEach((i, n) => { VORG[i] = w[n]; });
  }

  /* ---------- Eingaben ---------- */
  const PRUEF = { min: 0, max: 99999.9, meldung: "Betrag in Tsd. € ab 0 mit Dezimalkomma, z. B. 28,9" };
  ZEILEN.forEach(r => {
    const f = r.vorgabe;
    f.addEventListener("input", () => {
      const v = pruefeFeld(f, "zahl", PRUEF);
      if (r.blatt && v !== null && !f.classList.contains("mk-fehler")) { VORG[r.blaetter[0]] = Math.round(v * 10); anzeigen(); }
    });
    const uebernehmen = () => {
      const v = pruefeFeld(f, "zahl", PRUEF);
      if (f.classList.contains("mk-fehler")) return;
      if (v !== null && !r.blatt && Math.round(v * 10) !== vorgabe(r)) {
        vertikal(r, Math.round(v * 10));
        MK.meldung(`Vorgabe ${r.name} ${text(Math.round(v * 10))} Tsd. € ${$("f-vertikal").selectedOptions[0].text} auf ${r.blaetter.length} Produkte verteilt.`);
      }
      f.value = text(vorgabe(r)); anzeigen();
    };
    f.addEventListener("change", uebernehmen);
    f.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); uebernehmen(); f.select(); } });
    f.addEventListener("blur", () => { if (!f.classList.contains("mk-fehler")) f.value = text(vorgabe(r)); });
    if (!r.blatt) return;
    const i = r.blaetter[0];
    r.monate.forEach((m, k) => {
      m.addEventListener("input", () => {
        const v = pruefeFeld(m, "zahl", PRUEF);
        if (v === null || m.classList.contains("mk-fehler")) return;
        if (!MON[i]) MON[i] = MONATE.map(() => 0);
        MON[i][k] = Math.round(v * 10); anzeigen();
      });
      m.addEventListener("blur", () => { if (!m.classList.contains("mk-fehler")) m.value = text(MON[i] ? MON[i][k] : null); });
    });
  });

  /* ---------- Planungsfunktionen ---------- */
  $("f-prognose").addEventListener("change", anzeigen);
  $("k-prognose").addEventListener("click", () => {
    vertikal(ZEILEN[0], prognose()); anzeigen();
    MK.meldung(`Prognose ${text(prognose())} Tsd. € als Vorgabe Gesamt übernommen und ${$("f-vertikal").selectedOptions[0].text} auf die Produkte verteilt.`);
  });
  $("k-vertikal").addEventListener("click", () => {
    vertikal(ZEILEN[0], vorgabe(ZEILEN[0])); anzeigen();
    MK.meldung(`Vorgabe Gesamt ${$("f-vertikal").selectedOptions[0].text} auf die Einzelprodukte verteilt.`);
  });
  $("k-horizontal").addEventListener("click", () => {
    const saison = $("f-horizontal").value === "saison";
    BLAETTER.forEach((_, i) => { MON[i] = verteile(VORG[i], saison ? SAISON[i] : MONATE.map(() => 1)); });
    document.querySelectorAll("#erloes .mk-fehler").forEach(f => f.classList.remove("mk-fehler"));
    anzeigen();
    MK.meldung(`Jahresvorgaben aller ${BLAETTER.length} Produkte ${saison ? "nach dem Saisonverlauf Ist 2026" : "gleichmäßig"} auf die Monate verteilt – Budget = Vorgabe.`);
  });
  anzeigen();

  /* ---------- Klappen ohne Maßstabssprung (wie Abb. 3.7) ---------- */
  if (!PRINT) {
    const maske = $("erloes"), seite = $("seite"), rahmen = seite.parentElement;
    let alt = null;
    const merken = e => { if (e.target.closest && e.target.closest(".mk-band")) alt = seite.style.transform; };
    const halten = e => {
      if (alt === null || !(e.target.closest && e.target.closest(".mk-band"))) return;
      const s = parseFloat((/scale\(([\d.]+)\)/.exec(alt) || [0, 1])[1]);
      seite.style.transform = alt; alt = null;
      rahmen.style.width = maske.offsetWidth * s + "px"; rahmen.style.height = maske.offsetHeight * s + "px";
      if (MK._ebenenNeu) MK._ebenenNeu();
    };
    ["click", "keydown"].forEach(t => { maske.addEventListener(t, merken, true); maske.addEventListener(t, halten); });
  }

  /* ---------- Lernplattform: Erläuterungen und Gestaltung ---------- */
  MK.ebenen({
    erlaeuterungen: {
      titel: "Erläuterungen",
      intro: "Wie die Eingabe- und Planungsfunktionen in der Erlösplanung zusammenwirken. Die Nummern in der Maske zeigen, wo – die Funktionen 1 bis 5 lassen sich ausprobieren.",
      eintraege: [
        { nr: 1, ziel: "k-prognose", versatz: [24, 2], titel: "Prognose aus den Vorjahren",
          text: "Ausgangspunkt ist eine Prognose der Produkterlöse gesamt: hier der Durchschnitt aus Ist 2025, Ist 2026 und Forecast 2027 = 151,7 Tsd. €. „Übernehmen“ setzt sie als Vorgabe Gesamt. Alternativ: Forecast fortschreiben oder linearer Trend." },
        { nr: 2, ziel: "v3", anker: "links", versatz: [29, 1], titel: "Vertikale Verteilung (top-down)",
          text: "Die Vorgabe Gesamt wird auf die Einzelprodukte heruntergebrochen, im Beispiel wie die Basisperiode Forecast 2027: Carving 100X erhält 28,9 von 151,7 Tsd. €. Eine neue Summe in einer Zeile wie Wintersport wird mit Enter auf deren Produkte verteilt." },
        { nr: 3, ziel: "k-horizontal", versatz: [24, 2], titel: "Horizontale Verteilung",
          text: "Die Jahresvorgaben werden automatisch auf die Monate verteilt, nach einer Verteilungskurve – hier dem Saisonverlauf des Ist 2026: Ski im Winter, Fahrräder im Sommer. Danach ist das Budget gleich der Vorgabe." },
        { nr: 4, ziel: "k-monate", versatz: [-4, -1], titel: "Manuelle Korrektur je Monat",
          text: "Die Planer korrigieren die Monatswerte, etwa Carving 100X im Januar auf 8,0 Tsd. € für eine Messeaktion. Das Budget ist die Summe der Monate; bei Carving 100X liegt es mit 36,8 Tsd. € über der Vorgabe von 28,9." },
        { nr: 5, ziel: "l11", versatz: [-4, 1], titel: "Noch nicht geplant",
          text: "Für Rennrad 200, Fun 100S und Inline 200S fehlen noch Monatswerte: Die Bottom-up-Planung ist unvollständig, das Budget der Summenzeilen enthält nur die geplanten Produkte." },
        { nr: 6, ziel: "f-erreichung", versatz: [24, 2], titel: "Ergebnisvorschau",
          text: "Umsatzziel ist die Vorgabe Gesamt, aktuelle Planung das Budget aus den Monatswerten. Mit 86,0 % ist das Ziel noch nicht erreicht: Fehlende Produkte planen oder Werte nachbessern – Vorgabe und Planung werden im Gegenstromverfahren abgestimmt." },
        { nr: 7, ziel: "g-auswahl", versatz: [-4, 0], titel: "Planungsobjekt",
          text: "Geplant wird je Vertriebsgebiet, Kunde und Planungsdurchlauf. Jeder Durchlauf ist eine eigene Variante; so bleibt der erste Stand erhalten, wenn nachgeplant wird." },
        { nr: 8, ziel: "b3", anker: "links", versatz: [29, 1], titel: "Vorgabe und Budget nebeneinander",
          text: "Top-down-Vorgabe und Bottom-up-Budget stehen je Produkt nebeneinander. Die Differenz zeigt, wo die Planer von der Vorgabe abweichen – Grundlage für das Abstimmungsgespräch." },
      ],
    },
    gestaltung: {
      titel: "Gestaltung",
      intro: "Was gegenüber dem Original geändert wurde – softwareneutral im Buchstil und nach den Interaktionsprinzipien der DIN EN ISO 9241-110.",
      eintraege: [
        { nr: "A", ziel: "kopf-titel", versatz: [-4, 4], regel: "BUCHSTIL – SOFTWARENEUTRAL", titel: "Kein Fenster, kein Logo",
          text: "Fensterrahmen, Menü- und Symbolleiste, Produktname und Logo, die grüne Navigationsleiste (Prozess, Planung, Simulation, Reporting), die Statusleiste mit Benutzer und Server und die Bildlaufleisten entfallen; ebenso der zugeklappte Abschnitt „Planungsvorgaben“." },
        { nr: "B", ziel: "g-funktionen", versatz: [-4, 0], regel: "AUFGABENANGEMESSENHEIT", titel: "Funktionen in Arbeitsreihenfolge",
          text: "Im Original steckten die Funktionen als kleine Knöpfe in den Spaltenköpfen („∅“, „…“, „reset“, „refresh“) und als Auswahl je Zeile. Jetzt stehen Prognose, vertikale und horizontale Verteilung nummeriert über der Tabelle; die Sprechblasen 1 bis 5 des Originals sind zu Beschriftungen geworden." },
        { nr: "C", ziel: "f-vertikal", anker: "links", versatz: [0, 2], regel: "SELBSTBESCHREIBUNGSFÄHIGKEIT", titel: "Klartext statt Kürzel",
          text: "„WBJ“ (wie Basisjahr) heißt „wie Forecast 2027“ bzw. „Saisonverlauf Ist 2026“, „BUD“ Budget, „FC 1“ Forecast. Die Einheit Tsd. € steht im Spaltenkopf; das Original zeigte volle Beträge ohne Einheit." },
        { nr: "D", ziel: "b2", anker: "links", versatz: [29, 1], regel: "SELBSTBESCHREIBUNGSFÄHIGKEIT", titel: "Eingabe und Anzeige unterscheidbar",
          text: "Vorgaben und Monatswerte der Produkte sind weiß (Eingabe), Ist, Forecast, Budget und die Summen der Monatswerte grau (berechnet). Im Original waren Eingabe- und Anzeigezellen kaum zu unterscheiden." },
        { nr: "E", ziel: "f-planung", versatz: [24, 2], regel: "BUCHSTIL – NEUTRAL UND AKTUELL", titel: "Zahl statt Ampel",
          text: "Der gelbe Ampelpunkt wird zur Zielerreichung in Prozent. Das Umsatzziel von 13.000.000 € passte nicht zu den Zeilen der Tabelle; es ist jetzt die Vorgabe Gesamt." },
        { nr: "F", ziel: "l1", versatz: [-4, 1], regel: "AUFGABENANGEMESSENHEIT", titel: "Nur Umsatz, eine Ebene weniger",
          text: "Die Zeilen „Absatzmenge“ entfallen aus Platzgründen, ebenso die Ebene „Outdoor“, die mit Gesamt identisch war. Das im Original abgeschnittene zweite Skate-Produkt ist als „Inline 200S“ ergänzt, damit die Summen stimmen." },
        { nr: "G", ziel: "v4", anker: "links", versatz: [29, 1], regel: "ROBUSTHEIT GEGEN BENUTZUNGSFEHLER", titel: "Eingaben werden geprüft",
          text: "Ungültige oder negative Beträge werden rot markiert und nicht übernommen. Summenzeilen verteilen erst mit Enter oder beim Verlassen des Felds." },
        { nr: "H", ziel: "f-kunde", anker: "links", versatz: [0, 2], regel: "BUCHSTIL – NEUTRAL UND AKTUELL", titel: "Keine echten Namen, aktuelle Jahre",
          text: "Der Kundenname des Originals (ein reales Handelsunternehmen) ist durch „Sportfachhandel“ ersetzt, die Rolle „GL Administrator“ entfällt. Ist 2009/2010, FC 2011 und BUD 2012 werden zu Ist 2025/2026, Forecast 2027 und Budget 2028." },
      ],
    },
  });
  MK.fertig();
})();

</script>
</body>
</html>
