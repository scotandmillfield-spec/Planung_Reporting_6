<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einfache exemplarische Eingabefunktionen</title>
<style>
/* maskkit.css – softwareneutrale Eingabemasken im Buchstil (6. Auflage)
   Maßstab wie bei den Dashboards: 727 px = 110 mm (Abbildungsbreite), 1024 px = 155 mm; 14 px = 6 pt im Druck.
   Rollen: Eingabefeld weiß mit Rahmen · Anzeigefeld grau ohne Rahmen · Abschnittsband · Gruppenkopf · Knopf. */
:root {
  --ac: #3A3F44;          /* Anthrazit: Kopfleiste, Knopf, Pfeile, Links */
  --text: #1A1A1A;
  --muted: #4D4D4D;
  --rahmen: #9A9A9A;      /* Kontur der Eingabefelder und der Maske */
  --linie: #D9D9D9;       /* Haarlinien */
  --anzeige: #EFEFEF;     /* Anzeigefelder (nicht editierbar) */
  --band: #F6F6F6;        /* Abschnittsband */
  --schlecht: #C62828;    /* nur Fehlermeldungen in der interaktiven Fassung */
  --gut: #00806B;
  --schrift: Arial, "Liberation Sans", Helvetica, sans-serif;
  --zh: 26px;             /* Feldhöhe */
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #ECECEC; color: var(--text); font-family: var(--schrift); }
body.print { background: #FFFFFF; }

/* ---------- Lernplattform-Leiste und Panel (nicht im Druck) ---------- */
.mk-leiste { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: #FFFFFF;
  border-bottom: 1px solid var(--linie); display: flex; align-items: center; gap: 8px; padding: 0 16px;
  font-size: 14px; z-index: 30; }
.mk-leiste .mk-leiste-titel { font-weight: bold; margin-right: auto; }
.mk-leiste button { font: inherit; font-size: 14px; color: var(--text); background: #FFFFFF;
  border: 1px solid var(--rahmen); border-radius: 3px; padding: 6px 12px; cursor: pointer; }
.mk-leiste button[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: #FFFFFF; }
body.print .mk-leiste, body.print .mk-panel, body.print .mk-meldung { display: none !important; }
.mk-buehne { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; overflow: auto; }
body.print .mk-buehne { position: static; overflow: visible; }
.mk-rahmen { margin: 16px auto; box-shadow: 0 1px 3px rgba(0,0,0,.18); background: #FFFFFF; }
body.print .mk-rahmen { margin: 0; box-shadow: none; }
.mk-seite { position: relative; transform-origin: 0 0; background: #FFFFFF; }

.mk-marke { position: absolute; z-index: 20; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px;
  background: var(--ac); color: #FFFFFF; font-size: 13px; font-weight: bold; display: flex; align-items: center;
  justify-content: center; box-shadow: 0 0 0 2px #FFFFFF; cursor: pointer; }
.mk-marke.gestaltung { background: #FFFFFF; color: var(--ac); border: 2px solid var(--ac); }
.mk-marke.aktiv { background: var(--schlecht); color: #FFFFFF; border-color: var(--schlecht); }
.mk-panel { position: fixed; top: 44px; right: 0; bottom: 0; width: 380px; background: #FFFFFF;
  border-left: 1px solid var(--linie); overflow: auto; padding: 16px 18px; font-size: 14px; line-height: 1.4;
  z-index: 25; display: none; }
.mk-panel h2 { font-size: 17px; margin: 0 0 4px; }
.mk-panel .mk-panel-intro { color: var(--muted); margin-bottom: 12px; }
.mk-panel .mk-eintrag { padding: 10px 0; border-top: 1px solid var(--linie); cursor: pointer; }
.mk-panel .mk-eintrag.aktiv { background: var(--band); margin: 0 -18px; padding: 10px 18px; }
.mk-panel .mk-eintrag-kopf { display: flex; gap: 8px; align-items: baseline; font-weight: bold; }
.mk-panel .mk-regel { font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: bold; }
.mk-meldung { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ac); color: #FFFFFF;
  padding: 10px 16px; border-radius: 3px; font-size: 14px; z-index: 40; display: none; }
.mk-markiert { outline: 2px solid var(--schlecht); outline-offset: 2px; }

/* ---------- Maske ---------- */
.mk-maske { position: relative; width: 727px; background: #FFFFFF; border: 1px solid var(--rahmen);
  font-size: 14px; line-height: 18px; color: var(--text); margin: 0; }
.mk-kopf { height: 30px; background: var(--ac); color: #FFFFFF; font-size: 16px; font-weight: bold;
  line-height: 30px; padding: 0 15px; display: flex; justify-content: space-between; }
.mk-kopf .mk-kopf-info { font-weight: normal; font-size: 14px; color: #FFFFFF; }
.mk-inhalt { padding: 14px 15px 16px; }

/* Abschnitt mit Band (in der interaktiven Fassung auf- und zuklappbar) */
.mk-abschnitt + .mk-abschnitt { margin-top: 18px; }
.mk-band { height: 26px; line-height: 26px; background: var(--band); color: var(--ac); font-size: 14px; font-weight: bold;
  text-transform: uppercase; letter-spacing: .02em; padding: 0 8px; margin-bottom: 10px; position: relative; }
.mk-band .mk-klapp { position: absolute; right: 9px; top: 10px; }
body:not(.print) .mk-band { cursor: pointer; user-select: none; }
.mk-abschnitt.zu > :not(.mk-band) { display: none; }
.mk-abschnitt.zu .mk-klapp { transform: rotate(180deg); }

/* Gruppen */
.mk-gruppenkopf { font-weight: bold; height: 24px; line-height: 18px; border-bottom: 1px solid var(--rahmen);
  margin-bottom: 6px; white-space: nowrap; overflow: hidden; }
.mk-gruppe + .mk-gruppe { margin-top: 12px; }

/* Zeilen: Beschriftung + Feld(er); Spaltenbreiten über --sp-label, --sp-feld */
.mk-zeile { display: grid; grid-template-columns: var(--sp-label, 160px) var(--sp-feld, 192px); column-gap: 8px;
  align-items: center; min-height: var(--zh); }
.mk-zeile + .mk-zeile { margin-top: 4px; }
.mk-label { white-space: nowrap; overflow: hidden; }
.mk-label.mk-neben, .mk-neben { color: var(--muted); }
.mk-feldgruppe { display: flex; align-items: center; gap: 0; }
.mk-feldgruppe > .mk-feld { flex: 1 1 0; min-width: 0; }
.mk-feldgruppe > .mk-zwischen { flex: 0 0 auto; padding: 0 6px; color: var(--muted); }
.mk-feld.mk-datum { padding: 0 4px; text-align: center; }

/* Felder: input, select, textarea und deren Druckfassung (div) sehen gleich aus */
.mk-feld { display: block; width: 100%; height: var(--zh); margin: 0; padding: 0 7px; border: 1px solid var(--rahmen);
  border-radius: 2px; background: #FFFFFF; color: var(--text); font: inherit; font-size: 14px; line-height: 24px;
  white-space: nowrap; overflow: hidden; text-overflow: clip; position: relative; text-align: left; }
input.mk-feld, select.mk-feld, textarea.mk-feld { -webkit-appearance: none; appearance: none; outline: none; }
input.mk-feld:focus, select.mk-feld:focus, textarea.mk-feld:focus { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac); }
.mk-feld.mk-zahl { text-align: right; }
.mk-feld.mk-mitte { text-align: center; }
.mk-feld.mk-anzeige { background: var(--anzeige); border-color: var(--anzeige); }
.mk-feld.mk-leer { color: var(--muted); }
.mk-feld.mk-fehler { border-color: var(--schlecht); box-shadow: 0 0 0 1px var(--schlecht); }
select.mk-feld, .mk-feld.mk-auswahl { padding-right: 24px; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><polygon points='0,0 8,0 4,5' fill='%233A3F44'/></svg>");
  background-repeat: no-repeat; background-position: right 9px center; background-size: 8px 5px; }
div.mk-feld.mk-auswahl { background-image: none; }
.mk-feld .mk-pfeil { position: absolute; right: 9px; top: 10px; }
textarea.mk-feld, .mk-feld.mk-mehrzeilig { height: auto; white-space: pre-wrap; line-height: 18px; padding: 6px 8px; resize: none; }

/* Mehrzeiliger Anzeige- bzw. Textbereich (z. B. Brief), Absätze als <p> */
.mk-textbereich { border: 1px solid var(--rahmen); border-radius: 2px; background: #FFFFFF; padding: 8px 10px;
  font-size: 14px; line-height: 18px; overflow: hidden; }
.mk-textbereich.mk-anzeige { background: var(--anzeige); border-color: var(--anzeige); }
.mk-textbereich p { margin: 0 0 8px; }
.mk-textbereich p:last-child { margin-bottom: 0; }

/* Links */
.mk-link, a.mk-link { color: var(--ac); text-decoration: underline; cursor: pointer; }

/* Knöpfe */
.mk-knopf { display: inline-block; height: 30px; padding: 0 16px; border-radius: 3px; border: 1px solid var(--ac);
  background: var(--ac); color: #FFFFFF; font: inherit; font-size: 14px; font-weight: bold; line-height: 28px; cursor: pointer;
  white-space: nowrap; margin: 0; vertical-align: top; }
.mk-knopf.mk-zweit { background: #FFFFFF; color: var(--ac); }
button.mk-knopf { -webkit-appearance: none; appearance: none; }
.mk-knopfleiste { display: flex; gap: 8px; margin-top: 16px; }

/* Kontrollkästchen und Optionsfelder (Druckfassung als SVG) */
.mk-option { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
input.mk-check { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin: 0; border: 1px solid var(--rahmen);
  border-radius: 2px; background: #FFFFFF; position: relative; cursor: pointer; flex: 0 0 auto; }
input.mk-check[type="radio"] { border-radius: 7px; }
input.mk-check:checked { background: var(--ac); border-color: var(--ac); }
input.mk-check[type="checkbox"]:checked::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px;
  border: solid #FFFFFF; border-width: 0 2px 2px 0; transform: rotate(45deg); }
input.mk-check[type="radio"]:checked { background: #FFFFFF; }
input.mk-check[type="radio"]:checked::after { content: ""; position: absolute; left: 3px; top: 3px; width: 6px; height: 6px;
  border-radius: 3px; background: var(--ac); }
.mk-check-druck { width: 14px; height: 14px; flex: 0 0 auto; display: block; }

/* Raster / Tabelle mit Eingabezellen */
table.mk-tabelle { border-collapse: separate; border-spacing: 0 4px; margin: -4px 0; }
table.mk-tabelle th { font-weight: normal; color: var(--muted); text-align: left; padding: 0 8px 0 0; height: var(--zh); white-space: nowrap; }
table.mk-tabelle td { padding: 0 8px 0 0; height: var(--zh); white-space: nowrap; }
table.mk-tabelle td:last-child, table.mk-tabelle th:last-child { padding-right: 0; }

/* Reiter */
.mk-reiter { display: flex; gap: 2px; border-bottom: 1px solid var(--ac); margin-bottom: 10px; }
.mk-reiter > * { height: 26px; line-height: 26px; padding: 0 12px; background: var(--anzeige); color: var(--text); white-space: nowrap; }
.mk-reiter > .aktiv { background: var(--ac); color: #FFFFFF; font-weight: bold; }

/* Hilfsklassen für das Raster */
.mk-spalten { display: grid; grid-template-columns: var(--sp-links, 360px) var(--sp-rechts, 315px); column-gap: 20px; align-items: start; }
.mk-nur-interaktiv { }
body.print .mk-nur-interaktiv { display: none !important; }

</style>
</head>
<body>
<!-- Abb. 5.61 „Einfache exemplarische Eingabefunktionen“: vier Bedienelemente für Touch-Oberflächen
     (softwareneutral nachgebaut; Original: Smartphone-Bedienelemente mit englischer Beschriftung).
     Raster wie Abb. 3.7: Maske 727 px = 110 mm; Inhalt 695 px = linke Spalte 360 · Abstand 20 · rechte Spalte 315.
     Links Kalenderauswahl, rechts Zylinder-Zeitauswahl, An- und Ausschalter, Plus- und Minusschalter wie im Original.
     Kalendertage und Walzenzeilen erzeugt eingabe.js. Titelzeile wie Abb. 3.7/5.40. -->
<style>
  #eingabe { --sp-links: 360px; --sp-rechts: 315px; --sp-label: 135px; --sp-feld: 172px; }
  #eingabe .mk-kopf { display: block; height: auto; background: none; color: var(--text); padding: 12px 0 10px;
    margin: 0 15px; border-bottom: 1px solid var(--linie); line-height: normal; font-size: 14px; font-weight: normal; }
  #eingabe .mk-kopf .kopf-titel { display: block; font-size: 22px; line-height: 26px; font-weight: bold; }
  #eingabe .mk-kopf .kopf-unter { display: block; margin-top: 3px; line-height: 18px; color: var(--muted); }
  #eingabe .rechts .mk-abschnitt + .mk-abschnitt { margin-top: 18px; }
  /* Kalender */
  #eingabe .kal-nav { display: grid; grid-template-columns: 30px 1fr 30px; align-items: center; height: 26px; margin-bottom: 6px; }
  #eingabe .kal-nav .mk-knopf { width: 30px; height: 26px; line-height: 24px; padding: 0; text-align: center; font-size: 16px; }
  #eingabe .kal-monat { text-align: center; font-weight: bold; font-size: 16px; line-height: 20px; }
  #eingabe .kal-kopf { display: grid; grid-template-columns: repeat(7, 1fr); height: 22px; line-height: 22px; color: var(--muted); text-align: center; }
  #eingabe .kal { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid #D4D4D4; border-left: 1px solid #D4D4D4; }
  #eingabe .tag { height: 42px; line-height: 41px; text-align: center; border-right: 1px solid #D4D4D4; border-bottom: 1px solid #D4D4D4;
    background: #FFFFFF; color: var(--text); user-select: none; }
  #eingabe .tag.fremd { color: #6E747A; }
  #eingabe .tag.gewaehlt { background: var(--ac); color: #FFFFFF; font-weight: bold; }
  body:not(.print) #eingabe .tag { cursor: pointer; }
  body:not(.print) #eingabe .tag:hover:not(.gewaehlt), #eingabe .tag:focus:not(.gewaehlt) { background: var(--band); outline: none; }
  /* Zylinder-Zeitauswahl: drei Walzen, gültige Zeile in der Mitte */
  #eingabe .walze-kopf { display: grid; grid-template-columns: 150px 80px 85px; height: 22px; line-height: 22px; color: var(--muted); }
  #eingabe .walze-kopf span { padding-left: 10px; }
  #eingabe .walze-kopf span + span { padding-left: 0; padding-right: 22px; text-align: right; }
  #eingabe .walze { position: relative; display: grid; grid-template-columns: 150px 80px 85px; height: 132px;
    border: 1px solid var(--rahmen); border-radius: 2px; background: #FFFFFF; }
  #eingabe .walze-band { position: absolute; left: 0; right: 0; top: 52px; height: 26px; background: var(--anzeige);
    border-top: 1px solid var(--ac); border-bottom: 1px solid var(--ac); }
  #eingabe .rolle { position: relative; border-left: 1px solid #D4D4D4; }
  #eingabe .rolle:first-of-type { border-left: none; }
  #eingabe .zeile-w { height: 26px; line-height: 26px; padding: 0 10px; white-space: nowrap; user-select: none; }
  #eingabe .zeile-w.r0, #eingabe .zeile-w.r4 { color: #6E747A; }
  #eingabe .zeile-w.r1, #eingabe .zeile-w.r3 { color: var(--muted); }
  #eingabe .zeile-w.r2 { color: var(--text); font-weight: bold; }
  #eingabe .rolle.zahl .zeile-w { text-align: right; padding-right: 22px; }
  body:not(.print) #eingabe .zeile-w { cursor: pointer; }
  #eingabe .rolle:focus { outline: none; }
  body:not(.print) #eingabe .rolle:focus .zeile-w.r2 { text-decoration: underline; }
  /* An- und Ausschalter */
  #eingabe .schalter { position: relative; width: 64px; height: 26px; border: 1px solid var(--rahmen); border-radius: 13px;
    background: #FFFFFF; justify-self: start; }
  #eingabe .schalter .knopf { position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 10px;
    border: 1px solid var(--rahmen); background: #FFFFFF; }
  #eingabe .schalter .zustand { position: absolute; right: 9px; top: 0; line-height: 24px; color: var(--text); }
  #eingabe .schalter.an { background: var(--ac); border-color: var(--ac); }
  #eingabe .schalter.an .knopf { left: 40px; border-color: #FFFFFF; }
  #eingabe .schalter.an .zustand { right: auto; left: 10px; color: #FFFFFF; }
  body:not(.print) #eingabe .schalter { cursor: pointer; }
  #eingabe .schalter:focus { outline: none; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3px var(--ac); }
  /* Plus- und Minusschalter */
  #eingabe .stepper { display: grid; grid-template-columns: 30px 80px 30px; column-gap: 4px; justify-self: start; }
  #eingabe .stepper .mk-knopf { width: 30px; height: 26px; line-height: 24px; padding: 0; text-align: center; font-size: 16px; }
</style>
<form class="mk-maske" id="eingabe" autocomplete="off" novalidate>
  <div class="mk-kopf" id="kopf"><span class="kopf-titel" id="kopf-titel">Eingabefunktionen</span><span class="kopf-unter" id="kopf-unter">Bedienelemente für die Eingabe per Touch auf Tablet und Smartphone</span></div>
  <div class="mk-inhalt">
    <div class="mk-spalten">

      <section class="mk-abschnitt links" id="abschnitt-kalender">
        <div class="mk-band" id="band-kalender" data-klappbar="nein">Kalenderauswahl</div>
        <div class="kal-nav" id="kal-nav">
          <button type="button" class="mk-knopf mk-zweit" id="k-zurueck" aria-label="Vormonat">‹</button>
          <span class="kal-monat" id="kal-monat" aria-live="polite">Januar 2027</span>
          <button type="button" class="mk-knopf mk-zweit" id="k-vor" aria-label="Folgemonat">›</button>
        </div>
        <div class="kal-kopf" id="kal-kopf"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div>
        <div class="kal" id="kal" role="grid" aria-label="Tage auswählen"></div>
      </section>

      <div class="rechts">
        <section class="mk-abschnitt" id="abschnitt-walze">
          <div class="mk-band" id="band-walze" data-klappbar="nein">Zylinder-Zeitauswahl</div>
          <div class="walze-kopf" id="walze-kopf"><span>Datum</span><span>Stunde</span><span>Minute</span></div>
          <div class="walze" id="walze">
            <div class="walze-band" aria-hidden="true"></div>
            <div class="rolle" id="walze-datum" data-rolle="datum" tabindex="0" role="listbox" aria-label="Datum"></div>
            <div class="rolle zahl" id="walze-stunde" data-rolle="stunde" tabindex="0" role="listbox" aria-label="Stunde"></div>
            <div class="rolle zahl" id="walze-minute" data-rolle="minute" tabindex="0" role="listbox" aria-label="Minute"></div>
          </div>
        </section>

        <section class="mk-abschnitt" id="abschnitt-schalter">
          <div class="mk-band" id="band-schalter" data-klappbar="nein">An- und Ausschalter</div>
          <div class="mk-zeile" id="z-schalter">
            <span class="mk-label" id="l-schalter">Vorjahr einblenden</span>
            <div class="schalter" id="f-schalter" role="switch" tabindex="0" aria-checked="false" aria-labelledby="l-schalter">
              <span class="knopf"></span><span class="zustand" id="schalter-text">Aus</span>
            </div>
          </div>
        </section>

        <section class="mk-abschnitt" id="abschnitt-stepper">
          <div class="mk-band" id="band-stepper" data-klappbar="nein">Plus- und Minusschalter</div>
          <div class="mk-zeile" id="z-jahr">
            <label class="mk-label" for="f-jahr">Jahr</label>
            <div class="stepper" id="stepper">
              <button type="button" class="mk-knopf mk-zweit" id="k-minus" aria-label="Jahr verringern">−</button>
              <input class="mk-feld mk-mitte" id="f-jahr" value="2026" inputmode="numeric" data-hilfe="Jahr zwischen 2000 und 2099">
              <button type="button" class="mk-knopf mk-zweit" id="k-plus" aria-label="Jahr erhöhen">+</button>
            </div>
          </div>
        </section>
      </div>

    </div>
  </div>
</form>

<script>
/* maskkit.js – softwareneutrale Eingabemasken im Buchstil (6. Auflage)
   Die Maske ist HTML5 (<form class="mk-maske">) mit den Klassen aus maskkit.css.
   ?print: Druckfassung – Steuerelemente werden zu statischen Elementen gleicher Geometrie, ohne Leiste.
   MK.exportieren() liefert alle Flächen, Linien, Formen und Textzeilen in px für die PowerPoint-Ausgabe. */
const MK = (() => {
  "use strict";
  const Q = new URLSearchParams(location.search);
  const PRINT = Q.has("print");
  if (PRINT) document.body.classList.add("print");
  const NS = "http://www.w3.org/2000/svg";
  const NBSP = String.fromCharCode(0xA0), MINUS = String.fromCharCode(0x2212);

  /* ---------------- DOM/SVG ---------------- */
  function el(tag, attrs = {}, parent, text) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
    }
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function sv(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  // Pfeil nach unten (Auswahlfeld) bzw. oben (Klappband), 8 x 5 px
  function pfeil(cls, oben = false) {
    const s = sv("svg", { width: 8, height: 5, viewBox: "0 0 8 5", class: cls, "aria-hidden": "true" });
    sv("polygon", { points: oben ? "0,5 8,5 4,0" : "0,0 8,0 4,5", fill: "#3A3F44" }, s);
    return s;
  }

  /* ---------------- Zahlen und Datum (deutsches Format) ---------------- */
  const NF = {};
  const nf = nk => NF[nk] || (NF[nk] = new Intl.NumberFormat("de-DE", { minimumFractionDigits: nk, maximumFractionDigits: nk }));
  function zahl(v, nk = 1) { return v == null || isNaN(v) ? "" : (v < 0 ? MINUS : "") + nf(nk).format(Math.abs(v)); }
  function leseZahl(text) {
    const t = String(text).trim().replace(MINUS, "-").replace(/\s/g, "");
    if (!t) return null;
    if (!/^-?(\d{1,3}(\.\d{3})+|\d+)(,\d+)?$/.test(t)) return NaN;
    return parseFloat(t.replace(/\./g, "").replace(",", "."));
  }
  function leseDatum(text) {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(text).trim());
    if (!m) return null;
    const d = new Date(+m[3], +m[2] - 1, +m[1]);
    return d.getMonth() === +m[2] - 1 ? d : null;
  }
  function datum(d) { return d ? String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear() : ""; }
  // Eingabe prüfen und markieren; liefert den Wert oder null
  function pruefeFeld(feld, art = "zahl", opt = {}) {
    const t = feld.value;
    let v = null, ok = true;
    if (art === "zahl") {
      v = leseZahl(t);
      ok = v === null ? !opt.pflicht : !isNaN(v) && (opt.min == null || v >= opt.min) && (opt.max == null || v <= opt.max);
    } else if (art === "datum") {
      v = leseDatum(t);
      ok = t.trim() === "" ? !opt.pflicht : v !== null;
    }
    feld.classList.toggle("mk-fehler", !ok);
    feld.title = ok ? (feld.dataset.hilfe || "") : (opt.meldung || "Eingabe prüfen");
    return ok ? v : null;
  }

  /* ---------------- Seite, Skalierung, Leiste ---------------- */
  let seite, rahmen, buehne, panel, maske, meldungEl, leiste, B = 727, H = 0;
  function init(o = {}) {
    document.title = o.titel || document.title;
    maske = document.querySelector(o.maske || ".mk-maske");
    if (!maske) throw new Error("Keine .mk-maske gefunden");
    if (!PRINT) {
      leiste = el("div", { class: "mk-leiste" }, document.body);
      el("div", { class: "mk-leiste-titel" }, leiste, o.titel || "");
    }
    buehne = el("div", { class: "mk-buehne" }, document.body);
    rahmen = el("div", { class: "mk-rahmen" }, buehne);
    seite = el("div", { class: "mk-seite", id: "seite" }, rahmen);
    seite.appendChild(maske);
    panel = el("div", { class: "mk-panel" }, document.body);
    meldungEl = el("div", { class: "mk-meldung", role: "status" }, document.body);
    // Klappbänder: Klick auf das Band klappt den Abschnitt auf und zu (nur interaktiv)
    maske.querySelectorAll(".mk-abschnitt > .mk-band").forEach(b => {
      if (PRINT || b.dataset.klappbar === "nein") return;
      b.appendChild(pfeil("mk-klapp mk-nur-interaktiv", true));
      b.setAttribute("role", "button"); b.tabIndex = 0;
      const klapp = () => { b.parentElement.classList.toggle("zu"); skalieren(); if (MK._ebenenNeu) MK._ebenenNeu(); };
      b.addEventListener("click", klapp);
      b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); klapp(); } });
    });
    maske.addEventListener("submit", e => e.preventDefault());
    addEventListener("resize", skalieren);
    return maske;
  }
  function skalieren() {
    B = maske.offsetWidth; H = maske.offsetHeight;
    seite.style.width = B + "px"; seite.style.height = H + "px";
    if (PRINT) { rahmen.style.width = B + "px"; rahmen.style.height = H + "px"; seite.style.transform = ""; return; }
    const frei = panel.style.display === "block" ? 380 : 0;
    const s = Math.max(0.4, Math.min(1.6, (innerWidth - frei - 32) / B, (innerHeight - 44 - 32) / H));
    seite.style.transform = `scale(${s})`;
    rahmen.style.width = B * s + "px"; rahmen.style.height = H * s + "px";
    rahmen.style.marginLeft = frei ? "16px" : "auto";
  }
  function meldung(text) {
    meldungEl.textContent = text; meldungEl.style.display = "block";
    clearTimeout(meldung._t); meldung._t = setTimeout(() => { meldungEl.style.display = "none"; }, 2600);
  }

  /* ---------------- Druckfassung: Steuerelemente -> statische Elemente ---------------- */
  let fertigGemeldet = false;
  function kopieAttribute(von, nach) {
    ["id", "style", "title"].forEach(a => { if (von.getAttribute(a)) nach.setAttribute(a, von.getAttribute(a)); });
    Object.entries(von.dataset).forEach(([k, v]) => { nach.dataset[k] = v; });
  }
  function druckfassung() {
    maske.querySelectorAll("input, select, textarea, button").forEach(f => {
      let d;
      if (f.matches("input.mk-check")) {
        d = sv("svg", { width: 14, height: 14, viewBox: "0 0 14 14", class: "mk-check-druck" });
        if (f.type === "radio") {
          sv("circle", { cx: 7, cy: 7, r: 6.5, fill: "#FFFFFF", stroke: "#9A9A9A", "stroke-width": 1 }, d);
          if (f.checked) sv("circle", { cx: 7, cy: 7, r: 3, fill: "#3A3F44" }, d);
        } else {
          sv("rect", { x: 0.5, y: 0.5, width: 13, height: 13, rx: 2, fill: f.checked ? "#3A3F44" : "#FFFFFF",
                       stroke: f.checked ? "#3A3F44" : "#9A9A9A", "stroke-width": 1 }, d);
          if (f.checked) sv("polyline", { points: "3.5,7.2 6,9.6 10.5,4.4", fill: "none", stroke: "#FFFFFF", "stroke-width": 2 }, d);
        }
      } else if (f.tagName === "SELECT") {
        d = el("div", { class: f.className + " mk-auswahl" });
        el("span", {}, d, f.selectedIndex >= 0 ? f.options[f.selectedIndex].text : "");
        d.appendChild(pfeil("mk-pfeil"));
      } else if (f.tagName === "TEXTAREA") {
        d = el("div", { class: f.className + " mk-mehrzeilig" }, undefined, f.value);
        d.style.height = f.offsetHeight + "px";               // Höhe aus rows übernehmen
      } else if (f.tagName === "BUTTON") {
        d = el("div", { class: f.className }, undefined, f.textContent);
      } else if (f.type === "hidden") {
        return;
      } else {
        d = el("div", { class: f.className }, undefined, f.value);
      }
      if (!(d instanceof SVGElement)) { const h = d.style.height; kopieAttribute(f, d); if (h) d.style.height = h; }
      f.replaceWith(d);
    });
  }
  // Am Ende des Masken-Skripts aufrufen: setzt die Druckfassung und skaliert
  function fertig() {
    if (fertigGemeldet) return;
    fertigGemeldet = true;
    if (PRINT) druckfassung();
    skalieren();
    if (MK._ebenenNeu) MK._ebenenNeu();
  }

  /* ---------------- Ebenen der Lernplattform: Erläuterungen und Gestaltung ---------------- */
  function zielElement(z) { return !z ? null : document.getElementById(z) || maske.querySelector(z); }
  function ebenen(o) {
    if (PRINT) return;
    let modus = null;
    const marken = [], knoepfe = {};
    const arten = [["erlaeuterungen", "Erläuterungen", ""], ["gestaltung", "Gestaltung", "gestaltung"]].filter(([k]) => o[k]);
    arten.forEach(([k, text]) => {
      const b = el("button", { type: "button", "aria-pressed": "false" }, leiste, text);
      b.addEventListener("click", () => umschalten(k));
      knoepfe[k] = b;
    });
    function markenWeg() { marken.forEach(m => m.remove()); marken.length = 0; maske.querySelectorAll(".mk-markiert").forEach(e => e.classList.remove("mk-markiert")); }
    function markeSetzen(eintrag, text, cls) {
      const z = zielElement(eintrag.ziel);
      if (!z || !z.offsetParent) return;
      const [dx, dy] = eintrag.versatz || [0, 0];
      const sr = seite.getBoundingClientRect(), r = z.getBoundingClientRect(), sk = sr.width / B;
      // anker "rechts" (Standard): Marke an der rechten oberen Ecke des Ziels; "links": links neben dem Ziel
      const x = eintrag.anker === "links" ? (r.left - sr.left) / sk - 28 : (r.right - sr.left) / sk - 22;
      const m = el("div", { class: "mk-marke " + cls, style: `left:${x + dx}px;top:${(r.top - sr.top) / sk - 4 + dy}px` }, seite, text);
      m.addEventListener("click", () => aktiv(text, eintrag));
      marken.push(m);
    }
    function aktiv(text, eintrag) {
      panel.querySelectorAll(".mk-eintrag").forEach(e => e.classList.toggle("aktiv", e.dataset.marke === text));
      marken.forEach(m => m.classList.toggle("aktiv", m.textContent === text));
      maske.querySelectorAll(".mk-markiert").forEach(e => e.classList.remove("mk-markiert"));
      const z = eintrag && zielElement(eintrag.ziel);
      if (z) z.classList.add("mk-markiert");
      const e = panel.querySelector(`.mk-eintrag[data-marke="${text}"]`);
      if (e) e.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    function umschalten(k) {
      modus = modus === k ? null : k;
      Object.entries(knoepfe).forEach(([a, b]) => b.setAttribute("aria-pressed", String(modus === a)));
      markenWeg(); panel.textContent = "";
      panel.style.display = modus ? "block" : "none";
      skalieren();
      if (!modus) return;
      const def = o[modus], cls = modus === "gestaltung" ? "gestaltung" : "";
      el("h2", {}, panel, def.titel || (modus === "gestaltung" ? "Gestaltung" : "Erläuterungen"));
      if (def.intro) el("div", { class: "mk-panel-intro" }, panel, def.intro);
      def.eintraege.forEach(r => {
        const nr = String(r.nr);
        const e = el("div", { class: "mk-eintrag", "data-marke": nr }, panel);
        const kopf = el("div", { class: "mk-eintrag-kopf" }, e);
        el("span", {}, kopf, modus === "gestaltung" ? nr : nr + "."); el("span", {}, kopf, r.titel);
        if (r.regel) el("div", { class: "mk-regel" }, e, r.regel);
        el("div", {}, e, r.text);
        e.addEventListener("click", () => aktiv(nr, r));
        markeSetzen(r, nr, cls);
      });
    }
    MK._ebenenNeu = () => { if (modus) { const m = modus; modus = null; umschalten(m); } };
    addEventListener("keydown", e => { if (e.key === "Escape" && modus) umschalten(modus); });
  }

  /* ---------------- Export für PowerPoint (Druckfassung) ---------------- */
  function farbe(c) {
    const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/.exec(c || "");
    if (!m) return null;
    const a = m[4] === undefined ? 1 : parseFloat(m[4]);
    const hex = [m[1], m[2], m[3]].map(v => Math.round(+v).toString(16).padStart(2, "0")).join("").toUpperCase();
    return { hex, a };
  }
  function exportieren() {
    const R = maske.getBoundingClientRect();
    const formen = [];
    const name = e => e.id || e.dataset.name || (e.className && typeof e.className === "string" ? e.className.split(" ")[0] : e.tagName);
    const sichtbar = s => s.w > 0 && s.st !== "none" && s.st !== "hidden" && s.c && s.c.a > 0;
    function kasten(e, cs) {
      const r = e.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const bg = farbe(cs.backgroundColor);
      const seiten = ["Top", "Right", "Bottom", "Left"].map(s => ({ w: parseFloat(cs["border" + s + "Width"]) || 0,
        c: farbe(cs["border" + s + "Color"]), st: cs["border" + s + "Style"] }));
      const gleich = seiten.every(s => sichtbar(s) && s.w === seiten[0].w && s.c.hex === seiten[0].c.hex && s.st === seiten[0].st);
      const x = r.left - R.left, y = r.top - R.top, rad = parseFloat(cs.borderTopLeftRadius) || 0;
      const fuell = bg && bg.a > 0.01 ? bg.hex : null;
      if (fuell || gleich) {
        const lw = gleich ? seiten[0].w : 0;
        formen.push({ t: "rect", name: name(e), x: x + lw / 2, y: y + lw / 2, w: r.width - lw, h: r.height - lw,
                      fill: fuell, line: gleich ? seiten[0].c.hex : null, lw, dash: gleich && seiten[0].st === "dashed", r: rad });
      }
      if (!gleich) seiten.forEach((s, i) => {
        if (!sichtbar(s)) return;
        const h = s.w / 2;
        const p = [[x, y + h, x + r.width, y + h], [x + r.width - h, y, x + r.width - h, y + r.height],
                   [x, y + r.height - h, x + r.width, y + r.height - h], [x + h, y, x + h, y + r.height]][i];
        formen.push({ t: "linie", name: name(e), x1: p[0], y1: p[1], x2: p[2], y2: p[3], farbe: s.c.hex, lw: s.w, dash: s.st === "dashed" });
      });
    }
    function svgFormen(svg) {
      svg.querySelectorAll("polygon, polyline, rect, circle, line").forEach(k => {
        const cs = getComputedStyle(k), M = k.getScreenCTM();
        const pt = (x, y) => { const p = new DOMPoint(x, y).matrixTransform(M); return [p.x - R.left, p.y - R.top]; };
        const f = farbe(cs.fill), s = farbe(cs.stroke), lw = parseFloat(cs.strokeWidth) || 0;
        const fill = f && f.a > 0.01 ? f.hex : null, line = s && s.a > 0.01 && lw > 0 ? s.hex : null;
        const tag = k.tagName.toLowerCase();
        if (tag === "polygon" || tag === "polyline") {
          const pts = [...k.points].map(p => pt(p.x, p.y));
          formen.push({ t: "poly", name: "Form", pts, zu: tag === "polygon", fill: tag === "polygon" ? fill : null, line, lw });
        } else if (tag === "rect") {
          const x = +k.getAttribute("x") || 0, y = +k.getAttribute("y") || 0, w = +k.getAttribute("width"), h = +k.getAttribute("height");
          const a = pt(x, y), b = pt(x + w, y + h);
          formen.push({ t: "rect", name: "Form", x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1], fill, line, lw, r: +k.getAttribute("rx") || 0 });
        } else if (tag === "circle") {
          const cx = +k.getAttribute("cx"), cy = +k.getAttribute("cy"), r = +k.getAttribute("r");
          const a = pt(cx - r, cy - r), b = pt(cx + r, cy + r);
          formen.push({ t: "oval", name: "Form", x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1], fill, line, lw });
        } else if (tag === "line") {
          const a = pt(+k.getAttribute("x1"), +k.getAttribute("y1")), b = pt(+k.getAttribute("x2"), +k.getAttribute("y2"));
          formen.push({ t: "linie", name: "Linie", x1: a[0], y1: a[1], x2: b[0], y2: b[1], farbe: line, lw });
        }
      });
    }
    function text(n) {
      const t = n.textContent;
      if (!t.trim()) return;
      const p = n.parentElement, cs = getComputedStyle(p);
      const woerter = [], re = /[^\s]+/g;
      let m;
      while ((m = re.exec(t))) {
        const rg = document.createRange();
        rg.setStart(n, m.index); rg.setEnd(n, m.index + m[0].length);
        const rs = [...rg.getClientRects()].filter(r => r.width > 0);
        if (rs.length) woerter.push({ a: m.index, b: m.index + m[0].length, r: rs[0] });
      }
      if (!woerter.length) return;
      const zeilen = [];
      woerter.forEach(w => {
        const z = zeilen[zeilen.length - 1];
        if (z && Math.abs(z.top - w.r.top) < 2) { z.b = w.b; z.right = Math.max(z.right, w.r.right); z.bottom = Math.max(z.bottom, w.r.bottom); }
        else zeilen.push({ a: w.a, b: w.b, left: w.r.left, right: w.r.right, top: w.r.top, bottom: w.r.bottom });
      });
      const gross = cs.textTransform === "uppercase";
      const unter = (cs.textDecorationLine || cs.textDecoration || "").includes("underline");
      formen.push({ t: "text", name: name(p), groesse: parseFloat(cs.fontSize), fett: parseInt(cs.fontWeight, 10) >= 600,
        kursiv: cs.fontStyle === "italic", farbe: (farbe(cs.color) || { hex: "1A1A1A" }).hex, unter,
        ausr: { right: "r", end: "r", center: "c" }[cs.textAlign] || "l",
        sperr: parseFloat(cs.letterSpacing) || 0,
        zeilen: zeilen.map(z => {
          let s = t.slice(z.a, z.b).replace(/[ \t\n\r]+/g, " ");
          if (gross) s = s.toUpperCase();
          return { x: z.left - R.left, y: z.top - R.top, w: z.right - z.left, h: z.bottom - z.top, text: s };
        }) });
    }
    function gehe(n) {
      if (n.nodeType === 3) { text(n); return; }
      if (n.nodeType !== 1) return;
      const cs = getComputedStyle(n);
      if (cs.display === "none" || cs.visibility === "hidden") return;
      if (n.tagName.toLowerCase() === "svg") { svgFormen(n); return; }
      kasten(n, cs);
      n.childNodes.forEach(gehe);
    }
    gehe(maske);
    return { breite: R.width, hoehe: R.height, formen };
  }

  /* ---------------- Prüfungen (Druckfassung) ---------------- */
  function kontrast(a, b) {
    const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
    const L = h => 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16));
    const [x, y] = [L(a), L(b)].sort((p, q) => q - p);
    return (x + 0.05) / (y + 0.05);
  }
  function pruefen() {
    const R = maske.getBoundingClientRect(), probleme = [];
    const kurz = s => s.trim().replace(/\s+/g, " ").slice(0, 40);
    maske.querySelectorAll("*").forEach(e => {
      const cs = getComputedStyle(e);
      if (cs.display === "none" || e.closest("svg")) return;
      const r = e.getBoundingClientRect();
      if (r.width && (r.left < R.left - 0.5 || r.right > R.right + 0.5 || r.bottom > R.bottom + 0.5))
        probleme.push(`Überlauf aus der Maske: ${e.className || e.tagName} „${kurz(e.textContent)}“`);
      if (e.textContent.trim() && (cs.overflow === "hidden" || cs.overflowX === "hidden") &&
          (e.scrollWidth > e.clientWidth + 1 || e.scrollHeight > e.clientHeight + 1))
        probleme.push(`Text abgeschnitten: „${kurz(e.textContent)}“`);
    });
    const tw = document.createTreeWalker(maske, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = tw.nextNode())) {
      if (!n.textContent.trim()) continue;
      const p = n.parentElement, cs = getComputedStyle(p);
      if (cs.display === "none") continue;
      if (parseFloat(cs.fontSize) < 13.9) probleme.push(`Schrift unter 6 pt (${cs.fontSize}): „${kurz(n.textContent)}“`);
      let a = p, bg = null;
      while (a && !bg) { const f = farbe(getComputedStyle(a).backgroundColor); if (f && f.a > 0.5) bg = f.hex; a = a.parentElement; }
      const fg = farbe(cs.color);
      if (fg && kontrast(fg.hex, bg || "FFFFFF") < 4.5) probleme.push(`Kontrast < 4,5:1: „${kurz(n.textContent)}“`);
    }
    return [...new Set(probleme)];
  }

  return { PRINT, NBSP, MINUS, el, sv, pfeil, zahl, leseZahl, leseDatum, datum, pruefeFeld, init, fertig, skalieren,
           meldung, ebenen, exportieren, pruefen, druckfassung };
})();

</script>
<script>
/* Abb. 5.61 „Einfache exemplarische Eingabefunktionen“ – Logik der vier Bedienelemente.
   Kalender (Mehrfachauswahl, Monatswechsel), Zylinder-Zeitauswahl (drei unabhängige Walzen, Klick, Mausrad,
   Pfeiltasten), An- und Ausschalter, Plus- und Minusschalter mit geprüftem Jahresfeld.
   Anfangszustand = Druckfassung: Januar 2027 ohne Auswahl, Mo 25.01. 20:00, Schalter aus, Jahr 2026
   (Original: Januar 2010, Mon Jan 25 8:00 PM, OFF, 2009 – 2027 beginnt wie 2010 an einem Freitag). */
(() => {
  "use strict";
  const { el, pruefeFeld, leseZahl } = MK;
  const PRINT = MK.PRINT;
  MK.init({ titel: "Einfache exemplarische Eingabefunktionen" });
  const $ = id => document.getElementById(id);
  const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  const WT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const WT_LANG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const z2 = n => String(n).padStart(2, "0");
  const tt = d => z2(d.getDate()) + "." + z2(d.getMonth() + 1) + ".";
  const iso = d => d.getFullYear() + "-" + z2(d.getMonth() + 1) + "-" + z2(d.getDate());

  /* ---------- Kalenderauswahl ---------- */
  const K = { jahr: 2027, monat: 0, auswahl: new Set() };
  function kalender() {
    $("kal-monat").textContent = MONATE[K.monat] + " " + K.jahr;
    const kal = $("kal");
    kal.textContent = "";
    const erster = new Date(K.jahr, K.monat, 1);
    const start = new Date(K.jahr, K.monat, 1 - ((erster.getDay() + 6) % 7));     // Montag davor
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const fremd = d.getMonth() !== K.monat;
      const c = el("div", { class: "tag" + (fremd ? " fremd" : "") + (K.auswahl.has(iso(d)) ? " gewaehlt" : ""),
        role: "gridcell", "aria-label": `${WT_LANG[d.getDay()]}, ${tt(d)}${d.getFullYear()}`,
        "aria-selected": String(K.auswahl.has(iso(d))) }, kal, String(d.getDate()));
      if (PRINT) continue;
      c.tabIndex = fremd ? -1 : 0;
      const waehlen = () => {
        if (fremd) { K.jahr = d.getFullYear(); K.monat = d.getMonth(); }
        if (K.auswahl.has(iso(d))) K.auswahl.delete(iso(d)); else K.auswahl.add(iso(d));
        kalender(); meldeTage();
      };
      c.addEventListener("click", waehlen);
      c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); waehlen(); } });
    }
  }
  function meldeTage() {
    const t = [...K.auswahl].sort();
    if (!t.length) { MK.meldung("Kein Tag ausgewählt."); return; }
    const f = s => s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4);
    MK.meldung(`Ausgewählt: ${t.length} ${t.length === 1 ? "Tag" : "Tage"} (${t.slice(0, 4).map(f).join(", ")}${t.length > 4 ? " …" : ""})`);
  }
  const blaettern = schritt => {
    const d = new Date(K.jahr, K.monat + schritt, 1);
    K.jahr = d.getFullYear(); K.monat = d.getMonth(); kalender();
  };
  $("k-zurueck").addEventListener("click", () => blaettern(-1));
  $("k-vor").addEventListener("click", () => blaettern(1));
  kalender();

  /* ---------- Zylinder-Zeitauswahl ---------- */
  const W = { datum: new Date(2027, 0, 25), stunde: 20, minute: 0 };
  const ROLLEN = {
    datum: { wert: k => { const d = W.datum; return new Date(d.getFullYear(), d.getMonth(), d.getDate() + k); },
             text: d => WT[d.getDay()] + " " + tt(d), schieben: k => { W.datum = ROLLEN.datum.wert(k); } },
    stunde: { wert: k => (W.stunde + k + 24) % 24, text: v => z2(v), schieben: k => { W.stunde = (W.stunde + k + 24) % 24; } },
    minute: { wert: k => (W.minute + 5 * k + 60) % 60, text: v => z2(v), schieben: k => { W.minute = (W.minute + 5 * k + 60) % 60; } },
  };
  function walze() {
    Object.entries(ROLLEN).forEach(([name, r]) => {
      const box = $("walze-" + name);
      box.textContent = "";
      for (let i = 0; i < 5; i++) {
        const z = el("div", { class: "zeile-w r" + i, role: "option", "aria-selected": String(i === 2) }, box, r.text(r.wert(i - 2)));
        if (!PRINT && i !== 2) z.addEventListener("click", () => drehen(name, i - 2));
      }
    });
  }
  function drehen(name, k) {
    ROLLEN[name].schieben(k); walze();
    const d = W.datum;
    MK.meldung(`Gewählt: ${WT_LANG[d.getDay()]}, ${tt(d)}${d.getFullYear()}, ${z2(W.stunde)}:${z2(W.minute)} Uhr`);
  }
  if (!PRINT) Object.keys(ROLLEN).forEach(name => {
    const box = $("walze-" + name);
    box.addEventListener("wheel", e => { e.preventDefault(); drehen(name, e.deltaY > 0 ? 1 : -1); }, { passive: false });
    box.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); drehen(name, 1); }
      if (e.key === "ArrowUp") { e.preventDefault(); drehen(name, -1); }
    });
  });
  walze();

  /* ---------- An- und Ausschalter ---------- */
  const sch = $("f-schalter");
  function schalten() {
    const an = sch.getAttribute("aria-checked") !== "true";
    sch.setAttribute("aria-checked", String(an));
    sch.classList.toggle("an", an);
    $("schalter-text").textContent = an ? "Ein" : "Aus";
    MK.meldung(an ? "Vorjahreswerte werden eingeblendet." : "Vorjahreswerte werden ausgeblendet.");
  }
  if (!PRINT) {
    sch.addEventListener("click", schalten);
    sch.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); schalten(); } });
  }

  /* ---------- Plus- und Minusschalter ---------- */
  const jahr = $("f-jahr"), MIN = 2000, MAX = 2099;
  const pruefen = () => pruefeFeld(jahr, "zahl", { pflicht: true, min: MIN, max: MAX, meldung: `Jahr zwischen ${MIN} und ${MAX}` });
  function stufe(k) {
    const v = pruefen();
    const neu = Math.min(MAX, Math.max(MIN, (v === null ? 2026 : Math.round(v)) + k));
    jahr.value = String(neu); pruefen();
    if (neu === MIN || neu === MAX) MK.meldung(`Grenze erreicht: ${neu}`);
  }
  jahr.addEventListener("input", pruefen);
  jahr.addEventListener("blur", () => { const v = leseZahl(jahr.value); if (v !== null && !isNaN(v) && v >= MIN && v <= MAX) jahr.value = String(Math.round(v)); });
  jahr.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") { e.preventDefault(); stufe(1); }
    if (e.key === "ArrowDown") { e.preventDefault(); stufe(-1); }
  });
  $("k-minus").addEventListener("click", () => stufe(-1));
  $("k-plus").addEventListener("click", () => stufe(1));

  /* ---------- Lernplattform: Erläuterungen und Gestaltung ---------- */
  MK.ebenen({
    erlaeuterungen: {
      titel: "Erläuterungen",
      intro: "Wofür die Eingabefunktionen in Planungs- und BI-Anwendungen auf Tablet und Smartphone dienen. Die Nummern in der Maske zeigen, wo.",
      eintraege: [
        { nr: 1, ziel: "band-kalender", versatz: [-6, 2], titel: "Kalenderauswahl",
          text: "Stichtage und Zeiträume werden angetippt statt eingetippt – etwa Berichtsstichtag, Planungstermine oder Abwesenheiten. Mehrere Tage sind wählbar; ein zweiter Klick hebt die Auswahl wieder auf." },
        { nr: 2, ziel: "kal-monat", versatz: [-62, 2], titel: "Monat wechseln",
          text: "Die Pfeile blättern monatsweise. Tage der Nachbarmonate erscheinen grau; ein Klick darauf wechselt in diesen Monat." },
        { nr: 3, ziel: "band-walze", versatz: [-6, 2], titel: "Zylinder-Zeitauswahl",
          text: "Datum und Uhrzeit auf kleinem Bildschirm: Jede Walze dreht sich unabhängig (Klick auf eine Zeile, Mausrad oder Pfeiltasten), der Wert im Band gilt. Beispiel: Termin für den automatischen Berichtsversand oder die Abgabefrist der Planung." },
        { nr: 4, ziel: "walze-minute", versatz: [-60, 30], titel: "Nur gültige Werte",
          text: "Die Walzen bieten nur gültige Werte an, Minuten im Raster von 5. Tippfehler und unmögliche Angaben wie der 31.02. sind ausgeschlossen." },
        { nr: 5, ziel: "band-schalter", versatz: [-6, 2], titel: "An- und Ausschalter",
          text: "Für Einstellungen mit genau zwei Zuständen, etwa Vorjahreswerte einblenden, Benachrichtigung bei Planabweichungen oder eine Simulation ein- und ausschalten. Der Schalter wirkt sofort, ohne Speichern." },
        { nr: 6, ziel: "band-stepper", versatz: [-6, 2], titel: "Plus- und Minusschalter",
          text: "Ändert einen Zahlenwert in festen Schritten – Jahr, Planversion, Menge oder Prozentpunkte in einer What-if-Simulation. Der Wert lässt sich auch direkt eingeben." },
        { nr: 7, ziel: "kopf-unter", versatz: [6, 2], titel: "Auswählen statt tippen",
          text: "Mobile BI- und Planungsanwendungen ersetzen Tastatureingaben durch Auswahl mit großen Trefferflächen. Das beschleunigt die Erfassung unterwegs und vermeidet Eingabefehler, verlangt aber ein responsives Design der Masken." },
      ],
    },
    gestaltung: {
      titel: "Gestaltung",
      intro: "Was gegenüber dem Original geändert wurde – softwareneutral im Buchstil und nach den Interaktionsprinzipien der DIN EN ISO 9241-110.",
      eintraege: [
        { nr: "A", ziel: "kopf-titel", versatz: [8, 2], regel: "BUCHSTIL – SOFTWARENEUTRAL", titel: "Kein Gerät, keine Systemleiste",
          text: "Die Navigationsleiste des Smartphones mit „Back“ und „Select Days“ entfällt. Die vier Beispiele stehen als eine Maske mit Abschnittsbändern, benannt wie im Original." },
        { nr: "B", ziel: "kal-kopf", anker: "links", versatz: [0, 2], regel: "ERWARTUNGSKONFORMITÄT", titel: "Woche ab Montag, deutsch",
          text: "Die Woche beginnt am Montag (ISO 8601), Wochentage und Monat sind deutsch. Das Original zeigte englische Bezeichnungen und begann am Sonntag." },
        { nr: "C", ziel: "walze-stunde", versatz: [-62, 30], regel: "ERWARTUNGSKONFORMITÄT", titel: "24-Stunden-Format",
          text: "Uhrzeit im 24-Stunden-Format, Datum als TT.MM. – aus „Mon Jan 25 8:00 PM“ wird „Mo 25.01. 20:00“. Die AM/PM-Walze entfällt." },
        { nr: "D", ziel: "walze-kopf", versatz: [-190, 2], regel: "SELBSTBESCHREIBUNGSFÄHIGKEIT", titel: "Flache Walze mit Spaltenköpfen",
          text: "Verläufe, Glanz und Schatten der 3D-Walze entfallen; die gültige Zeile ist ein graues Band mit Linien, die äußeren Zeilen werden heller. Die Köpfe Datum, Stunde und Minute sind ergänzt." },
        { nr: "E", ziel: "f-schalter", versatz: [36, 2], regel: "SELBSTBESCHREIBUNGSFÄHIGKEIT", titel: "Zustand dreifach erkennbar",
          text: "Stellung des Knopfs, Füllung und Text „Aus“/„Ein“ (statt OFF) zeigen den Zustand – nicht die Farbe allein. Die Beschriftung sagt, wofür der Schalter steht; das Original hatte keine." },
        { nr: "F", ziel: "f-jahr", versatz: [62, 2], regel: "ROBUSTHEIT GEGEN BENUTZUNGSFEHLER", titel: "Jahr geprüft",
          text: "Das Jahr ist auch direkt eingebbar; ungültige Werte werden rot markiert. Plus und Minus bleiben an den Grenzen 2000 und 2099 stehen. Beschriftung „Jahr“ ergänzt." },
        { nr: "G", ziel: "k-zurueck", anker: "links", versatz: [0, 2], regel: "STEUERBARKEIT", titel: "Gleichwertige Knöpfe, Tastatur",
          text: "Blauer Plus- und grauer Minusknopf werden zu gleich gestalteten Knöpfen mit Rahmen, die blaue Auswahl der Walze zu Grau. Alle Elemente sind auch mit Tastatur bedienbar (Tab, Pfeiltasten, Leertaste)." },
        { nr: "H", ziel: "kal-monat", versatz: [-62, 2], regel: "BUCHSTIL – NEUTRAL UND AKTUELL", titel: "Aktuelle Jahre",
          text: "Januar 2010 → Januar 2027, Jahr 2009 → 2026. Die Wochentage bleiben gleich, weil 2027 wie 2010 an einem Freitag beginnt." },
      ],
    },
  });
  MK.fertig();
})();

</script>
