<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launchpad-Startseite im Editiermodus</title>
<style>
/* maskkit.css – softwareneutrale Eingabemasken im Buchstil (6. Auflage)
   Maßstab wie bei den Dashboards: 727 px = 110 mm (Abbildungsbreite), 1024 px = 155 mm; 14 px = 6 pt im Druck.
   Rollen: Eingabefeld weiß mit Rahmen · Anzeigefeld grau ohne Rahmen · Abschnittsband · Gruppenkopf · Knopf. */
:root {
  --ac: #3A3F44;          /* Anthrazit: Kopfleiste, Knopf, Pfeile, Links */
  --text: #1A1A1A;
  --muted: #4D4D4D;
  --rahmen: #9A9A9A;      /* Kontur der Eingabefelder und der Maske */
  --linie: #D9D9D9;       /* Haarlinien */
  --anzeige: #EFEFEF;     /* Anzeigefelder (nicht editierbar) */
  --band: #F6F6F6;        /* Abschnittsband */
  --schlecht: #C62828;    /* nur Fehlermeldungen in der interaktiven Fassung */
  --gut: #00806B;
  --schrift: Arial, "Liberation Sans", Helvetica, sans-serif;
  --zh: 26px;             /* Feldhöhe */
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #ECECEC; color: var(--text); font-family: var(--schrift); }
body.print { background: #FFFFFF; }

/* ---------- Lernplattform-Leiste und Panel (nicht im Druck) ---------- */
.mk-leiste { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: #FFFFFF;
  border-bottom: 1px solid var(--linie); display: flex; align-items: center; gap: 8px; padding: 0 16px;
  font-size: 14px; z-index: 30; }
.mk-leiste .mk-leiste-titel { font-weight: bold; margin-right: auto; }
.mk-leiste button { font: inherit; font-size: 14px; color: var(--text); background: #FFFFFF;
  border: 1px solid var(--rahmen); border-radius: 3px; padding: 6px 12px; cursor: pointer; }
.mk-leiste button[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: #FFFFFF; }
body.print .mk-leiste, body.print .mk-panel, body.print .mk-meldung { display: none !important; }
.mk-buehne { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; overflow: auto; }
body.print .mk-buehne { position: static; overflow: visible; }
.mk-rahmen { margin: 16px auto; box-shadow: 0 1px 3px rgba(0,0,0,.18); background: #FFFFFF; }
body.print .mk-rahmen { margin: 0; box-shadow: none; }
.mk-seite { position: relative; transform-origin: 0 0; background: #FFFFFF; }

.mk-marke { position: absolute; z-index: 20; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px;
  background: var(--ac); color: #FFFFFF; font-size: 13px; font-weight: bold; display: flex; align-items: center;
  justify-content: center; box-shadow: 0 0 0 2px #FFFFFF; cursor: pointer; }
.mk-marke.gestaltung { background: #FFFFFF; color: var(--ac); border: 2px solid var(--ac); }
.mk-marke.aktiv { background: var(--schlecht); color: #FFFFFF; border-color: var(--schlecht); }
.mk-panel { position: fixed; top: 44px; right: 0; bottom: 0; width: 380px; background: #FFFFFF;
  border-left: 1px solid var(--linie); overflow: auto; padding: 16px 18px; font-size: 14px; line-height: 1.4;
  z-index: 25; display: none; }
.mk-panel h2 { font-size: 17px; margin: 0 0 4px; }
.mk-panel .mk-panel-intro { color: var(--muted); margin-bottom: 12px; }
.mk-panel .mk-eintrag { padding: 10px 0; border-top: 1px solid var(--linie); cursor: pointer; }
.mk-panel .mk-eintrag.aktiv { background: var(--band); margin: 0 -18px; padding: 10px 18px; }
.mk-panel .mk-eintrag-kopf { display: flex; gap: 8px; align-items: baseline; font-weight: bold; }
.mk-panel .mk-regel { font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: bold; }
.mk-meldung { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ac); color: #FFFFFF;
  padding: 10px 16px; border-radius: 3px; font-size: 14px; z-index: 40; display: none; }
.mk-markiert { outline: 2px solid var(--schlecht); outline-offset: 2px; }

/* ---------- Maske ---------- */
.mk-maske { position: relative; width: 727px; background: #FFFFFF; border: 1px solid var(--rahmen);
  font-size: 14px; line-height: 18px; color: var(--text); margin: 0; }
.mk-kopf { height: 30px; background: var(--ac); color: #FFFFFF; font-size: 16px; font-weight: bold;
  line-height: 30px; padding: 0 15px; display: flex; justify-content: space-between; }
.mk-kopf .mk-kopf-info { font-weight: normal; font-size: 14px; color: #FFFFFF; }
.mk-inhalt { padding: 14px 15px 16px; }

/* Abschnitt mit Band (in der interaktiven Fassung auf- und zuklappbar) */
.mk-abschnitt + .mk-abschnitt { margin-top: 18px; }
.mk-band { height: 26px; line-height: 26px; background: var(--band); color: var(--ac); font-size: 14px; font-weight: bold;
  text-transform: uppercase; letter-spacing: .02em; padding: 0 8px; margin-bottom: 10px; position: relative; }
.mk-band .mk-klapp { position: absolute; right: 9px; top: 10px; }
body:not(.print) .mk-band { cursor: pointer; user-select: none; }
.mk-abschnitt.zu > :not(.mk-band) { display: none; }
.mk-abschnitt.zu .mk-klapp { transform: rotate(180deg); }

/* Gruppen */
.mk-gruppenkopf { font-weight: bold; height: 24px; line-height: 18px; border-bottom: 1px solid var(--rahmen);
  margin-bottom: 6px; white-space: nowrap; overflow: hidden; }
.mk-gruppe + .mk-gruppe { margin-top: 12px; }

/* Zeilen: Beschriftung + Feld(er); Spaltenbreiten über --sp-label, --sp-feld */
.mk-zeile { display: grid; grid-template-columns: var(--sp-label, 160px) var(--sp-feld, 192px); column-gap: 8px;
  align-items: center; min-height: var(--zh); }
.mk-zeile + .mk-zeile { margin-top: 4px; }
.mk-label { white-space: nowrap; overflow: hidden; }
.mk-label.mk-neben, .mk-neben { color: var(--muted); }
.mk-feldgruppe { display: flex; align-items: center; gap: 0; }
.mk-feldgruppe > .mk-feld { flex: 1 1 0; min-width: 0; }
.mk-feldgruppe > .mk-zwischen { flex: 0 0 auto; padding: 0 6px; color: var(--muted); }
.mk-feld.mk-datum { padding: 0 4px; text-align: center; }

/* Felder: input, select, textarea und deren Druckfassung (div) sehen gleich aus */
.mk-feld { display: block; width: 100%; height: var(--zh); margin: 0; padding: 0 7px; border: 1px solid var(--rahmen);
  border-radius: 2px; background: #FFFFFF; color: var(--text); font: inherit; font-size: 14px; line-height: 24px;
  white-space: nowrap; overflow: hidden; text-overflow: clip; position: relative; text-align: left; }
input.mk-feld, select.mk-feld, textarea.mk-feld { -webkit-appearance: none; appearance: none; outline: none; }
input.mk-feld:focus, select.mk-feld:focus, textarea.mk-feld:focus { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac); }
.mk-feld.mk-zahl { text-align: right; }
.mk-feld.mk-mitte { text-align: center; }
.mk-feld.mk-anzeige { background: var(--anzeige); border-color: var(--anzeige); }
.mk-feld.mk-leer { color: var(--muted); }
.mk-feld.mk-fehler { border-color: var(--schlecht); box-shadow: 0 0 0 1px var(--schlecht); }
select.mk-feld, .mk-feld.mk-auswahl { padding-right: 24px; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><polygon points='0,0 8,0 4,5' fill='%233A3F44'/></svg>");
  background-repeat: no-repeat; background-position: right 9px center; background-size: 8px 5px; }
div.mk-feld.mk-auswahl { background-image: none; }
.mk-feld .mk-pfeil { position: absolute; right: 9px; top: 10px; }
textarea.mk-feld, .mk-feld.mk-mehrzeilig { height: auto; white-space: pre-wrap; line-height: 18px; padding: 6px 8px; resize: none; }

/* Mehrzeiliger Anzeige- bzw. Textbereich (z. B. Brief), Absätze als <p> */
.mk-textbereich { border: 1px solid var(--rahmen); border-radius: 2px; background: #FFFFFF; padding: 8px 10px;
  font-size: 14px; line-height: 18px; overflow: hidden; }
.mk-textbereich.mk-anzeige { background: var(--anzeige); border-color: var(--anzeige); }
.mk-textbereich p { margin: 0 0 8px; }
.mk-textbereich p:last-child { margin-bottom: 0; }

/* Links */
.mk-link, a.mk-link { color: var(--ac); text-decoration: underline; cursor: pointer; }

/* Knöpfe */
.mk-knopf { display: inline-block; height: 30px; padding: 0 16px; border-radius: 3px; border: 1px solid var(--ac);
  background: var(--ac); color: #FFFFFF; font: inherit; font-size: 14px; font-weight: bold; line-height: 28px; cursor: pointer;
  white-space: nowrap; margin: 0; vertical-align: top; }
.mk-knopf.mk-zweit { background: #FFFFFF; color: var(--ac); }
button.mk-knopf { -webkit-appearance: none; appearance: none; }
.mk-knopfleiste { display: flex; gap: 8px; margin-top: 16px; }

/* Kontrollkästchen und Optionsfelder (Druckfassung als SVG) */
.mk-option { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
input.mk-check { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin: 0; border: 1px solid var(--rahmen);
  border-radius: 2px; background: #FFFFFF; position: relative; cursor: pointer; flex: 0 0 auto; }
input.mk-check[type="radio"] { border-radius: 7px; }
input.mk-check:checked { background: var(--ac); border-color: var(--ac); }
input.mk-check[type="checkbox"]:checked::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px;
  border: solid #FFFFFF; border-width: 0 2px 2px 0; transform: rotate(45deg); }
input.mk-check[type="radio"]:checked { background: #FFFFFF; }
input.mk-check[type="radio"]:checked::after { content: ""; position: absolute; left: 3px; top: 3px; width: 6px; height: 6px;
  border-radius: 3px; background: var(--ac); }
.mk-check-druck { width: 14px; height: 14px; flex: 0 0 auto; display: block; }

/* Raster / Tabelle mit Eingabezellen */
table.mk-tabelle { border-collapse: separate; border-spacing: 0 4px; margin: -4px 0; }
table.mk-tabelle th { font-weight: normal; color: var(--muted); text-align: left; padding: 0 8px 0 0; height: var(--zh); white-space: nowrap; }
table.mk-tabelle td { padding: 0 8px 0 0; height: var(--zh); white-space: nowrap; }
table.mk-tabelle td:last-child, table.mk-tabelle th:last-child { padding-right: 0; }

/* Reiter */
.mk-reiter { display: flex; gap: 2px; border-bottom: 1px solid var(--ac); margin-bottom: 10px; }
.mk-reiter > * { height: 26px; line-height: 26px; padding: 0 12px; background: var(--anzeige); color: var(--text); white-space: nowrap; }
.mk-reiter > .aktiv { background: var(--ac); color: #FFFFFF; font-weight: bold; }

/* Hilfsklassen für das Raster */
.mk-spalten { display: grid; grid-template-columns: var(--sp-links, 360px) var(--sp-rechts, 315px); column-gap: 20px; align-items: start; }
.mk-nur-interaktiv { }
body.print .mk-nur-interaktiv { display: none !important; }

</style>
</head>
<body>
<!-- Abb. 5.52 „Launchpad-Startseite im Editiermodus“ (softwareneutral nachgebaut).
     Querformat 1024 px = 155 mm (Kachelraster mit fünf Einheiten und Benachrichtigungen rechts); Inhalt 992 px.
     Links die Gruppen (720 px: fünf Kachelspalten zu 136 px, Abstand 10, Innenabstand 10), 20 px Abstand,
     rechts die Benachrichtigungen (252 px). Kacheln schlicht im Buchstil: Titel, ggf. Zahl oder Balken, ohne Icons.
     Kacheln, Benachrichtigungen und Logik erzeugt startseite.js. Titelzeile wie Abb. 3.7/3.179. -->
<style>
  #startseite { width: 1024px; }
  #startseite .mk-kopf { display: block; height: auto; background: none; color: var(--text); padding: 12px 0 10px;
    margin: 0 15px; border-bottom: 1px solid var(--linie); line-height: normal; font-size: 14px; font-weight: normal; }
  #startseite .mk-kopf .kopf-titel { display: block; font-size: 22px; line-height: 26px; font-weight: bold; }
  #startseite .mk-kopf .kopf-unter { display: block; margin-top: 3px; line-height: 18px; color: var(--muted); }
  #startseite .mk-reiter > span { padding: 0 14px; }
  body:not(.print) #startseite .mk-reiter > span { cursor: pointer; }
  #startseite .mk-reiter > span:focus { outline: 2px solid var(--ac); outline-offset: -2px; }
  #startseite .teile { display: grid; grid-template-columns: 720px 252px; column-gap: 20px; align-items: start; }
  #startseite .gruppe { background: var(--band); padding: 10px; }
  #startseite .gruppe + .gruppe { margin-top: 12px; }
  #startseite .g-kopf { height: 24px; line-height: 20px; font-weight: bold; color: var(--ac); margin-bottom: 6px; }
  #startseite .raster { position: relative; display: grid; grid-template-columns: repeat(5, 136px); grid-auto-rows: 124px; gap: 10px; }
  #startseite .kachel { position: relative; background: #FFFFFF; border: 1px solid var(--rahmen); border-radius: 3px; padding: 7px 10px; }
  #startseite .kachel.breit { grid-column: span 2; }
  body:not(.print) #startseite .bearbeiten .kachel:not(.neu) { cursor: grab; touch-action: none; user-select: none; }
  body:not(.print) #startseite .kachel:focus { outline: 2px solid var(--ac); outline-offset: 1px; }
  #startseite .kachel.zieht { opacity: .35; }
  #startseite .k-titel { font-weight: bold; line-height: 18px; }
  #startseite .k-unter { color: var(--muted); line-height: 18px; }
  #startseite .k-text { line-height: 18px; margin-top: 4px; }
  #startseite .k-zahl { position: absolute; right: 10px; bottom: 6px; font-size: 32px; line-height: 36px; color: var(--ac); }
  #startseite .k-einheit { position: absolute; right: 10px; bottom: 42px; color: var(--muted); line-height: 18px; }
  #startseite .k-fuss { position: absolute; left: 10px; bottom: 6px; line-height: 18px; }
  #startseite .balken { display: grid; grid-template-columns: 64px 124px 1fr; row-gap: 0; margin-top: 4px; align-items: center; }
  #startseite .balken > div { height: 16px; line-height: 16px; }
  #startseite .balken .b { height: 10px; background: var(--ac); }
  #startseite .balken .w { text-align: right; }
  #startseite .kachel.neu { border-style: dashed; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ac); font-weight: bold; }
  body:not(.print) #startseite .kachel.neu { cursor: pointer; }
  #startseite .normal .kachel.neu, #startseite .normal .k-fuss { display: none; }
  #startseite .links { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; row-gap: 4px; }
  #startseite .link-kachel { display: flex; align-items: center; justify-content: space-between; height: 26px; padding: 0 10px;
    background: #FFFFFF; border: 1px solid var(--rahmen); border-radius: 3px; }
  #startseite .link-kachel .mk-link.ent { font-size: 14px; }
  #startseite .normal .link-kachel .ent { display: none; }
  #startseite .einfuegen { position: absolute; width: 4px; margin-left: -7px; background: var(--ac); display: none; }
  #startseite .meldungen .mk-gruppenkopf { margin-bottom: 8px; }
  #startseite .nachricht { background: var(--anzeige); padding: 8px 10px; }
  #startseite .nachricht + .nachricht { margin-top: 8px; }
  #startseite .n-titel { font-weight: bold; line-height: 18px; }
  #startseite .n-text { line-height: 18px; margin-top: 4px; }
  #startseite .n-meta { line-height: 18px; margin-top: 4px; color: var(--muted); display: flex; justify-content: space-between; }
  #startseite .fussleiste { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--linie); }
  #startseite .fussleiste .hinweis { flex: 1 1 auto; color: var(--muted); }
  .kachel-geist { position: fixed; z-index: 50; pointer-events: none; background: #FFFFFF; border: 1px dashed #3A3F44; border-radius: 3px;
    padding: 6px 10px; font: bold 14px/18px Arial, "Liberation Sans", sans-serif; color: #1A1A1A; }
</style>
<form class="mk-maske" id="startseite" autocomplete="off" novalidate>
  <div class="mk-kopf" id="kopf"><span class="kopf-titel" id="kopf-titel">Startseite</span><span class="kopf-unter" id="kopf-unter">Editiermodus · Gruppen und Kacheln anordnen, entfernen und hinzufügen</span></div>
  <div class="mk-inhalt">
    <div class="mk-reiter" id="reiter" role="tablist">
      <span class="aktiv" role="tab" data-gruppe="g1">Meine Startseite</span>
      <span role="tab" data-gruppe="nuetzlich">Nützliche Apps</span>
      <span role="tab" data-gruppe="innendienst">Innendienst Vertrieb</span>
    </div>
    <div class="teile bearbeiten" id="teile">
      <div class="gruppen">
        <div class="gruppe" id="g1">
          <div class="g-kopf" id="g1-kopf">Meine Startseite</div>
          <div class="raster" id="raster1"><!-- Kacheln erzeugt startseite.js --></div>
        </div>
        <div class="gruppe" id="g2" aria-label="Link-Kacheln">
          <div class="links" id="raster2"><!-- Link-Kacheln erzeugt startseite.js --></div>
        </div>
      </div>
      <div class="meldungen" id="benachrichtigungen">
        <div class="mk-gruppenkopf">Benachrichtigungen</div>
        <div id="nachrichten"><!-- erzeugt startseite.js --></div>
      </div>
    </div>
    <div class="fussleiste" id="fuss">
      <span class="hinweis" id="modus-hinweis">Kacheln per Drag &amp; Drop verschieben · „Entfernen“ nimmt eine Kachel aus der Gruppe</span>
      <button type="button" class="mk-knopf" id="k-fertig">Fertig</button>
    </div>
  </div>
</form>

<script>
/* maskkit.js – softwareneutrale Eingabemasken im Buchstil (6. Auflage)
   Die Maske ist HTML5 (<form class="mk-maske">) mit den Klassen aus maskkit.css.
   ?print: Druckfassung – Steuerelemente werden zu statischen Elementen gleicher Geometrie, ohne Leiste.
   MK.exportieren() liefert alle Flächen, Linien, Formen und Textzeilen in px für die PowerPoint-Ausgabe. */
const MK = (() => {
  "use strict";
  const Q = new URLSearchParams(location.search);
  const PRINT = Q.has("print");
  if (PRINT) document.body.classList.add("print");
  const NS = "http://www.w3.org/2000/svg";
  const NBSP = String.fromCharCode(0xA0), MINUS = String.fromCharCode(0x2212);

  /* ---------------- DOM/SVG ---------------- */
  function el(tag, attrs = {}, parent, text) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
    }
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function sv(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  // Pfeil nach unten (Auswahlfeld) bzw. oben (Klappband), 8 x 5 px
  function pfeil(cls, oben = false) {
    const s = sv("svg", { width: 8, height: 5, viewBox: "0 0 8 5", class: cls, "aria-hidden": "true" });
    sv("polygon", { points: oben ? "0,5 8,5 4,0" : "0,0 8,0 4,5", fill: "#3A3F44" }, s);
    return s;
  }

  /* ---------------- Zahlen und Datum (deutsches Format) ---------------- */
  const NF = {};
  const nf = nk => NF[nk] || (NF[nk] = new Intl.NumberFormat("de-DE", { minimumFractionDigits: nk, maximumFractionDigits: nk }));
  function zahl(v, nk = 1) { return v == null || isNaN(v) ? "" : (v < 0 ? MINUS : "") + nf(nk).format(Math.abs(v)); }
  function leseZahl(text) {
    const t = String(text).trim().replace(MINUS, "-").replace(/\s/g, "");
    if (!t) return null;
    if (!/^-?(\d{1,3}(\.\d{3})+|\d+)(,\d+)?$/.test(t)) return NaN;
    return parseFloat(t.replace(/\./g, "").replace(",", "."));
  }
  function leseDatum(text) {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(text).trim());
    if (!m) return null;
    const d = new Date(+m[3], +m[2] - 1, +m[1]);
    return d.getMonth() === +m[2] - 1 ? d : null;
  }
  function datum(d) { return d ? String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear() : ""; }
  // Eingabe prüfen und markieren; liefert den Wert oder null
  function pruefeFeld(feld, art = "zahl", opt = {}) {
    const t = feld.value;
    let v = null, ok = true;
    if (art === "zahl") {
      v = leseZahl(t);
      ok = v === null ? !opt.pflicht : !isNaN(v) && (opt.min == null || v >= opt.min) && (opt.max == null || v <= opt.max);
    } else if (art === "datum") {
      v = leseDatum(t);
      ok = t.trim() === "" ? !opt.pflicht : v !== null;
    }
    feld.classList.toggle("mk-fehler", !ok);
    feld.title = ok ? (feld.dataset.hilfe || "") : (opt.meldung || "Eingabe prüfen");
    return ok ? v : null;
  }

  /* ---------------- Seite, Skalierung, Leiste ---------------- */
  let seite, rahmen, buehne, panel, maske, meldungEl, leiste, B = 727, H = 0;
  function init(o = {}) {
    document.title = o.titel || document.title;
    maske = document.querySelector(o.maske || ".mk-maske");
    if (!maske) throw new Error("Keine .mk-maske gefunden");
    if (!PRINT) {
      leiste = el("div", { class: "mk-leiste" }, document.body);
      el("div", { class: "mk-leiste-titel" }, leiste, o.titel || "");
    }
    buehne = el("div", { class: "mk-buehne" }, document.body);
    rahmen = el("div", { class: "mk-rahmen" }, buehne);
    seite = el("div", { class: "mk-seite", id: "seite" }, rahmen);
    seite.appendChild(maske);
    panel = el("div", { class: "mk-panel" }, document.body);

  /* ---------------- Druckfassung: Steuerelemente -> statische Elemente ---------------- */
  let fertigGemeldet = false;

  /* ---------------- Ebenen der Lernplattform: Erläuterungen und Gestaltung ---------------- */
  function zielElement(z) { return !z ? null : document.getElementById(z) || maske.querySelector(z); }
  function ebenen(o) {

    arten.forEach(([k, text]) => {
      const b = el("button", { type: "button", "aria-pressed": "false" }, leiste, text);

    });
    function markenWeg() { marken.forEach(m => m.remove()); marken.length = 0; maske.querySelectorAll(".mk-markiert").forEach(e => e.classList.remove("mk-markiert")); }
    function markeSetzen(eintrag, text, cls) {
      const z = zielElement(eintrag.ziel);

    function aktiv(text, eintrag) {
      panel.querySelectorAll(".mk-eintrag").forEach(e => e.classList.toggle("aktiv", e.dataset.marke === text));
      marken.forEach(m => m.classList.toggle("aktiv", m.textContent === text));
      maske.querySelectorAll(".mk-markiert").forEach(e => e.classList.remove("mk-markiert"));
      const z = eintrag && zielElement(eintrag.ziel);

      el("h2", {}, panel, def.titel || (modus === "gestaltung" ? "Gestaltung" : "Erläuterungen"));
      if (def.intro) el("div", { class: "mk-panel-intro" }, panel, def.intro);
      def.eintraege.forEach(r => {
        const nr = String(r.nr);
        const e = el("div", { class: "mk-eintrag", "data-marke": nr }, panel);
        const kopf = el("div", { class: "mk-eintrag-kopf" }, e);

        if (r.regel) el("div", { class: "mk-regel" }, e, r.regel);

        e.addEventListener("click", () => aktiv(nr, r));

  /* ---------------- Export für PowerPoint (Druckfassung) ---------------- */
  function farbe(c) {

    if (!m) return null;

  function exportieren() {
    const R = maske.getBoundingClientRect();
    const formen = [];
    const name = e => e.id || e.dataset.name || (e.className && typeof e.className === "string" ? e.className.split(" ")[0] : e.tagName);
    const sichtbar = s => s.w > 0 && s.st !== "none" && s.st !== "hidden" && s.c && s.c.a > 0;
    function kasten(e, cs) {

      const x = r.left - R.left, y = r.top - R.top, rad = parseFloat(cs.borderTopLeftRadius) || 0;

      }

        if (!sichtbar(s)) return;

        formen.push({ t: "linie", name: name(e), x1: p[0], y1: p[1], x2: p[2], y2: p[3], farbe: s.c.hex, lw: s.w, dash: s.st === "dashed" });

        const f = farbe(cs.fill), s = farbe(cs.stroke), lw = parseFloat(cs.strokeWidth) || 0;
        const fill = f && f.a > 0.01 ? f.hex : null, line = s && s.a > 0.01 && lw > 0 ? s.hex : null;
        const tag = k.tagName.toLowerCase();

          const pts = [...k.points].map(p => pt(p.x, p.y));
          formen.push({ t: "poly", name: "Form", pts, zu: tag === "polygon", fill: tag === "polygon" ? fill : null, line, lw });
        } else if (tag === "rect") {
          const x = +k.getAttribute("x") || 0, y = +k.getAttribute("y") || 0, w = +k.getAttribute("width"), h = +k.getAttribute("height");
          const a = pt(x, y), b = pt(x + w, y + h);
          formen.push({ t: "rect", name: "Form", x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1], fill, line, lw, r: +k.getAttribute("rx") || 0 });
        } else if (tag === "circle") {
          const cx = +k.getAttribute("cx"), cy = +k.getAttribute("cy"), r = +k.getAttribute("r");
          const a = pt(cx - r, cy - r), b = pt(cx + r, cy + r);
          formen.push({ t: "oval", name: "Form", x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1], fill, line, lw });
        } else if (tag === "line") {
          const a = pt(+k.getAttribute("x1"), +k.getAttribute("y1")), b = pt(+k.getAttribute("x2"), +k.getAttribute("y2"));
          formen.push({ t: "linie", name: "Linie", x1: a[0], y1: a[1], x2: b[0], y2: b[1], farbe: line, lw });
        }

    }

      const t = n.textContent;
      if (!t.trim()) return;
      const p = n.parentElement, cs = getComputedStyle(p);
      const woerter = [], re = /[^\s]+/g;

      while ((m = re.exec(t))) {

        const rs = [...rg.getClientRects()].filter(r => r.width > 0);
        if (rs.length) woerter.push({ a: m.index, b: m.index + m[0].length, r: rs[0] });
      }
      if (!woerter.length) return;
      const zeilen = [];
      woerter.forEach(w => {
        const z = zeilen[zeilen.length - 1];
        if (z && Math.abs(z.top - w.r.top) < 2) { z.b = w.b; z.right = Math.max(z.right, w.r.right); z.bottom = Math.max(z.bottom, w.r.bottom); }
        else zeilen.push({ a: w.a, b: w.b, left: w.r.left, right: w.r.right, top: w.r.top, bottom: w.r.bottom });

        kursiv: cs.fontStyle === "italic", farbe: (farbe(cs.color) || { hex: "1A1A1A" }).hex, unter,
        ausr: { right: "r", end: "r", center: "c" }[cs.textAlign] || "l",
        sperr: parseFloat(cs.letterSpacing) || 0,

    }
    gehe(maske);

  /* ---------------- Prüfungen (Druckfassung) ---------------- */

  function pruefen() {
    const R = maske.getBoundingClientRect(), probleme = [];
    const kurz = s => s.trim().replace(/\s+/g, " ").slice(0, 40);
    maske.querySelectorAll("*").forEach(e => {
      const cs = getComputedStyle(e);
      if (cs.display === "none" || e.closest("svg")) return;
      const r = e.getBoundingClientRect();

        probleme.push(`Überlauf aus der Maske: ${e.className || e.tagName} „${kurz(e.textContent)}“`);
      if (e.textContent.trim() && (cs.overflow === "hidden" || cs.overflowX === "hidden") &&
          (e.scrollWidth > e.clientWidth + 1 || e.scrollHeight > e.clientHeight + 1))

    const tw = document.createTreeWalker(maske, NodeFilter.SHOW_TEXT);

    while ((n = tw.nextNode())) {

      let a = p, bg = null;
      while (a && !bg) { const f = farbe(getComputedStyle(a).backgroundColor); if (f && f.a > 0.5) bg = f.hex; a = a.parentElement; }

})();

    G2.forEach(k => {
      const d = el("div", { class: "link-kachel", id: k.id }, r2);
      fokusbar(d);
      el("a", { class: "mk-link" }, d, k.titel);
      entfernenLink(d, k, G2);
      if (!PRINT) {
        ziehbar(d, k, G2, r2);
        d.addEventListener("keydown", e => tasten(e, k, G2));
        d.addEventListener("click", () => { if (!bearbeiten) MK.meldung(`Link „${k.titel}“ öffnen – in der Beispielmaske nicht hinterlegt.`); });
      }
    });
    const n = $("nachrichten");
    n.textContent = "";
    if (!NACHRICHTEN.length) el("div", { class: "nachricht" }, n, "Keine Benachrichtigungen.");
    NACHRICHTEN.forEach(m => {
      const d = el("div", { class: "nachricht", id: m.id }, n);
      el("div", { class: "n-titel" }, d, m.titel);
      if (m.text) el("div", { class: "n-text" }, d, m.text);
      el("div", { class: "n-meta" }, d, m.meta);
      const z = el("div", { class: "n-meta" }, d);
      el("span", {}, z, m.prio || "");
      const a = el("a", { class: "mk-link", role: "button" }, z, "Ausblenden");
      fokusbar(a);
      if (!PRINT) {
        const weg = e => { e.preventDefault(); NACHRICHTEN = NACHRICHTEN.filter(x => x !== m); zeichnen(); MK.meldung("Benachrichtigung ausgeblendet."); };
        a.addEventListener("click", weg);
        a.addEventListener("keydown", e => { if (e.key === "Enter") weg(e); });
      }
    });
    if (MK._ebenenNeu) MK._ebenenNeu();
  }

  /* ---------- Entfernen, hinzufügen, verschieben ---------- */
  function entfernen(k, gruppe) {
    if (!bearbeiten) return;
    const i = gruppe.indexOf(k);
    if (i < 0) return;
    gruppe.splice(i, 1);
    entfernt.push([k, gruppe]);
    zeichnen();
    MK.meldung(`„${k.titel}“ entfernt – „Kachel hinzufügen“ nimmt sie wieder auf.`);
  }
  function hinzufuegen() {
    if (!bearbeiten) return;
    let k, g;
    if (entfernt.length) [k, g] = entfernt.pop();
    else if (KATALOG.length) { k = KATALOG.shift(); g = G1; }
    else { MK.meldung("Alle Apps des Katalogs sind bereits auf der Startseite."); return; }
    g.push(k);
    zeichnen();
    MK.meldung(`„${k.titel}“ ${g === G1 ? "als Kachel" : "als Link"} hinzugefügt.`);
    const d = $(k.id); if (d) d.focus();
  }
  function verschieben(gruppe, k, ziel) {
    const i = gruppe.indexOf(k);
    gruppe.splice(i, 1);
    gruppe.splice(Math.max(0, Math.min(ziel > i ? ziel - 1 : ziel, gruppe.length)), 0, k);
    zeichnen();
  }
  function tasten(e, k, gruppe) {
    if (!bearbeiten || e.target !== e.currentTarget) return;
    const i = gruppe.indexOf(k);
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const z = e.key === "ArrowLeft" ? i - 1 : i + 2;
      if (z < 0 || z > gruppe.length) return;
      verschieben(gruppe, k, z);
      $(k.id).focus();
      MK.meldung(`„${k.titel}“ an Position ${gruppe.indexOf(k) + 1} verschoben.`);
    } else if (e.key === "Delete") { e.preventDefault(); entfernen(k, gruppe); }
  }
  function ziehbar(d, k, gruppe, raster) {
    d.addEventListener("pointerdown", e => {
      if (!bearbeiten || e.button !== 0) return;
      e.preventDefault();
      const x0 = e.clientX, y0 = e.clientY;
      let geist = null, ziel = null;
      const andere = () => gruppe.filter(x => x !== k).map(x => $(x.id));
      const bewegen = ev => {
        if (!geist && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 5) return;
        const sk = $("seite").getBoundingClientRect().width / $("startseite").offsetWidth;
        if (!geist) {
          geist = el("div", { class: "kachel-geist" }, document.body, k.titel);
          geist.style.fontSize = 14 * sk + "px"; geist.style.lineHeight = 18 * sk + "px";
          geist.style.width = d.offsetWidth * sk + "px";
          d.classList.add("zieht");
        }
        geist.style.left = ev.clientX + 10 + "px"; geist.style.top = ev.clientY + 8 + "px";
        // Einfügestelle: vor der Kachel, über deren linker Hälfte der Zeiger steht, sonst dahinter
        ziel = null;
        const kand = andere();
        const R = raster.getBoundingClientRect();
        if (ev.clientX >= R.left - 20 && ev.clientX <= R.right + 20 && ev.clientY >= R.top - 20 && ev.clientY <= R.bottom + 20) {
          let best = null, dist = Infinity;
          kand.forEach(t => {
            const r = t.getBoundingClientRect();
            const dx = Math.max(r.left - ev.clientX, 0, ev.clientX - r.right), dy = Math.max(r.top - ev.clientY, 0, ev.clientY - r.bottom);
            const dd = Math.hypot(dx, dy);
            if (dd < dist) { dist = dd; best = [t, r]; }
          });
          if (best) {
            const [t, r] = best, vor = ev.clientX < r.left + r.width / 2;
            const idx = gruppe.findIndex(x => x.id === t.id) + (vor ? 0 : 1);
            ziel = idx;
            if (raster === r1) {
              const rr = r1.getBoundingClientRect();
              marke.style.display = "block";
              marke.style.left = ((vor ? r.left : r.right + 10 * sk) - rr.left) / sk + "px";
              marke.style.top = (r.top - rr.top) / sk + "px";
              marke.style.height = r.height / sk + "px";
            }
          }
        }
        if (ziel === null) marke.style.display = "none";
      };
      const ende = () => {
        removeEventListener("pointermove", bewegen); removeEventListener("pointerup", ende); removeEventListener("pointercancel", ende);
        marke.style.display = "none";
        if (!geist) return;
        geist.remove(); d.classList.remove("zieht");
        if (ziel !== null) {
          verschieben(gruppe, k, ziel);
          MK.meldung(`„${k.titel}“ an Position ${gruppe.indexOf(k) + 1} verschoben.`);
        }
      };
      addEventListener("pointermove", bewegen); addEventListener("pointerup", ende); addEventListener("pointercancel", ende);
    });
  }

  /* ---------- Modus, Reiter ---------- */
  function modus() {
    $("teile").classList.toggle("bearbeiten", bearbeiten);
    $("teile").classList.toggle("normal", !bearbeiten);
    $("k-fertig").textContent = bearbeiten ? "Fertig" : "Bearbeiten";
    $("kopf-unter").textContent = bearbeiten ? "Editiermodus · Gruppen und Kacheln anordnen, entfernen und hinzufügen" : "Startseite · Apps per Klick auf die Kachel öffnen";
    $("modus-hinweis").textContent = bearbeiten ? "Kacheln per Drag & Drop verschieben · „Entfernen“ nimmt eine Kachel aus der Gruppe"
      : "„Bearbeiten“ öffnet den Editiermodus";
    if (MK._ebenenNeu) MK._ebenenNeu();
  }
  $("k-fertig").addEventListener("click", () => {
    bearbeiten = !bearbeiten; modus();
    MK.meldung(bearbeiten ? "Editiermodus: Kacheln verschieben, entfernen oder hinzufügen." : `Änderungen gespeichert – ${G1.length} Kacheln und ${G2.length} Links auf der Startseite.`);
  });
  document.querySelectorAll("#reiter > span").forEach(s => {
    fokusbar(s);
    if (PRINT) return;
    const w = () => {
      document.querySelectorAll("#reiter > span").forEach(x => x.classList.toggle("aktiv", x === s));
      MK.meldung(s.dataset.gruppe === "g1" ? "Gruppe „Meine Startseite“." : `Reiter springt zur Gruppe „${s.textContent}“ – in der Beispielmaske ist nur „Meine Startseite“ ausgeführt.`);
    };
    s.addEventListener("click", w);
    s.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); w(); } });
  });
  zeichnen();
  modus();

  /* ---------- Lernplattform: Erläuterungen und Gestaltung ---------- */
  MK.ebenen({
    erlaeuterungen: {
      titel: "Erläuterungen",
      intro: "Wie Anwender ihre rollenbasierte Startseite selbst zusammenstellen. Verschieben Sie Kacheln per Drag & Drop, entfernen und ergänzen Sie Kacheln und beenden Sie den Editiermodus mit „Fertig“.",
      eintraege: [
        { nr: 1, ziel: "reiter", versatz: [-6, 2], titel: "Gruppen als Reiter",
          text: "Die Startseite ist in Gruppen gegliedert, z. B. „Meine Startseite“, „Nützliche Apps“ und eine Gruppe je Rolle wie „Innendienst Vertrieb“. Ein Reiter springt zur Gruppe." },
        { nr: 2, ziel: "g1-kopf", versatz: [-4, 0], titel: "Persönliche Gruppe",
          text: "Jede Kachel startet eine App. Welche Apps jemand sieht, hängt von seiner Rolle ab; innerhalb dieses Rahmens stellt er seine Startseite selbst zusammen – Self-Service statt fester Menüs." },
        { nr: 3, ziel: "k-teamkalender", versatz: [-4, 2], titel: "Kacheln mit Kennzahl",
          text: "Dynamische Kacheln zeigen eine aktuelle Zahl, etwa 35 offene Reiseanträge oder einen Termin heute. So erkennt man ohne Öffnen der App, wo etwas zu tun ist." },
        { nr: 4, ziel: "k-umsatz", versatz: [-4, 2], titel: "Diagramm- und Nachrichtenkacheln",
          text: "Breite Kacheln zeigen ein kleines Diagramm (Jahresumsätze je Region) oder eine Nachricht. Sie sind der Einstieg in die Analyse – Details liefert die App dahinter." },
        { nr: 5, ziel: "k-kunden", versatz: [-4, 2], titel: "Editiermodus: verschieben und entfernen",
          text: "Im Editiermodus lassen sich Kacheln per Drag & Drop (oder mit den Pfeiltasten) umordnen; „Entfernen“ nimmt eine Kachel aus der Gruppe, „Kachel hinzufügen“ holt Apps aus dem Katalog." },
        { nr: 6, ziel: "g2", versatz: [-4, -12], titel: "Link-Kacheln",
          text: "Eine zweite Gruppe enthält Apps als schlichte Links. Sie belegen weniger Platz und eignen sich für selten genutzte Anwendungen." },
        { nr: 7, ziel: "benachrichtigungen", versatz: [-4, 2], titel: "Benachrichtigungen",
          text: "Rechts stehen Meldungen aus den Prozessen, etwa geänderte Ansprechpartner oder Urlaubsanträge zur Genehmigung – mit Absender, Zeitpunkt und Priorität." },
        { nr: 8, ziel: "k-fertig", versatz: [-6, -12], titel: "Fertig",
          text: "„Fertig“ speichert die Anordnung und wechselt in die normale Ansicht; dann öffnet ein Klick auf eine Kachel die App. „Bearbeiten“ führt zurück in den Editiermodus." },
      ],
    },
    gestaltung: {
      titel: "Gestaltung",
      intro: "Was gegenüber dem Original geändert wurde – softwareneutral im Buchstil und nach den Interaktionsprinzipien der DIN EN ISO 9241-110.",
      eintraege: [
        { nr: "A", ziel: "kopf-titel", versatz: [-4, 4], regel: "BUCHSTIL – SOFTWARENEUTRAL", titel: "Keine Kopfleiste der Software",
          text: "Profilfoto, Logo, Such-, Benachrichtigungs- und Menüsymbole sowie der Hintergrund mit Farbverlauf entfallen; „Home“ ist die Titelzeile „Startseite“. Alle Texte sind übersetzt." },
        { nr: "B", ziel: "k-produkte", versatz: [-4, 2], regel: "BUCHSTIL – SOFTWARENEUTRAL", titel: "Kacheln ohne Icons",
          text: "Die blassen Symbole in den Kacheln (Person, Würfel, Kalender) entfallen; jede Kachel trägt ihren Titel und gegebenenfalls eine Zahl. Das Foto mit Abspielknopf der Nachrichtenkachel entfällt, die Schlagzeile bleibt." },
        { nr: "C", ziel: "k-umsatz", versatz: [-4, 2], regel: "BUCHSTIL – NEUTRAL UND AKTUELL", titel: "Balken ohne Ampelfarben",
          text: "Die grünen, roten und gelben Balken trugen keine Bedeutung und sind einheitlich anthrazit; „234M“ heißt „234 Mio.“, der Untertitel nennt die Einheit." },
        { nr: "D", ziel: "k-reise", versatz: [-4, 2], regel: "SELBSTBESCHREIBUNGSFÄHIGKEIT", titel: "Zahl mit Bedeutung",
          text: "Die Zahlen der Kacheln tragen jetzt ein Wort: „35 offen“, „1 heute“. Im Original standen 35 und 1 ohne Erläuterung." },
        { nr: "E", ziel: "k-kunden", versatz: [-4, 2], regel: "SELBSTBESCHREIBUNGSFÄHIGKEIT", titel: "Text statt Symbol",
          text: "Das Kreuz an jeder Kachel heißt „Entfernen“, das Plus „Kachel hinzufügen“; die Schaltfläche „…“ entfällt. So ist jede Aktion ohne Vorwissen verständlich." },
        { nr: "F", ziel: "n-1", versatz: [-4, -16], regel: "BUCHSTIL – NEUTRAL UND AKTUELL", titel: "Benachrichtigungen ohne Farbcode",
          text: "Die roten und grünen Randstreifen werden zu „Hohe Priorität“, Personenfotos entfallen; Blindtext und der Name aus der Vorlage sind durch fiktive Angaben (Frau Brandt, Herr Tal) ersetzt." },
        { nr: "G", ziel: "reiter", versatz: [-6, 2], regel: "ERWARTUNGSKONFORMITÄT", titel: "Reiter im Buchstil",
          text: "Der aktive Reiter ist anthrazit hinterlegt wie in den übrigen Masken; das Original unterstrich ihn nur blau." },
        { nr: "H", ziel: "k-fertig", versatz: [-6, -12], regel: "STEUERBARKEIT", titel: "Modus jederzeit wechseln",
          text: "„Fertig“ und „Bearbeiten“ wechseln zwischen Editier- und Normalansicht; Kacheln lassen sich ziehen oder mit Tabulator und Pfeiltasten verschieben, Entf entfernt sie, „Kachel hinzufügen“ macht das rückgängig." },
      ],
    },
  });
  MK.fertig();
})();
