     Organigramme: Knoten 156 px breit, absolut gesetzt; Verbindungslinien als SVG (werden mit exportiert). -->
<style>

  #topdown .mass-summe { margin-top: 4px; }

  #topdown .mass-link { display: block; height: 18px; margin-top: 6px; width: max-content; }
  #topdown .baum { position: relative; margin-top: 16px; }
  #topdown .baum > svg { position: absolute; left: 0; top: 0; }
  #topdown .knoten { position: absolute; width: 156px; border: 1px solid var(--rahmen); border-radius: 2px;
    padding: 5px 6px 6px; background: #FFFFFF; }
  #topdown .knoten > .mk-label { display: block; height: 18px; margin-bottom: 4px; font-weight: bold; }
  #topdown .kz { display: grid; grid-template-columns: 62px 74px; column-gap: 6px; align-items: center; }
  #topdown .kz + .kz { margin-top: 4px; }
</style>
