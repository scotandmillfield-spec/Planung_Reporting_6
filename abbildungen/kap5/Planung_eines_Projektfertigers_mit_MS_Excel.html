<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektplanung</title>
<style>
/* maskkit.css – softwareneutrale Eingabemasken im Buchstil (6. Auflage)
   Maßstab wie bei den Dashboards: 727 px = 110 mm (Abbildungsbreite), 1024 px = 155 mm; 14 px = 6 pt im Druck.
   Rollen: Eingabefeld weiß mit Rahmen · Anzeigefeld grau ohne Rahmen · Abschnittsband · Gruppenkopf · Knopf. */
:root {
  --ac: #3A3F44;          /* Anthrazit: Kopfleiste, Knopf, Pfeile, Links */
  --text: #1A1A1A;
  --muted: #4D4D4D;
  --rahmen: #9A9A9A;      /* Kontur der Eingabefelder und der Maske */
  --linie: #D9D9D9;       /* Haarlinien */
  --anzeige: #EFEFEF;     /* Anzeigefelder (nicht editierbar) */
  --band: #F6F6F6;        /* Abschnittsband */
  --schlecht: #C62828;    /* nur Fehlermeldungen in der interaktiven Fassung */
  --gut: #00806B;
  --schrift: Arial, "Liberation Sans", Helvetica, sans-serif;
  --zh: 26px;             /* Feldhöhe */
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #ECECEC; color: var(--text); font-family: var(--schrift); }
body.print { background: #FFFFFF; }

/* ---------- Lernplattform-Leiste und Panel (nicht im Druck) ---------- */
.mk-leiste { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: #FFFFFF;
  border-bottom: 1px solid var(--linie); display: flex; align-items: center; gap: 8px; padding: 0 16px;
  font-size: 14px; z-index: 30; }
.mk-leiste .mk-leiste-titel { font-weight: bold; margin-right: auto; }
.mk-leiste button { font: inherit; font-size: 14px; color: var(--text); background: #FFFFFF;
  border: 1px solid var(--rahmen); border-radius: 3px; padding: 6px 12px; cursor: pointer; }
.mk-leiste button[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: #FFFFFF; }
body.print .mk-leiste, body.print .mk-panel, body.print .mk-meldung { display: none !important; }
.mk-buehne { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; overflow: auto; }
body.print .mk-buehne { position: static; overflow: visible; }
.mk-rahmen { margin: 16px auto; box-shadow: 0 1px 3px rgba(0,0,0,.18); background: #FFFFFF; }
body.print .mk-rahmen { margin: 0; box-shadow: none; }
.mk-seite { position: relative; transform-origin: 0 0; background: #FFFFFF; }

.mk-marke { position: absolute; z-index: 20; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px;
  background: var(--ac); color: #FFFFFF; font-size: 13px; font-weight: bold; display: flex; align-items: center;
  justify-content: center; box-shadow: 0 0 0 2px #FFFFFF; cursor: pointer; }
.mk-marke.gestaltung { background: #FFFFFF; color: var(--ac); border: 2px solid var(--ac); }
.mk-marke.aktiv { background: var(--schlecht); color: #FFFFFF; border-color: var(--schlecht); }
.mk-panel { position: fixed; top: 44px; right: 0; bottom: 0; width: 380px; background: #FFFFFF;
  border-left: 1px solid var(--linie); overflow: auto; padding: 16px 18px; font-size: 14px; line-height: 1.4;
  z-index: 25; display: none; }
.mk-panel h2 { font-size: 17px; margin: 0 0 4px; }
.mk-panel .mk-panel-intro { color: var(--muted); margin-bottom: 12px; }
.mk-panel .mk-eintrag { padding: 10px 0; border-top: 1px solid var(--linie); cursor: pointer; }
.mk-panel .mk-eintrag.aktiv { background: var(--band); margin: 0 -18px; padding: 10px 18px; }
.mk-panel .mk-eintrag-kopf { display: flex; gap: 8px; align-items: baseline; font-weight: bold; }
.mk-panel .mk-regel { font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: bold; }
.mk-meldung { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ac); color: #FFFFFF;
  padding: 10px 16px; border-radius: 3px; font-size: 14px; z-index: 40; display: none; }
.mk-markiert { outline: 2px solid var(--schlecht); outline-offset: 2px; }

/* ---------- Maske ---------- */
.mk-maske { position: relative; width: 727px; background: #FFFFFF; border: 1px solid var(--rahmen);
  font-size: 14px; line-height: 18px; color: var(--text); margin: 0; }
.mk-kopf { height: 30px; background: var(--ac); color: #FFFFFF; font-size: 16px; font-weight: bold;
  line-height: 30px; padding: 0 15px; display: flex; justify-content: space-between; }
.mk-kopf .mk-kopf-info { font-weight: normal; font-size: 14px; color: #FFFFFF; }
.mk-inhalt { padding: 14px 15px 16px; }

/* Abschnitt mit Band (in der interaktiven Fassung auf- und zuklappbar) */
.mk-abschnitt + .mk-abschnitt { margin-top: 18px; }
.mk-band { height: 26px; line-height: 26px; background: var(--band); color: var(--ac); font-size: 14px; font-weight: bold;
  text-transform: uppercase; letter-spacing: .02em; padding: 0 8px; margin-bottom: 10px; position: relative; }
.mk-band .mk-klapp { position: absolute; right: 9px; top: 10px; }
body:not(.print) .mk-band { cursor: pointer; user-select: none; }
.mk-abschnitt.zu > :not(.mk-band) { display: none; }
.mk-abschnitt.zu .mk-klapp { transform: rotate(180deg); }

/* Gruppen */
.mk-gruppenkopf { font-weight: bold; height: 24px; line-height: 18px; border-bottom: 1px solid var(--rahmen);
  margin-bottom: 6px; white-space: nowrap; overflow: hidden; }
.mk-gruppe + .mk-gruppe { margin-top: 12px; }

/* Zeilen: Beschriftung + Feld(er); Spaltenbreiten über --sp-label, --sp-feld */
.mk-zeile { display: grid; grid-template-columns: var(--sp-label, 160px) var(--sp-feld, 192px); column-gap: 8px;
  align-items: center; min-height: var(--zh); }
.mk-zeile + .mk-zeile { margin-top: 4px; }
.mk-label { white-space: nowrap; overflow: hidden; }
.mk-label.mk-neben, .mk-neben { color: var(--muted); }
.mk-feldgruppe { display: flex; align-items: center; gap: 0; }
.mk-feldgruppe > .mk-feld { flex: 1 1 0; min-width: 0; }
.mk-feldgruppe > .mk-zwischen { flex: 0 0 auto; padding: 0 6px; color: var(--muted); }
.mk-feld.mk-datum { padding: 0 4px; text-align: center; }

/* Felder: input, select, textarea und deren Druckfassung (div) sehen gleich aus */
.mk-feld { display: block; width: 100%; height: var(--zh); margin: 0; padding: 0 7px; border: 1px solid var(--rahmen);
  border-radius: 2px; background: #FFFFFF; color: var(--text); font: inherit; font-size: 14px; line-height: 24px;
  white-space: nowrap; overflow: hidden; text-overflow: clip; position: relative; text-align: left; }
input.mk-feld, select.mk-feld, textarea.mk-feld { -webkit-appearance: none; appearance: none; outline: none; }
input.mk-feld:focus, select.mk-feld:focus, textarea.mk-feld:focus { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac); }
.mk-feld.mk-zahl { text-align: right; }
.mk-feld.mk-mitte { text-align: center; }
.mk-feld.mk-anzeige { background: var(--anzeige); border-color: var(--anzeige); }
.mk-feld.mk-leer { color: var(--muted); }
.mk-feld.mk-fehler { border-color: var(--schlecht); box-shadow: 0 0 0 1px var(--schlecht); }
select.mk-feld, .mk-feld.mk-auswahl { padding-right: 24px; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><polygon points='0,0 8,0 4,5' fill='%233A3F44'/></svg>");
  background-repeat: no-repeat; background-position: right 9px center; background-size: 8px 5px; }
div.mk-feld.mk-auswahl { background-image: none; }
.mk-feld .mk-pfeil { position: absolute; right: 9px; top: 10px; }
textarea.mk-feld, .mk-feld.mk-mehrzeilig { height: auto; white-space: pre-wrap; line-height: 18px; padding: 6px 8px; resize: none; }

/* Mehrzeiliger Anzeige- bzw. Textbereich (z. B. Brief), Absätze als <p> */
.mk-textbereich { border: 1px solid var(--rahmen); border-radius: 2px; background: #FFFFFF; padding: 8px 10px;
  font-size: 14px; line-height: 18px; overflow: hidden; }
.mk-textbereich.mk-anzeige { background: var(--anzeige); border-color: var(--anzeige); }
.mk-textbereich p { margin: 0 0 8px; }
.mk-textbereich p:last-child { margin-bottom: 0; }

/* Links */
.mk-link, a.mk-link { color: var(--ac); text-decoration: underline; cursor: pointer; }

/* Knöpfe */
.mk-knopf { display: inline-block; height: 30px; padding: 0 16px; border-radius: 3px; border: 1px solid var(--ac);
  background: var(--ac); color: #FFFFFF; font: inherit; font-size: 14px; font-weight: bold; line-height: 28px; cursor: pointer;
  white-space: nowrap; margin: 0; vertical-align: top; }
.mk-knopf.mk-zweit { background: #FFFFFF; color: var(--ac); }
button.mk-knopf { -webkit-appearance: none; appearance: none; }
.mk-knopfleiste { display: flex; gap: 8px; margin-top: 16px; }

/* Kontrollkästchen und Optionsfelder (Druckfassung als SVG) */
.mk-option { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
input.mk-check { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin: 0; border: 1px solid var(--rahmen);
  border-radius: 2px; background: #FFFFFF; position: relative; cursor: pointer; flex: 0 0 auto; }
input.mk-check[type="radio"] { border-radius: 7px; }
input.mk-check:checked { background: var(--ac); border-color: var(--ac); }
input.mk-check[type="checkbox"]:checked::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px;
  border: solid #FFFFFF; border-width: 0 2px 2px 0; transform: rotate(45deg); }
input.mk-check[type="radio"]:checked { background: #FFFFFF; }
input.mk-check[type="radio"]:checked::after { content: ""; position: absolute; left: 3px; top: 3px; width: 6px; height: 6px;
  border-radius: 3px; background: var(--ac); }
.mk-check-druck { width: 14px; height: 14px; flex: 0 0 auto; display: block; }

/* Raster / Tabelle mit Eingabezellen */
table.mk-tabelle { border-collapse: separate; border-spacing: 0 4px; margin: -4px 0; }
table.mk-tabelle th { font-weight: normal; color: var(--muted); text-align: left; padding: 0 8px 0 0; height: var(--zh); white-space: nowrap; }
table.mk-tabelle td { padding: 0 8px 0 0; height: var(--zh); white-space: nowrap; }
table.mk-tabelle td:last-child, table.mk-tabelle th:last-child { padding-right: 0; }

/* Reiter */
.mk-reiter { display: flex; gap: 2px; border-bottom: 1px solid var(--ac); margin-bottom: 10px; }
.mk-reiter > * { height: 26px; line-height: 26px; padding: 0 12px; background: var(--anzeige); color: var(--text); white-space: nowrap; }
.mk-reiter > .aktiv { background: var(--ac); color: #FFFFFF; font-weight: bold; }

/* Hilfsklassen für das Raster */
.mk-spalten { display: grid; grid-template-columns: var(--sp-links, 360px) var(--sp-rechts, 315px); column-gap: 20px; align-items: start; }
.mk-nur-interaktiv { }
body.print .mk-nur-interaktiv { display: none !important; }

</style>
</head>
<body>
<!-- Abb. 5.75 „Planung eines Projektfertigers“: Tabellenblatt „Projektplanung“ einer Tabellenkalkulation
     (Produktscreenshot, softwareneutral nachgebaut; Caption nennt das Produkt – Caption ohne Produktnamen fassen).
     Querformat 1024 px = 155 mm; Inhalt 992 px; Höhe ≤ 727 px.
     Raster (Kopfblock und Tabelle): Zeile 192 · Ist 56 · Projektliste 56 · Chancen 60 · nach Chancen 60 ·
     neue Prognose 56 · Rest 56 · bis 30.06. 56 · Rest 56 · GJ 56 · Q1–Q4 je 56 · Folgejahr 64 = 992 px.
     Zellen wie Abb. 3.183: Eingabe weiß mit Gitterlinie, Anzeige grau, Summen fett; Zeilen 18 px, Bänder 20 px.
     Werte in Tsd. € mit einer Nachkommastelle (im Original €), damit 14 Wertspalten in die Breite passen. -->
<style>
  #pp { width: 1024px; }
  /* Titelzeile in einer Zeile (Titel fett, Untertitel grau, Haarlinie) – das Raster braucht die Höhe */
  #pp .mk-kopf { display: flex; align-items: baseline; gap: 14px; height: auto; background: none; color: var(--text);
    padding: 10px 0 8px; margin: 0 15px; border-bottom: 1px solid var(--linie); line-height: normal; font-size: 14px;
    font-weight: normal; justify-content: flex-start; }
  #pp .mk-kopf .kopf-titel { font-size: 22px; line-height: 26px; font-weight: bold; }
  #pp .mk-kopf .kopf-unter { line-height: 18px; color: var(--muted); }
  #pp .mk-inhalt { padding: 10px 15px 12px; }
  /* gemeinsames Spaltenraster */
  #pp .kb, #pp .mx { display: grid; grid-template-columns: 192px 56px 56px 60px 60px repeat(9, 56px) 64px; }
  /* Kopfblock: Projektdaten links, Parameter rechts */
  #pp .kb { row-gap: 3px; margin-bottom: 10px; }
  #pp .kb .mk-label { height: 20px; line-height: 20px; }
  #pp .kb .mk-label.rechts { text-align: right; padding-right: 6px; }
  #pp .kb .mk-feld { height: 20px; line-height: 18px; padding: 0 4px; margin-left: 2px; width: calc(100% - 2px); }
  #pp .kb .mk-feld.mk-zahl { padding: 0 3px 0 2px; }
  #pp .kb .mk-feld.mk-datum { text-align: center; }
  /* Tabelle */
  #pp .mx-k { height: 49px; padding: 0 3px 3px 0; text-align: right; color: var(--muted); border-bottom: 1px solid var(--ac);
    white-space: nowrap; overflow: hidden; line-height: 16px; display: flex; flex-direction: column; justify-content: flex-end; }
  #pp .mx-k.links { text-align: left; }
  #pp .mx-k.eng { padding-right: 1px; }
  #pp .mx-k span { display: block; height: 16px; }
  #pp .mx-l { height: 18px; line-height: 17px; padding: 0 4px 0 0; white-space: nowrap; overflow: hidden; border-bottom: 1px solid #D4D4D4; }
  #pp .mx-l.neben { color: var(--muted); }
  #pp .mx .mk-feld { height: 18px; line-height: 17px; padding: 0 3px 0 2px; border: 0; border-radius: 0;
    border-left: 1px solid #D4D4D4; border-bottom: 1px solid #D4D4D4; background: #FFFFFF; }
  #pp .mx .mk-feld.mk-anzeige { background: var(--anzeige); border-left-color: #FFFFFF; border-bottom-color: #FFFFFF; }
  #pp .mx .mk-feld.mk-fehler, #pp .kb .mk-feld.mk-fehler { border-color: var(--schlecht); box-shadow: inset 0 0 0 1px var(--schlecht); }
  #pp .mx .leer { height: 18px; border-bottom: 1px solid #EFEFEF; }
  #pp .mx .trenn { border-left: 1px solid #9A9A9A !important; }
  #pp .mx .summe { font-weight: bold; }
  #pp .mx .abstand { margin-top: 4px; }
  #pp .mx .pp-band { grid-column: 1 / -1; height: 20px; line-height: 20px; margin: 0; padding: 0 6px; position: relative; }
  #pp .pp-band .mk-link, #pp .pp-band .band-notiz { position: absolute; top: 0; text-transform: none; letter-spacing: 0;
    font-weight: normal; white-space: nowrap; }
  #pp .pp-band .band-notiz { right: 6px; color: var(--muted); }
</style>
<form class="mk-maske" id="pp" autocomplete="off" novalidate>
  <div class="mk-kopf" id="kopf"><span class="kopf-titel" id="kopf-titel">Projektplanung</span><span class="kopf-unter" id="kopf-unter">Niederlassung Mitte · Ist bis 31.03.2027 · Geschäftsjahr 2027/28 (Juli bis Juni) · Werte in Tsd. €</span></div>
  <div class="mk-inhalt">

    <div class="kb" id="kopfblock">
      <label class="mk-label" for="f-nr" style="grid-column:1">Projektnummer, Name</label>
      <input class="mk-feld" id="f-nr" value="1992" style="grid-column:2" data-hilfe="Projektnummer">
      <input class="mk-feld" id="f-name" value="OP-Trakt" style="grid-column:3 / 6" aria-label="Projektbezeichnung" data-hilfe="Projektbezeichnung">
      <label class="mk-label rechts" for="f-deck" style="grid-column:6 / 10">Deckungsbedarf, % Eigenleistung</label>
      <input class="mk-feld mk-zahl" id="f-deck" style="grid-column:10" inputmode="decimal" data-hilfe="Prozentwert mit Dezimalkomma, z. B. 40,00">
      <label class="mk-label rechts" for="f-soz" style="grid-column:11 / 15">Sozialzuschlag, % Lohn</label>
      <input class="mk-feld mk-zahl" id="f-soz" style="grid-column:15" inputmode="decimal" data-hilfe="Zuschlag für Sozial- und Personalnebenkosten in % des produktiven Lohns">

      <label class="mk-label" for="f-beg-plan" style="grid-column:1">Projektbeginn Plan, Prognose</label>
      <input class="mk-feld mk-datum" id="f-beg-plan" value="03/2027" style="grid-column:2 / 4" data-hilfe="Monat MM/JJJJ">
      <input class="mk-feld mk-datum" id="f-beg-prog" value="03/2027" style="grid-column:4 / 6" aria-label="Projektbeginn Prognose" data-hilfe="Monat MM/JJJJ">
      <span class="mk-label rechts" style="grid-column:6 / 10" id="l-vu">Quartalsverteilung Umsatz in %</span>
      <div class="mk-feld mk-anzeige mk-zahl" id="f-vu-sum" style="grid-column:10"></div>
      <!-- Felder f-vu-N … f-vu-Q erzeugt projektplanung.js -->

      <label class="mk-label" for="f-fer-plan" style="grid-column:1">Fertigstellung Plan, Prognose</label>
      <input class="mk-feld mk-datum" id="f-fer-plan" value="09/2028" style="grid-column:2 / 4" data-hilfe="Monat MM/JJJJ">
      <input class="mk-feld mk-datum" id="f-fer-prog" value="09/2028" style="grid-column:4 / 6" aria-label="Fertigstellung Prognose" data-hilfe="Monat MM/JJJJ">
      <span class="mk-label rechts" style="grid-column:6 / 10" id="l-vk">Quartalsverteilung Kosten in %</span>
      <div class="mk-feld mk-anzeige mk-zahl" id="f-vk-sum" style="grid-column:10"></div>
    </div>

    <div class="mx" id="raster"><!-- Spaltenköpfe, Bänder und Zeilen erzeugt projektplanung.js --></div>

  </div>
</form>

<script>
/* maskkit.js – softwareneutrale Eingabemasken im Buchstil (6. Auflage)
   Die Maske ist HTML5 (<form class="mk-maske">) mit den Klassen aus maskkit.css.
   ?print: Druckfassung – Steuerelemente werden zu statischen Elementen gleicher Geometrie, ohne Leiste.
   MK.exportieren() liefert alle Flächen, Linien, Formen und Textzeilen in px für die PowerPoint-Ausgabe. */
const MK = (() => {
  "use strict";
  const Q = new URLSearchParams(location.search);
  const PRINT = Q.has("print");
  if (PRINT) document.body.classList.add("print");
  const NS = "http://www.w3.org/2000/svg";
  const NBSP = String.fromCharCode(0xA0), MINUS = String.fromCharCode(0x2212);

  /* ---------------- DOM/SVG ---------------- */
  function el(tag, attrs = {}, parent, text) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
    }
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function sv(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  // Pfeil nach unten (Auswahlfeld) bzw. oben (Klappband), 8 x 5 px
  function pfeil(cls, oben = false) {
    const s = sv("svg", { width: 8, height: 5, viewBox: "0 0 8 5", class: cls, "aria-hidden": "true" });
    sv("polygon", { points: oben ? "0,5 8,5 4,0" : "0,0 8,0 4,5", fill: "#3A3F44" }, s);
    return s;
  }

  /* ---------------- Zahlen und Datum (deutsches Format) ---------------- */
  const NF = {};
  const nf = nk => NF[nk] || (NF[nk] = new Intl.NumberFormat("de-DE", { minimumFractionDigits: nk, maximumFractionDigits: nk }));
  function zahl(v, nk = 1) { return v == null || isNaN(v) ? "" : (v < 0 ? MINUS : "") + nf(nk).format(Math.abs(v)); }
  function leseZahl(text) {
    const t = String(text).trim().replace(MINUS, "-").replace(/\s/g, "");
    if (!t) return null;
    if (!/^-?(\d{1,3}(\.\d{3})+|\d+)(,\d+)?$/.test(t)) return NaN;
    return parseFloat(t.replace(/\./g, "").replace(",", "."));
  }
  function leseDatum(text) {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(text).trim());
    if (!m) return null;
    const d = new Date(+m[3], +m[2] - 1, +m[1]);
    return d.getMonth() === +m[2] - 1 ? d : null;
  }
  function datum(d) { return d ? String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear() : ""; }
  // Eingabe prüfen und markieren; liefert den Wert oder null
  function pruefeFeld(feld, art = "zahl", opt = {}) {
    const t = feld.value;
    let v = null, ok = true;
    if (art === "zahl") {
      v = leseZahl(t);
      ok = v === null ? !opt.pflicht : !isNaN(v) && (opt.min == null || v >= opt.min) && (opt.max == null || v <= opt.max);
    } else if (art === "datum") {
      v = leseDatum(t);
      ok = t.trim() === "" ? !opt.pflicht : v !== null;
    }
    feld.classList.toggle("mk-fehler", !ok);
    feld.title = ok ? (feld.dataset.hilfe || "") : (opt.meldung || "Eingabe prüfen");
    return ok ? v : null;
  }

  /* ---------------- Seite, Skalierung, Leiste ---------------- */
  let seite, rahmen, buehne, panel, maske, meldungEl, leiste, B = 727, H = 0;
  function init(o = {}) {
    document.title = o.titel || document.title;
    maske = document.querySelector(o.maske || ".mk-maske");
    if (!maske) throw new Error("Keine .mk-maske gefunden");
    if (!PRINT) {
      leiste = el("div", { class: "mk-leiste" }, document.body);
      el("div", { class: "mk-leiste-titel" }, leiste, o.titel || "");
    }
    buehne = el("div", { class: "mk-buehne" }, document.body);
    rahmen = el("div", { class: "mk-rahmen" }, buehne);

    function markenWeg() { marken.forEach(m => m.remove()); marken.length = 0; maske.querySelectorAll(".mk-markiert").forEach(e => e.classList.remove("mk-markiert")); }
    function markeSetzen(eintrag, text, cls) {

  /* ---------------- Export für PowerPoint (Druckfassung) ---------------- */
  function farbe(c) {
    const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/.exec(c || "");
    if (!m) return null;
    const a = m[4] === undefined ? 1 : parseFloat(m[4]);
    const hex = [m[1], m[2], m[3]].map(v => Math.round(+v).toString(16).padStart(2, "0")).join("").toUpperCase();
    return { hex, a };
  }
  function exportieren() {
    const R = maske.getBoundingClientRect();
    const formen = [];
    const name = e => e.id || e.dataset.name || (e.className && typeof e.className === "string" ? e.className.split(" ")[0] : e.tagName);
    const sichtbar = s => s.w > 0 && s.st !== "none" && s.st !== "hidden" && s.c && s.c.a > 0;
    function kasten(e, cs) {
      const r = e.getBoundingClientRect();

      const gleich = seiten.every(s => sichtbar(s) && s.w === seiten[0].w && s.c.hex === seiten[0].c.hex && s.st === seiten[0].st);
      const x = r.left - R.left, y = r.top - R.top, rad = parseFloat(cs.borderTopLeftRadius) || 0;
      const fuell = bg && bg.a > 0.01 ? bg.hex : null;
      if (fuell || gleich) {
        const lw = gleich ? seiten[0].w : 0;
        formen.push({ t: "rect", name: name(e), x: x + lw / 2, y: y + lw / 2, w: r.width - lw, h: r.height - lw,

      }
      if (!gleich) seiten.forEach((s, i) => {
        if (!sichtbar(s)) return;
        const h = s.w / 2;

        formen.push({ t: "linie", name: name(e), x1: p[0], y1: p[1], x2: p[2], y2: p[3], farbe: s.c.hex, lw: s.w, dash: s.st === "dashed" });
      });

        const cs = getComputedStyle(k), M = k.getScreenCTM();
        const pt = (x, y) => { const p = new DOMPoint(x, y).matrixTransform(M); return [p.x - R.left, p.y - R.top]; };
        const f = farbe(cs.fill), s = farbe(cs.stroke), lw = parseFloat(cs.strokeWidth) || 0;
        const fill = f && f.a > 0.01 ? f.hex : null, line = s && s.a > 0.01 && lw > 0 ? s.hex : null;
        const tag = k.tagName.toLowerCase();
        if (tag === "polygon" || tag === "polyline") {
          const pts = [...k.points].map(p => pt(p.x, p.y));
          formen.push({ t: "poly", name: "Form", pts, zu: tag === "polygon", fill: tag === "polygon" ? fill : null, line, lw });
        } else if (tag === "rect") {
          const x = +k.getAttribute("x") || 0, y = +k.getAttribute("y") || 0, w = +k.getAttribute("width"), h = +k.getAttribute("height");
          const a = pt(x, y), b = pt(x + w, y + h);
          formen.push({ t: "rect", name: "Form", x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1], fill, line, lw, r: +k.getAttribute("rx") || 0 });
        } else if (tag === "circle") {
          const cx = +k.getAttribute("cx"), cy = +k.getAttribute("cy"), r = +k.getAttribute("r");
          const a = pt(cx - r, cy - r), b = pt(cx + r, cy + r);
          formen.push({ t: "oval", name: "Form", x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1], fill, line, lw });
        } else if (tag === "line") {
          const a = pt(+k.getAttribute("x1"), +k.getAttribute("y1")), b = pt(+k.getAttribute("x2"), +k.getAttribute("y2"));
          formen.push({ t: "linie", name: "Linie", x1: a[0], y1: a[1], x2: b[0], y2: b[1], farbe: line, lw });
        }
      });
    }
    function text(n) {
      const t = n.textContent;
      if (!t.trim()) return;
      const p = n.parentElement, cs = getComputedStyle(p);
      const woerter = [], re = /[^\s]+/g;
      let m;
      while ((m = re.exec(t))) {
        const rg = document.createRange();
        rg.setStart(n, m.index); rg.setEnd(n, m.index + m[0].length);
        const rs = [...rg.getClientRects()].filter(r => r.width > 0);
        if (rs.length) woerter.push({ a: m.index, b: m.index + m[0].length, r: rs[0] });
      }
      if (!woerter.length) return;
      const zeilen = [];
      woerter.forEach(w => {
        const z = zeilen[zeilen.length - 1];
        if (z && Math.abs(z.top - w.r.top) < 2) { z.b = w.b; z.right = Math.max(z.right, w.r.right); z.bottom = Math.max(z.bottom, w.r.bottom); }
        else zeilen.push({ a: w.a, b: w.b, left: w.r.left, right: w.r.right, top: w.r.top, bottom: w.r.bottom });
      });

        kursiv: cs.fontStyle === "italic", farbe: (farbe(cs.color) || { hex: "1A1A1A" }).hex, unter,
        ausr: { right: "r", end: "r", center: "c" }[cs.textAlign] || "l",
        sperr: parseFloat(cs.letterSpacing) || 0,

    }

  function kontrast(a, b) {

    const L = h => 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16));

  }
  function pruefen() {
    const R = maske.getBoundingClientRect(), probleme = [];
    const kurz = s => s.trim().replace(/\s+/g, " ").slice(0, 40);
    maske.querySelectorAll("*").forEach(e => {
      const cs = getComputedStyle(e);
      if (cs.display === "none" || e.closest("svg")) return;
      const r = e.getBoundingClientRect();
      if (r.width && (r.left < R.left - 0.5 || r.right > R.right + 0.5 || r.bottom > R.bottom + 0.5))
        probleme.push(`Überlauf aus der Maske: ${e.className || e.tagName} „${kurz(e.textContent)}“`);
      if (e.textContent.trim() && (cs.overflow === "hidden" || cs.overflowX === "hidden") &&
          (e.scrollWidth > e.clientWidth + 1 || e.scrollHeight > e.clientHeight + 1))

    });
    const tw = document.createTreeWalker(maske, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = tw.nextNode())) {
      if (!n.textContent.trim()) continue;
      const p = n.parentElement, cs = getComputedStyle(p);
      if (cs.display === "none") continue;
      if (parseFloat(cs.fontSize) < 13.9) probleme.push(`Schrift unter 6 pt (${cs.fontSize}): „${kurz(n.textContent)}“`);
      let a = p, bg = null;
      while (a && !bg) { const f = farbe(getComputedStyle(a).backgroundColor); if (f && f.a > 0.5) bg = f.hex; a = a.parentElement; }
      const fg = farbe(cs.color);
      if (fg && kontrast(fg.hex, bg || "FFFFFF") < 4.5) probleme.push(`Kontrast < 4,5:1: „${kurz(n.textContent)}“`);
    }

  }

  return { PRINT, NBSP, MINUS, el, sv, pfeil, zahl, leseZahl, leseDatum, datum, pruefeFeld, init, fertig, skalieren,
           meldung, ebenen, exportieren, pruefen, druckfassung };
})();

    { id: "gl", label: "Gesamtleistung der Periode", ohne: "C", ein: "I" },

    { id: "bv", label: "Bestandsveränderung", nur: FGP },
    { id: "be", label: "Bestand am Periodenende", nur: FGP },
    { band: "MOR-Schema" },
    { id: "mgl", label: "= Gesamtleistung", nur: MOR, summe: true },
    { id: "mfr", label: MINUS + " Fremdbezogene Leistungen", nur: MOR },
    { id: "mel", label: "= Eigenleistung", nur: MOR, summe: true },
    { id: "mpk", label: MINUS + " Personalkosten", nur: MOR },
    { id: "mdb", label: "= DB Projektergebnis", nur: MOR, summe: true },
    { id: "mde", label: MINUS + " Deckungsbedarf", nur: MOR },
    { id: "mpvk", label: "= Projektvollkostenergebnis", nur: MOR, summe: true },
    { id: "av", label: "Arbeitsvorrat am Ende", nur: "E K M N O P Q", abstand: true },
  ];
  const spalten = z => (z.nur ? z.nur.split(" ") : COLS.filter(c => !(z.ohne || "").split(" ").includes(c)));
  const NAME = { C: "Chancen", I: "neue Prognose", K: "davon bis 30.06.", M: "davon GJ 2027/28", N: "Q1", O: "Q2", P: "Q3", Q: "Q4" };

  /* ---------- Eingabewerte lesen und schreiben ---------- */
  function wert(z, c) {
    if (c === "C") return P.chance[z];
    if (c === "I" || c === "K" || c === "M") return P[c][z];
    return P.Q[z][QS.indexOf(c)];
  }
  function setzen(z, c, v) {
    if (c === "C") P.chance[z] = v;
    else if (c === "I" || c === "K" || c === "M") P[c][z] = v;
    else P.Q[z][QS.indexOf(c)] = v;
  }

  /* ---------- Raster aufbauen ---------- */
  const raster = $("raster");
  const kk = el("div", { class: "mx-k links", id: "kopf-zeile" }, raster);
  ["", "", "Tsd. €"].forEach(t => el("span", {}, kk, t));
  COLS.forEach(c => {
    const k = el("div", { class: "mx-k" + (c === "C" || c === "G" ? " eng" : "") + (TRENN.has(c) ? " trenn" : ""), id: "kopf-" + c }, raster);
    KOPF[c].forEach(t => el("span", {}, k, t));
  });
  const zellen = {};                                  // "zeile-spalte" → Element
  ZEILEN.forEach(z => {
    if (z.band) {
      const b = el("div", { class: "mk-band pp-band", id: "band-" + z.band.split(" ")[0].toLowerCase() }, raster, z.band);
      if (z.link) el("a", { class: "mk-link", id: z.link[0], tabindex: "0", role: "button", style: "left:448px" }, b, z.link[1]);
      if (z.notiz) el("span", { class: "band-notiz", id: "notiz-fg" }, b, z.notiz);
      return;
    }
    const sp = spalten(z), ein = (z.ein || "").split(" ");
    const zus = (z.summe ? " summe" : "") + (z.abstand ? " abstand" : "");
    el("div", { class: "mx-l" + (z.neben ? " neben" : "") + zus, id: "l-" + z.id }, raster, z.label);
    COLS.forEach(c => {
      const tr = TRENN.has(c) ? " trenn" : "";
      let e;
      if (!sp.includes(c)) e = el("div", { class: "leer" + tr + zus, id: `x-${z.id}-${c}` }, raster);
      else if (ein.includes(c)) e = el("input", { class: "mk-feld mk-zahl" + tr + zus, id: `i-${z.id}-${c}`, inputmode: "decimal",
        "aria-label": `${z.label}, ${NAME[c]}`, "data-hilfe": "Betrag in Tsd. € mit Dezimalkomma, z. B. 10,0" }, raster);
      else e = el("div", { class: "mk-feld mk-anzeige mk-zahl" + tr + zus, id: `c-${z.id}-${c}` }, raster);
      zellen[`${z.id}-${c}`] = e;
    });
  });
  // Quartalsverteilung im Kopfblock unter den Quartalsspalten
  [["vu", 2, "vertU", "Umsatz"], ["vk", 3, "vertK", "Kosten"]].forEach(([k, zeile, key, was]) => {
    let vor = $(`f-${k}-sum`).nextSibling;
    QS.forEach((q, i) => {
      const f = el("input", { class: "mk-feld mk-zahl", id: `f-${k}-${q}`, inputmode: "decimal", style: `grid-column:${11 + i};grid-row:${zeile}`,
        "aria-label": `Quartalsverteilung ${was}, Q${i + 1}`, "data-hilfe": "Anteil des Quartals in %, Summe 100,00" });
      $("kopfblock").insertBefore(f, vor);
      f.value = zahl(P[key][i], 2);
    });
  });
  $("f-deck").value = zahl(P.deck, 2);
  $("f-soz").value = zahl(P.soz, 2);

  /* ---------- Rechnen ---------- */
  function rechnen() {
    const R = {}, r = (z, c, v) => { (R[z] = R[z] || {})[c] = v; };
    const soz = P.soz / 100;
    const FREMD = ["mat", "son", "sub"], KOST = ["mat", "son", "sub", "lea", "loh", "soz", "mon"];
    KOST.forEach(z => { r(z, "E", IST[z]); r(z, "F", LISTE[z]); if (z !== "soz") r(z, "C", P.chance[z]); });
    ["mat", "son", "sub", "lea", "loh", "mon"].forEach(z => { r(z, "G", LISTE[z] - P.chance[z]); r(z, "I", P.I[z]); });
    r("soz", "G", IST.soz + soz * (R.loh.G - IST.loh));
    r("soz", "I", IST.soz + soz * (P.I.loh - IST.loh));
    KOST.forEach(z => r(z, "J", R[z].I - IST[z]));
    const satzM = R.loh.J ? R.mon.J / R.loh.J : 0;
    r("msatz", "J", satzM * 100);
    FREMD.forEach(z => { r(z, "K", P.K[z]); r(z, "M", P.M[z]); });
    ["lea", "loh"].forEach(z => { r(z, "K", P.K[z]); r(z, "M", P.Q[z].reduce((a, b) => a + b, 0)); });
    r("soz", "K", soz * R.loh.K); r("mon", "K", satzM * R.loh.K);
    r("soz", "M", soz * R.loh.M); r("mon", "M", satzM * R.loh.M);
    QS.forEach((q, i) => {
      FREMD.forEach(z => r(z, q, P.M[z] * P.vertK[i] / 100));
      ["lea", "loh"].forEach(z => r(z, q, P.Q[z][i]));
      r("soz", q, soz * R.loh[q]); r("mon", q, satzM * R.loh[q]);
    });
    KOST.forEach(z => { r(z, "L", R[z].J - R[z].K); r(z, "S", R[z].L - R[z].M); });
    // Summen und Einzelkosten
    const ALLE = ["E", "F", "G", "I", "J", "K", "L", "M", ...QS, "S"];
    ALLE.forEach(c => {
      r("sumF", c, FREMD.reduce((s, z) => s + R[z][c], 0));
      r("sumP", c, ["lea", "loh", "soz", "mon"].reduce((s, z) => s + R[z][c], 0));
      r("ek", c, R.sumF[c] + R.sumP[c]);
    });
    r("sumF", "C", FREMD.reduce((s, z) => s + P.chance[z], 0));
    r("sumP", "C", ["lea", "loh", "mon"].reduce((s, z) => s + P.chance[z], 0));
    // Fertigstellungsgrad, Gesamtleistung, Umsatz, Bestand
    const EKG = R.ek.I, GLG = P.I.gl, anteil = c => (EKG ? R.ek[c] / EKG : 0);
    let kum = R.ek.E + R.ek.K;
    r("fg", "E", anteil("E") * 100); r("fg", "K", kum / EKG * 100);
    QS.forEach(q => { kum += R.ek[q]; r("fg", q, kum / EKG * 100); });
    r("fg", "M", R.fg.Q); r("fg", "S", (kum + R.ek.S) / EKG * 100);
    PER.forEach(c => r("gl", c, anteil(c) * GLG));
    r("gl", "F", LISTE.gl); r("gl", "G", LISTE.gl); r("gl", "I", GLG);
    r("gl", "J", GLG - R.gl.E); r("gl", "L", R.gl.J - R.gl.K);
    r("um", "E", IST.um); r("um", "J", GLG - IST.um); r("um", "K", P.K.um); r("um", "L", R.um.J - P.K.um);
    r("um", "M", P.M.um); QS.forEach((q, i) => r("um", q, P.M.um * P.vertU[i] / 100)); r("um", "S", R.um.L - P.M.um);
    PER.forEach(c => r("bv", c, R.gl[c] - R.um[c]));
    let best = R.bv.E; r("be", "E", best); best += R.bv.K; r("be", "K", best);
    QS.forEach(q => { best += R.bv[q]; r("be", q, best); });
    r("be", "M", R.be.Q); r("be", "S", best + R.bv.S);
    // MOR-Schema
    MOR.split(" ").forEach(c => {
      r("mgl", c, R.gl[c]); r("mfr", c, R.sumF[c]); r("mel", c, R.gl[c] - R.sumF[c]); r("mpk", c, R.sumP[c]);
      r("mdb", c, R.mel[c] - R.sumP[c]); r("mde", c, P.deck / 100 * R.mel[c]); r("mpvk", c, R.mdb[c] - R.mde[c]);
    });
    // Arbeitsvorrat
    let av = GLG - R.gl.E; r("av", "E", av); av -= R.gl.K; r("av", "K", av);
    QS.forEach(q => { av -= R.gl[q]; r("av", q, av); });
    r("av", "M", R.av.Q);
    return R;
  }
  const fmt = (z, v) => (z.pz ? zahl(v, 2) : zahl(Math.abs(v) < 50 ? 0 : v / 1000, 1));
  function anzeigen() {
    const R = rechnen();
    ZEILEN.forEach(z => {
      if (z.band) return;
      spalten(z).forEach(c => {
        const e = zellen[`${z.id}-${c}`];
        if (e.tagName === "INPUT") { if (!e.classList.contains("mk-fehler") && document.activeElement !== e) e.value = fmt(z, wert(z.id, c)); }
        else e.textContent = R[z.id] && R[z.id][c] != null && isFinite(R[z.id][c]) ? fmt(z, R[z.id][c]) : "–";
      });
    });
    [["vu", "vertU"], ["vk", "vertK"]].forEach(([k, key]) => {
      const s = P[key].reduce((a, b) => a + b, 0), ok = Math.abs(s - 100) < 0.005;
      $(`f-${k}-sum`).textContent = zahl(s, 2);
      $(`f-${k}-sum`).classList.toggle("mk-fehler", !ok);
      $(`f-${k}-sum`).title = ok ? "" : "Die Quartalsanteile müssen zusammen 100,00 % ergeben";
    });
  }

  /* ---------- Eingaben ---------- */
  ZEILEN.forEach(z => (z.ein || "").split(" ").filter(Boolean).forEach(c => {
    const f = zellen[`${z.id}-${c}`];
    f.addEventListener("input", () => {
      const v = pruefeFeld(f, "zahl", { pflicht: true, min: c === "C" ? 0 : -100000, max: 100000,
        meldung: "Betrag in Tsd. € mit Dezimalkomma" + (c === "C" ? ", Chancen ab 0" : "") });
      // Steht wieder die Anzeige vom Betreten des Felds da (Tsd. €, eine Nachkommastelle), gilt der genaue Wert
      if (v !== null) { setzen(z.id, c, f.value.trim() === f._anzeige ? f._exakt : Math.round(v * 1000)); anzeigen(); }
    });
    f.addEventListener("focus", () => { f._exakt = wert(z.id, c); f._anzeige = fmt(z, f._exakt); });
    f.addEventListener("blur", () => { if (!f.classList.contains("mk-fehler")) f.value = fmt(z, wert(z.id, c)); });
  }));
  const prozent = (id, lesen, schreiben, opt) => {
    const f = $(id);
    f.addEventListener("input", () => { const v = pruefeFeld(f, "zahl", opt); if (v !== null) { schreiben(v); anzeigen(); } });
    f.addEventListener("blur", () => { if (!f.classList.contains("mk-fehler")) f.value = zahl(lesen(), 2); });
  };
  prozent("f-deck", () => P.deck, v => { P.deck = v; }, { pflicht: true, min: 0, max: 100, meldung: "Prozentwert zwischen 0 und 100" });
  prozent("f-soz", () => P.soz, v => { P.soz = v; }, { pflicht: true, min: 0, max: 200, meldung: "Prozentwert zwischen 0 und 200" });
  [["vu", "vertU"], ["vk", "vertK"]].forEach(([k, key]) => QS.forEach((q, i) =>
    prozent(`f-${k}-${q}`, () => P[key][i], v => { P[key][i] = v; }, { pflicht: true, min: 0, max: 100, meldung: "Anteil in % zwischen 0 und 100" })));
  // Projektmonate MM/JJJJ, Fertigstellung nicht vor Beginn
  const monat = t => { const m = /^(0[1-9]|1[0-2])\/(\d{4})$/.exec(t.trim()); return m ? +m[2] * 12 + +m[1] : null; };
  function termine() {
    const ids = ["f-beg-plan", "f-beg-prog", "f-fer-plan", "f-fer-prog"], w = ids.map(id => monat($(id).value));
    ids.forEach((id, i) => { const ok = w[i] !== null; $(id).classList.toggle("mk-fehler", !ok); $(id).title = ok ? $(id).dataset.hilfe : "Monat im Format MM/JJJJ"; });
    [[0, 2], [1, 3]].forEach(([b, e]) => {
      if (w[b] !== null && w[e] !== null && w[e] < w[b]) { $(ids[e]).classList.add("mk-fehler"); $(ids[e]).title = "Fertigstellung liegt vor dem Projektbeginn"; }
    });
  }
  ["f-beg-plan", "f-beg-prog", "f-fer-plan", "f-fer-prog"].forEach(id => $(id).addEventListener("input", termine));
  ["f-nr", "f-name"].forEach(id => $(id).addEventListener("input", () => {
    const ok = $(id).value.trim() !== ""; $(id).classList.toggle("mk-fehler", !ok); $(id).title = ok ? $(id).dataset.hilfe : "Pflichtfeld";
  }));
  // Übernahme der Prognose nach Chancen in die neue Prognose (im Original Schaltflächen und Pfeile je Zeile)
  function uebernehmen(zeilen, text) {
    zeilen.forEach(z => { P.I[z] = LISTE[z] - P.chance[z]; const f = zellen[`${z}-I`]; f.classList.remove("mk-fehler"); f.value = fmt({}, P.I[z]); });
    anzeigen(); MK.meldung(text);
  }
  const klick = (id, fn) => { $(id).addEventListener("click", fn); $(id).addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }); };
  klick("l-fremd", () => uebernehmen(["mat", "son", "sub"], "Prognose nach Chancen für Material, sonstige direkte Kosten und Subunternehmer übernommen."));
  klick("l-pers", () => uebernehmen(["lea", "loh"], "Prognose nach Chancen für Leasing und produktiven Lohn übernommen."));
  anzeigen();

  /* ---------- Lernplattform: Erläuterungen und Gestaltung ---------- */
  MK.ebenen({
    erlaeuterungen: {
      titel: "Erläuterungen",
      intro: "Wie ein Projektfertiger ein einzelnes Projekt über seine Laufzeit plant. Weiße Felder lassen sich ändern; das Blatt rechnet bis zum Projektergebnis durch.",
      eintraege: [
        { nr: 1, ziel: "kopf-zeile", anker: "links", versatz: [60, 4], titel: "Planung je Projekt",
          text: "Ein Projektfertiger (z. B. Anlagen- oder Klinikbau) plant nicht nach Kalenderjahren allein, sondern je Projekt über die gesamte Laufzeit – hier von März 2027 bis September 2028. Die Spalten führen vom Ist über die Prognose des Gesamtprojekts bis zu den Quartalen des Geschäftsjahrs." },
        { nr: 2, ziel: "x-soz-C", versatz: [-36, 2], titel: "Chancen",
          text: "Chancen sind erwartete Einsparungen bei den Einzelkosten, etwa durch Nachverhandlung mit Lieferanten. Prognose lt. Projektliste − Chancen = Prognose nach Chancen: beim Material 2.321,2 − 150,0 = 2.171,2 Tsd. €." },
        { nr: 3, ziel: "l-fremd", versatz: [32, 3], titel: "Neue Prognose",
          text: "Die Projektleitung legt die neue Prognose für das Gesamtprojekt fest. „alle übernehmen“ setzt die Prognose nach Chancen ein; bei den sonstigen direkten Kosten wurde die Chance hier bewusst nicht übernommen (291,3 statt 276,3)." },
        { nr: 4, ziel: "x-be-J", versatz: [-16, 2], titel: "Restbeträge und Quartale",
          text: "Vom Rest der neuen Prognose wird zuerst das laufende Geschäftsjahr bis 30.06. abgezogen, dann das Geschäftsjahr 2027/28; was bleibt, fällt ins Folgejahr. Fremdbezogene Leistungen verteilt die Kostenverteilung oben auf die Quartale, Lohn und Leasing kommen je Quartal aus der Personaleinsatzplanung." },
        { nr: 5, ziel: "band-personalkostenplanung", anker: "links", versatz: [718, 2], titel: "Personalkosten",
          text: "Sozial- und Personalnebenkosten werden mit 80 % auf den produktiven Lohn geschlagen; Montagenebenkosten folgen dem Lohn im Verhältnis der neuen Prognose (21,55 %). Ändern Sie den Lohn eines Quartals: Zuschläge und Summen folgen." },
        { nr: 6, ziel: "x-bv-I", versatz: [-16, -2], titel: "Fertigstellungsgrad",
          text: "Der Fertigstellungsgrad misst den Fortschritt über die Kosten (Cost-to-Cost): kumulierte Einzelkosten ÷ Einzelkosten gesamt. Die Gesamtleistung einer Periode ist der entsprechende Anteil am Auftragswert; was noch nicht abgerechnet ist, erhöht als Bestandsveränderung den Bestand an unfertigen Leistungen." },
        { nr: 7, ziel: "x-mdb-J", versatz: [-16, -2], titel: "MOR-Schema",
          text: "Die Ergebnisrechnung des Projekts ist stufig: Gesamtleistung − fremdbezogene Leistungen = Eigenleistung − Personalkosten = DB Projektergebnis − Deckungsbedarf (40 % der Eigenleistung für Gemeinkosten) = Projektvollkostenergebnis. Mit der neuen Prognose bringt das Projekt −206,9 Tsd. €." },
        { nr: 8, ziel: "x-av-L", versatz: [-16, -2], titel: "Arbeitsvorrat",
          text: "Der Arbeitsvorrat ist die noch zu erbringende Gesamtleistung am Ende jeder Periode. Nach dem Geschäftsjahr 2027/28 bleiben 534,3 Tsd. € für das Folgejahr." },
      ],
    },
    gestaltung: {
      titel: "Gestaltung",
      intro: "Was gegenüber dem Original geändert wurde – softwareneutral im Buchstil und nach den Interaktionsprinzipien der DIN EN ISO 9241-110.",
      eintraege: [
        { nr: "A", ziel: "kopf", versatz: [-6, 6], regel: "BUCHSTIL – SOFTWARENEUTRAL", titel: "Kein Tabellenblatt-Fenster",
          text: "Fensterrahmen, Menü-, Symbol- und Bearbeitungsleiste, Zeilen- und Spaltenköpfe, Statusleiste und Taskleiste entfallen. „NL Erfurt“ und die Projektbezeichnung (eine reale Klinik) sind durch neutrale Angaben ersetzt, die Jahre auf 2027/28 gesetzt." },
        { nr: "B", ziel: "kopf-zeile", anker: "links", versatz: [92, 4], regel: "SELBSTBESCHREIBUNGSFÄHIGKEIT", titel: "Einheit Tsd. €",
          text: "Die Werte stehen in Tsd. € mit einer Nachkommastelle; die Einheit steht im Untertitel und über der Zeilenspalte. Das Original zeigte volle Euro ohne Einheit – 14 Wertspalten passen so nicht lesbar auf eine Buchseite." },
        { nr: "C", ziel: "x-mel-J", versatz: [-16, -2], regel: "SELBSTBESCHREIBUNGSFÄHIGKEIT", titel: "Eingabe und Anzeige unterscheidbar",
          text: "Eingabefelder sind weiß, berechnete Werte grau. Im Original bedeuteten Gelb (berechnet), Weiß mit fetter Kursivschrift (Eingabe), Grün (Projektdaten) und Türkis (Summen) etwas, ohne dass es erklärt war." },
        { nr: "D", ziel: "x-fg-C", versatz: [-36, 2], regel: "AUFGABENANGEMESSENHEIT", titel: "Chancen als Spalte",
          text: "Die Chancen standen im Original in einem Block über der Tabelle, die Materialchance sogar in einer ausgeblendeten Zeile. Als Spalte zwischen Projektliste und Prognose nach Chancen wird die Rechnung Liste − Chancen sichtbar." },
        { nr: "E", ziel: "l-pers", versatz: [32, 3], regel: "STEUERBARKEIT", titel: "Übernahme per Link",
          text: "Die Schaltflächen „alle übernehmen“ und „Übernahme Leasing, Lohn/Gehalt“ sowie die Pfeile je Zeile sind zu zwei Links in den Bändern zusammengefasst; die Pfeilspalte entfällt." },
        { nr: "F", ziel: "band-mor-schema", anker: "links", versatz: [718, 2], regel: "AUFGABENANGEMESSENHEIT", titel: "MOR-Schema verdichtet",
          text: "Das Original wiederholte im MOR-Schema Umsatz, Bestandsveränderung und alle sieben Kostenzeilen. Jetzt stehen dort die Stufen mit den Summen der Abschnitte darüber – dieselben Ergebnisse auf halber Höhe." },
        { nr: "G", ziel: "x-mpvk-J", versatz: [-16, -2], regel: "ERWARTUNGSKONFORMITÄT", titel: "Minus statt Rot",
          text: "Negative Werte tragen ein Minuszeichen statt roter Schrift; Spaltenköpfe sind kurz und nennen die Stichtage, Trennlinien gliedern Rest und Davon-Spalten. Der versteckte Sozialzuschlag von 80 % steht jetzt sichtbar oben rechts." },
        { nr: "H", ziel: "f-vk-Q", versatz: [30, -8], regel: "ROBUSTHEIT GEGEN BENUTZUNGSFEHLER", titel: "Eingaben werden geprüft",
          text: "Die Quartalsanteile müssen 100,00 % ergeben, sonst wird die Summe markiert; Beträge, Prozentwerte und Monate (MM/JJJJ) werden geprüft. Die Fertigstellung „Sep 2000“ lag im Original vor dem Ist-Stichtag und ist auf September 2028 korrigiert." },
      ],
    },
  });
  MK.fertig();
})();
